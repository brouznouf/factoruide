# Weekly dependency updates in two pull requests: the app's (Rust crates and npm packages
# together, as the Tauri crates and packages move in step) and the CI's (GitHub Actions). The Rust
# toolchain is pinned in rust-toolchain.toml and bumped on purpose, not here.
version: 2

multi-ecosystem-groups:
  app:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: app
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /app
    patterns: ["*"]
    multi-ecosystem-group: app
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci:
        patterns: ["*"]
    cooldown:
      default-days: 7
