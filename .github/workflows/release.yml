name: Release

# Pushing a tag vX.Y.Z (scripts/release.sh) builds the Windows installer, the macOS apps and the
# Linux app, signs the updates and publishes them as a GitHub release, with latest.json: installed
# apps offer it at startup. It also publishes the addons whose version is the tag's (addons.yml:
# CurseForge, Wago, zips in the release) and deploys the web app (web.yml: Cloudflare Pages). Run by hand with a tag, it builds the macOS and/or Linux apps and adds
# them to that tag's release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to add the apps to (vX.Y.Z)
        required: true
      platforms:
        description: Apps to build
        type: choice
        options: [macos and linux, macos, linux]
        default: macos and linux

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  # Built into the app: where the "Contribute" page sends the players' data (the web app's host
  # relays /v1/* to the contribution server: web/functions).
  FG_CONTRIBUTION_SERVER: https://factoruide.brouznouf.com
  # A published build: it checks for updates (local and development builds do not).
  FG_RELEASE: "1"
  # The addon's page the apps link to (repository variable, once its CurseForge project exists).
  VITE_FG_ADDON_URL: ${{ vars.ADDON_URL }}

# No caches in these jobs: one written by another workflow could slip into a signed build.
jobs:
  windows:
    name: Windows installer
    permissions:
      contents: write
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app version (Cargo.toml) comes from the tag; the tag message is the release notes.
      - name: Version and notes from the tag
        id: tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = .*/s//version = \"$version\"/" app/src-tauri/Cargo.toml
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "notes<<EOF"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Factoruide ${{ github.ref_name }}
          releaseBody: ${{ steps.tag.outputs.notes }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Added to the release the Windows job published (or the one given by hand), one after the other:
  # each adds its platform to latest.json, which two jobs at once would overwrite. Ad-hoc signed,
  # not notarized: macOS asks the player to allow the app the first time, not on updates.
  macos:
    name: macOS app (${{ matrix.arch }})
    permissions:
      contents: write
    needs: windows
    # Also when the Windows job is skipped (run by hand).
    if: ${{ !cancelled() && needs.windows.result != 'failure' && inputs.platforms != 'linux' }}
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
          - arch: Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Release of the tag (published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName
      - name: Version from the tag
        run: perl -0pi -e "s/^version = .*/version = \"${TAG#v}\"/m" app/src-tauri/Cargo.toml
      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          uploadUpdaterJson: true
          # The .dmg to install, the .app.tar.gz for the updates (left out of local builds). The
          # signature too, for the tags older than tauri.macos.conf.json. Single quotes:
          # tauri-action drops the double ones around an argument.
          args: >-
            --target ${{ matrix.target }} --bundles app,dmg
            --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'

  # After the macOS apps, for latest.json. Built on the oldest supported Ubuntu: the executable runs
  # on any distribution with this glibc or a newer one. The AppImage carries WebKitGTK and updates
  # itself; the executable alone needs the system's WebKitGTK 4.1.
  linux:
    name: Linux app (x86_64)
    permissions:
      contents: write
    needs: macos
    # Also when the previous jobs are skipped (run by hand).
    if: ${{ !cancelled() && needs.macos.result != 'failure' && inputs.platforms != 'macos' }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Release of the tag (published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName
      - name: Version from the tag
        run: sed -i "0,/^version = .*/s//version = \"${TAG#v}\"/" app/src-tauri/Cargo.toml
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          uploadUpdaterJson: true
          # The signature (left out of local builds) for the updates; single quotes as above.
          args: >-
            --bundles appimage
            --config '{"bundle":{"targets":["appimage"],"createUpdaterArtifacts":true}}'
      - name: Executable alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="Factoruide_${TAG#v}_amd64"
          cp target/release/factoruide-app "$out"
          tar czf "$out.tar.gz" "$out"
          gh release upload "$TAG" "$out.tar.gz" --clobber

  # The addons whose version is the tag's (addons.yml), once the release exists for their zips.
  addons:
    needs: windows
    if: github.event_name == 'push'
    uses: $/.github/workflows/addons.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

  # The web app of the tag (web.yml).
  web:
    if: github.event_name == 'push'
    uses: $/.github/workflows/web.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FG_PROXY_KEY: ${{ secrets.FG_PROXY_KEY }}
      FG_ORIGIN_HOST: ${{ secrets.FG_ORIGIN_HOST }}
