[package]
name = "factoruide-app"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
fg-route = { path = "../../crates/fg-route" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zstd = "0.13"
fg-contrib.workspace = true
ureq = { version = "2", features = ["json"] }
getrandom = "0.3"
tauri = { version = "2", features = [] }
# Updates published with the GitHub releases (latest.json), and the restart after installing one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[lints]
workspace = true
