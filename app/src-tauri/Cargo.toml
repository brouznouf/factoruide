[package]
name = "factoruide-app"
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
fg-app = { path = "../../crates/fg-app" }
fg-library = { path = "../../crates/fg-library" }
fg-route = { path = "../../crates/fg-route" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
fg-contrib.workspace = true
ureq = { version = "3", features = ["json"] }
tauri = { version = "2", features = [] }
# Updates published with the GitHub releases (latest.json), and the restart after installing one.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

[lints]
workspace = true
