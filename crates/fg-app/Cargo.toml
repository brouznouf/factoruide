[package]
name = "fg-app"
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
fg-contrib = { path = "../fg-contrib", default-features = false }
fg-library = { path = "../fg-library" }
fg-route = { path = "../fg-route" }
# Without parking_lot: its locks panic in the browser when a thread has to wait (no parking on wasm without nightly).
quick_cache = { version = "0.6", default-features = false, features = ["ahash"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
