[package]
name = "fg-route"
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23"
miniz_oxide = "0.9"
# Without parking_lot: its locks panic in the browser when a thread has to wait (no parking on wasm without nightly).
quick_cache = { version = "0.6", default-features = false, features = ["ahash"] }
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
zstd = "0.14"

[features]
# Small worlds and models built by hand, for tests (`fg_route::testing`).
testing = ["rusqlite/serialize", "rusqlite/trace"]

[lints]
workspace = true

[dev-dependencies]
# The prepare example lists the slow queries (`Connection::profile`).
rusqlite = { version = "0.41", features = ["bundled", "trace"] }
# The integration tests build their worlds with `fg_route::testing`.
fg-route = { path = ".", features = ["testing"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "walks"
harness = false

[[bench]]
name = "prepare"
harness = false

[[bench]]
name = "search"
harness = false
