[package]
name = "fg-route"
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23"
miniz_oxide = "0.8"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
zstd = "0.14"

[features]
# Small worlds and models built by hand, for tests (`fg_route::testing`).
testing = []

[lints]
workspace = true

[dev-dependencies]
# The integration tests build their worlds with `fg_route::testing`.
fg-route = { path = ".", features = ["testing"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "walks"
harness = false
