[package]
name = "fg-web"
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The app's backend for the browser: built for `wasm32-wasip1-threads` (see web/README.md), run
# by web/src/host in Web Workers sharing one memory, so that the planner's threads are threads.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
fg-app = { path = "../fg-app" }
fg-library = { path = "../fg-library" }
fg-route = { path = "../fg-route" }
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

[lints]
workspace = true

[dev-dependencies]
# The tests serve small worlds declared in fg-route's fixture files.
fg-route = { path = "../fg-route", features = ["testing"] }
