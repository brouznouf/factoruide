[package]
name = "fg"
publish = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
fg-route = { path = "../fg-route" }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde_json = "1"
zstd = "0.14"

[dev-dependencies]
# The tests run the program on a small world declared in fg-route's fixture files.
fg-route = { path = "../fg-route", features = ["testing"] }
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }

[lints]
workspace = true
