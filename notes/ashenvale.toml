objective = 1
icon = "pickup"

# Elemental Bracers: the Divining Scroll given with the quest combines the five intact bracers into the Divined Scroll; Tideress, a stronger elemental, patrols the lake.
[[note]]
quest = 1016
phase = "objective"
objective = 1
level = "warning"
en = "Once you have 5 {item:12220}, use the {item:5456} from your bags to turn them into the scroll you hand in. {npc:12759}, much stronger than the other elementals, patrols the lake."
fr = "Une fois les 5 {item:12220} réunis, utilisez {item:5456} de vos sacs pour les changer en parchemin à rendre. {npc:12759}, un élémentaire bien plus fort que les autres, patrouille sur le lac."
de = "Sobald du 5 {item:12220} hast, benutze {item:5456} aus deinen Taschen, um daraus die Schriftrolle zum Abgeben zu machen. {npc:12759}, ein viel stärkerer Elementar als die anderen, patrouilliert über den See."
es = "Cuando tengas 5 {item:12220}, usa {item:5456} desde tus bolsas para convertirlos en el pergamino que debes entregar. {npc:12759}, un elemental mucho más fuerte que los demás, patrulla el lago."
pt = "Quando tiver 5 {item:12220}, use {item:5456} das suas bolsas para transformá-los no pergaminho a entregar. {npc:12759}, um elemental bem mais forte que os outros, patrulha o lago."
ru = "Собрав 5 шт. {item:12220}, используйте {item:5456} из сумки, чтобы превратить их в свиток для сдачи. По озеру патрулирует {npc:12759} — элементаль намного сильнее остальных."
ko = "{item:12220} 5개를 모으면 가방의 {item:5456}을(를) 사용해 제출할 두루마리로 바꾸세요. 다른 정령보다 훨씬 강한 {npc:12759}이(가) 호수를 순찰합니다."
zh_cn = "集齐5个{item:12220}后，使用背包里的{item:5456}将其变成要上交的卷轴。比其他元素强得多的{npc:12759}在湖中巡逻。"
zh_tw = "集齊5個{item:12220}後，使用背包裡的{item:5456}將其變成要繳交的卷軸。比其他元素強得多的{npc:12759}在湖中巡邏。"

# Raene's Cleansing (Krolg): he camps above the waterfall on the lake's southeast side, reached by a torch-lit path; he only answers a player transformed by Dartol's Rod, and attacking ends the form.
[[note]]
quest = 1030
phase = "turnin"
level = "warning"
en = "{npc:3897} camps above the waterfall on the southeast side of the lake: follow the torches up the path east of the falls. Use {item:5462} before you reach him and do not attack him; attacking anything ends the disguise."
fr = "{npc:3897} campe au-dessus de la cascade, au sud-est du lac : suivez les torches sur le sentier à l'est de la chute. Utilisez {item:5462} avant d'arriver et ne l'attaquez pas ; attaquer quoi que ce soit met fin au déguisement."
de = "{npc:3897} lagert oberhalb des Wasserfalls im Südosten des Sees: folge den Fackeln den Pfad östlich der Fälle hinauf. Benutze {item:5462}, bevor du bei ihm ankommst, und greif ihn nicht an; jeder Angriff beendet die Verwandlung."
es = "{npc:3897} acampa sobre la cascada, al sureste del lago: sigue las antorchas por el sendero al este de la caída. Usa {item:5462} antes de llegar y no lo ataques; atacar cualquier cosa termina el disfraz."
pt = "{npc:3897} acampa acima da cachoeira, no sudeste do lago: siga as tochas pela trilha a leste da queda. Use {item:5462} antes de chegar e não o ataque; atacar qualquer coisa encerra o disfarce."
ru = "{npc:3897} стоит лагерем над водопадом на юго-восточном берегу озера: идите по тропе с факелами к востоку от водопада. Используйте {item:5462} до встречи с ним и не нападайте на него: любая атака снимает облик."
ko = "{npc:3897}은(는) 호수 남동쪽 폭포 위에 있습니다. 폭포 동쪽의 횃불이 놓인 길을 따라 올라가세요. 도착하기 전에 {item:5462}을(를) 사용하고 공격하지 마세요. 무엇이든 공격하면 변신이 풀립니다."
zh_cn = "{npc:3897}在湖东南侧的瀑布上方：沿瀑布东边点着火把的小路上去。到达前使用{item:5462}，不要攻击他；攻击任何目标都会解除变形。"
zh_tw = "{npc:3897}在湖東南側的瀑布上方：沿瀑布東邊點著火把的小路上去。到達前使用{item:5462}，不要攻擊他；攻擊任何目標都會解除變形。"

# The Howling Vale: past the tunnel, a rock on the left against the building's base reaches the tome's table with few fights.
[[note]]
quest = 1022
phase = "objective"
objective = 1
level = "info"
en = "The path up to the tunnel leaves the road to {zone:361} on its west side. Past the tunnel, climb onto the rock on the left against the building's base: {object:19027} is on the table just below, reachable after one or two pulls."
fr = "Le sentier vers le tunnel part de la route de {zone:361}, côté ouest. Après le tunnel, montez sur le rocher à gauche contre la base du bâtiment : {object:19027} est sur la table juste en dessous, accessible après un ou deux combats."
de = "Der Pfad zum Tunnel zweigt westlich von der Straße nach {zone:361} ab. Hinter dem Tunnel kletterst du auf den Felsen links am Fuß des Gebäudes: {object:19027} liegt auf dem Tisch direkt darunter, erreichbar nach ein, zwei Kämpfen."
es = "El sendero al túnel sale del camino a {zone:361} por el oeste. Pasado el túnel, sube a la roca de la izquierda junto a la base del edificio: {object:19027} está en la mesa justo debajo, accesible tras uno o dos combates."
pt = "A trilha até o túnel sai da estrada para {zone:361} pelo lado oeste. Depois do túnel, suba na rocha à esquerda junto à base do edifício: {object:19027} está na mesa logo abaixo, alcançável após um ou dois combates."
ru = "Тропа к туннелю отходит от дороги в {zone:361} с западной стороны. За туннелем залезьте на камень слева у основания здания: {object:19027} лежит на столе прямо под ним, и до него можно добраться после одного-двух боёв."
ko = "터널로 오르는 길은 {zone:361}(으)로 가는 길 서쪽에서 갈라집니다. 터널을 지나 왼쪽 건물 기단에 붙은 바위 위로 올라가세요. {object:19027}은(는) 바로 아래 탁자 위에 있으며, 한두 번만 싸우면 닿을 수 있습니다."
zh_cn = "通往隧道的小路从去{zone:361}的大路西侧分出。穿过隧道后，爬上左边靠着建筑基座的岩石：{object:19027}就在正下方的桌子上，打一两只怪就能拿到。"
zh_tw = "通往隧道的小路從去{zone:361}的大路西側分出。穿過隧道後，爬上左邊靠著建築基座的岩石：{object:19027}就在正下方的桌子上，打一兩隻怪就能拿到。"

# Forsaken Diseases: the undead around the camp stealth in and out and come in pairs; the camp is easier from behind its tent, and stealthed Ashenvale Outrunners nearby join fights.
[[note]]
quest = 1011
phase = "objective"
objective = 1
level = "warning"
en = "The undead around {object:18036} fade in and out of sight and often come in pairs. Approach the camp from behind its tent and pull them one at a time, or lead them to a stealthed {npc:12856} nearby, who joins in."
fr = "Les morts-vivants autour de {object:18036} disparaissent et réapparaissent et viennent souvent par deux. Abordez le camp par l'arrière de la tente et attirez-les un par un, ou menez-les vers une {npc:12856} camouflée à proximité, qui vous aidera."
de = "Die Untoten um {object:18036} tauchen auf und verschwinden wieder und kommen oft zu zweit. Nähere dich dem Lager von hinter dem Zelt und zieh sie einzeln, oder führ sie zu einem getarnten {npc:12856} in der Nähe, der mitkämpft."
es = "Los no-muertos alrededor de {object:18036} aparecen y desaparecen y suelen venir de dos en dos. Acércate al campamento por detrás de la tienda y atráelos de uno en uno, o llévalos hasta una {npc:12856} en sigilo cercana, que te ayudará."
pt = "Os mortos-vivos ao redor de {object:18036} somem e reaparecem e costumam vir em dupla. Aproxime-se do acampamento por trás da tenda e puxe-os um de cada vez, ou leve-os até um {npc:12856} furtivo por perto, que ajuda na luta."
ru = "Нежить вокруг {object:18036} то исчезает, то появляется и часто нападает парами. Подходите к лагерю со стороны за палаткой и выманивайте их по одному или ведите к незаметной {npc:12856} поблизости — она поможет."
ko = "{object:18036} 주변의 언데드는 모습을 감췄다 드러냈다 하며 종종 둘씩 덤빕니다. 천막 뒤쪽에서 야영지에 접근해 하나씩 끌어내거나, 근처에 은신한 {npc:12856}에게 데려가면 함께 싸워 줍니다."
zh_cn = "{object:18036}周围的亡灵会时隐时现，常常两个一起来。从帐篷后方接近营地，一次拉一个，或者把它们引到附近潜行的{npc:12856}那里，她会加入战斗。"
zh_tw = "{object:18036}周圍的亡靈會時隱時現，常常兩個一起來。從帳篷後方接近營地，一次拉一個，或者把牠們引到附近潛行的{npc:12856}那裡，她會加入戰鬥。"

# Insane Druids: the three druids are spread over the barrow den's levels; stealthed undead respawn quickly, so leaving by hearthstone saves the walk back.
[[note]]
quest = 1012
phase = "objective"
level = "warning"
en = "In the barrow den: {npc:3940} is across the first bridge; {npc:3941} at the bottom of the lower spiral (a bear, tracked as a beast); {npc:3942} on a balcony reached by a side tunnel and a bridge. Stealthed undead respawn fast: keep your hearthstone ready."
fr = "Dans le tertre : {npc:3940} est après le premier pont ; {npc:3941} au fond de la spirale inférieure (un ours, pistable comme bête) ; {npc:3942} sur un balcon, par un tunnel latéral et un pont. Les morts-vivants camouflés réapparaissent vite : gardez votre pierre de foyer prête."
de = "Im Grabhügel: {npc:3940} ist hinter der ersten Brücke; {npc:3941} ganz unten in der unteren Spirale (ein Bär, als Wildtier aufspürbar); {npc:3942} auf einem Balkon, über einen Seitentunnel und eine Brücke. Getarnte Untote erscheinen schnell neu: Halte den Ruhestein bereit."
es = "En el túmulo: {npc:3940} está tras el primer puente; {npc:3941} al fondo de la espiral inferior (un oso, rastreable como bestia); {npc:3942} en un balcón, por un túnel lateral y un puente. Los no-muertos en sigilo reaparecen rápido: ten lista tu piedra de hogar."
pt = "No túmulo: {npc:3940} fica depois da primeira ponte; {npc:3941} no fundo da espiral inferior (um urso, rastreável como fera); {npc:3942} numa sacada, por um túnel lateral e uma ponte. Os mortos-vivos furtivos reaparecem rápido: deixe sua pedra de regresso pronta."
ru = "В кургане: {npc:3940} за первым мостом; {npc:3941} в самом низу нижней спирали (медведь, отслеживается как зверь); {npc:3942} на балконе, куда ведут боковой туннель и мост. Незаметная нежить быстро возрождается: держите камень возвращения наготове."
ko = "무덤 굴에서 {npc:3940}은(는) 첫 다리 건너편에, {npc:3941}은(는) 아래쪽 나선 길 맨 밑에(곰이라 야수 추적에 잡힘), {npc:3942}은(는) 옆 터널과 다리를 지나는 발코니에 있습니다. 은신한 언데드가 빨리 재생성되니 귀환석을 준비해 두세요."
zh_cn = "在古墓里：{npc:3940}在第一座桥对面；{npc:3941}在下层螺旋道的最底部（是一只熊，追踪野兽可见）；{npc:3942}在经过侧面隧道和一座桥才能到的阳台上。潜行的亡灵重生很快：准备好炉石。"
zh_tw = "在古墓裡：{npc:3940}在第一座橋對面；{npc:3941}在下層螺旋道的最底部（是一隻熊，追蹤野獸可見）；{npc:3942}在經過側面隧道和一座橋才能到的陽台上。潛行的亡靈重生很快：準備好爐石。"

# Velinde's Effects: the locker is on the bunkhouse's upper floor, reached only over the bridge from the upper floor of the mail armour shop beside it.
[[note]]
quest = 1038
phase = "objective"
objective = 1
level = "info"
en = "{object:19877} is upstairs in the Sentinels' bunkhouse, which has no door of its own on that floor: go up through the mail armour shop next to it and cross the bridge."
fr = "{object:19877} est à l'étage du dortoir des Sentinelles, sans porte à ce niveau : montez par la boutique d'armures en mailles voisine et traversez la passerelle."
de = "{object:19877} steht oben in der Unterkunft der Schildwachen, die auf dieser Etage keine eigene Tür hat: Geh im Kettenrüstungsladen nebenan nach oben und über die Brücke."
es = "{object:19877} está en el piso de arriba del barracón de las centinelas, que no tiene puerta propia en esa planta: sube por la tienda de mallas de al lado y cruza el puente."
pt = "{object:19877} fica no andar de cima do alojamento das Sentinelas, que não tem porta própria nesse andar: suba pela loja de armaduras de malha ao lado e atravesse a ponte."
ru = "{object:19877} стоит на верхнем этаже казармы Часовых, у которого нет своей двери: поднимитесь в соседнюю лавку кольчужных доспехов и перейдите по мостику."
ko = "{object:19877}은(는) 파수병 숙소 위층에 있는데, 그 층에는 따로 문이 없습니다. 옆 사슬 갑옷 상점으로 올라가 다리를 건너세요."
zh_cn = "{object:19877}在哨兵宿舍楼上，那一层没有自己的门：从旁边的锁甲店上楼，走过小桥。"
zh_tw = "{object:19877}在哨兵宿舍樓上，那一層沒有自己的門：從旁邊的鎖甲店上樓，走過小橋。"

# Ruuzel: the rare naga walking the shore by her island drops the ring too, without guards.
[[note]]
quest = 1009
phase = "objective"
objective = 1
level = "info"
en = "{npc:10559}, a rare naga who walks the shore next to the island, also drops {item:5445} and is easier than {npc:3943}, who comes with two guards."
fr = "{npc:10559}, une naga rare qui longe le rivage près de l'île, donne aussi {item:5445} et est plus facile que {npc:3943}, toujours accompagnée de deux gardes."
de = "{npc:10559}, eine seltene Naga, die am Ufer neben der Insel entlangläuft, droppt ebenfalls {item:5445} und ist leichter als {npc:3943}, die zwei Wachen dabeihat."
es = "{npc:10559}, una naga rara que recorre la orilla junto a la isla, también suelta {item:5445} y es más fácil que {npc:3943}, que va con dos guardias."
pt = "{npc:10559}, uma naga rara que anda pela praia perto da ilha, também deixa cair {item:5445} e é mais fácil que {npc:3943}, que anda com dois guardas."
ru = "{npc:10559}, редкая нага, что бродит по берегу у острова, тоже роняет {item:5445}, и с ней проще справиться, чем с целью {npc:3943}, у которой два стража."
ko = "섬 옆 해안을 걷는 희귀 나가 {npc:10559}도 {item:5445}을(를) 떨어뜨리며, 경비병 둘을 거느린 {npc:3943}보다 쉽습니다."
zh_cn = "{npc:10559}是在岛旁海岸游荡的稀有娜迦，也会掉落{item:5445}，比带着两名护卫的{npc:3943}好打。"
zh_tw = "{npc:10559}是在島旁海岸遊蕩的稀有納迦，也會掉落{item:5445}，比帶著兩名護衛的{npc:3943}好打。"

