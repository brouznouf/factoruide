de = "Plündere {item:5388} von {npc:3696}: Diese Quest verlangt nur, ihn zu töten, aber der nächste Teil braucht seinen Schädel."
es = "Saquea {item:5388} de {npc:3696}: esta misión solo pide matarlo, pero la siguiente parte exige su cráneo."
