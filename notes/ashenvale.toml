# Freedom to Ruul: the escort walks on through the camps and two scripted packs of three ambush it.
[[note]]
quest = 6482
phase = "objective"
objective = 1
level = "warning"
en = "{npc:12818} walks straight through the furbolg camps without waiting: clear the way out first. Two groups of three ambush you, one at the fork inside the cave and one outside it."
fr = "{npc:12818} traverse les camps de furbolgs sans attendre : dégagez d'abord le chemin de sortie. Deux groupes de trois vous tendent une embuscade, l'un à la bifurcation dans la grotte, l'autre dehors."
de = "{npc:12818} läuft ohne zu warten mitten durch die Furbolglager: Räum vorher den Weg nach draußen frei. Zwei Dreiergruppen greifen aus dem Hinterhalt an, eine an der Gabelung in der Höhle, eine draußen."
es = "{npc:12818} cruza los campamentos de furbolgs sin esperar: despeja antes el camino de salida. Dos grupos de tres te emboscan, uno en la bifurcación de la cueva y otro fuera."
pt = "{npc:12818} atravessa os acampamentos de furbolgs sem esperar: limpe antes o caminho de saída. Dois grupos de três emboscam você, um na bifurcação dentro da caverna e outro do lado de fora."
ru = "{npc:12818} идёт прямо через лагеря фурболгов, не дожидаясь вас: заранее расчистите путь наружу. Две группы по трое устраивают засаду: одна у развилки в пещере, другая снаружи."
ko = "{npc:12818}은(는) 기다리지 않고 털보 야영지 한가운데를 지나갑니다. 나가는 길을 먼저 정리하세요. 셋씩 두 무리가 매복합니다. 하나는 동굴 안 갈림길, 하나는 동굴 밖입니다."
zh_cn = "{npc:12818}不会等你，会径直穿过熊怪营地：先清理出去的路。会有两批各三只的伏击，一批在洞内岔路口，一批在洞外。"
zh_tw = "{npc:12818}不會等你，會逕直穿過熊怪營地：先清理出去的路。會有兩批各三隻的伏擊，一批在洞內岔路口，一批在洞外。"

