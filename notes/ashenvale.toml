# Quest notes of Ashenvale. See notes/README.md for the format.

# Troll Charm: the chests are inside the cave at the top of the furbolg village; chests and
# furbolgs respawn quickly, so staying in one room is enough.
[[note]]
quest = 6462
phase = "objective"
objective = 1
level = "info"
en = "The {object:178144} chests are inside the cave at the top of the furbolg village (entrance under an arch, about 38, 30). Chests and furbolgs respawn fast: circle one room instead of going deep."
fr = "Les coffres {object:178144} se trouvent dans la grotte en haut du village des furbolgs (entrée sous une arche, vers 38, 30). Coffres et furbolgs réapparaissent vite : tournez dans une seule salle au lieu de vous enfoncer."
de = "Die Truhen ({object:178144}) stehen in der Höhle oben im Furbolgdorf (Eingang unter einem Bogen, etwa 38, 30). Truhen und Furbolgs respawnen schnell: zieh Kreise in einem Raum, statt tief hineinzugehen."
es = "Los cofres {object:178144} están dentro de la cueva en lo alto del poblado de los fúrbolg (entrada bajo un arco, hacia 38, 30). Cofres y fúrbolg reaparecen rápido: recorre una sola sala en vez de adentrarte."
pt = "Os baús {object:178144} ficam dentro da caverna no alto da aldeia dos furbolgs (entrada sob um arco, cerca de 38, 30). Baús e furbolgs ressurgem rápido: circule uma única sala em vez de ir fundo."
ru = "Сундуки ({object:178144}) стоят в пещере на вершине деревни фурболгов (вход под аркой, около 38, 30). Сундуки и фурболги быстро возрождаются: ходите по кругу в одном зале, не углубляясь."
ko = "{object:178144} 상자는 늑대인간 마을 꼭대기의 동굴 안에 있습니다(아치 아래 입구, 약 38, 30). 상자와 늑대인간이 빨리 재생성되니 깊이 들어가지 말고 한 방을 돌며 모으세요."
zh_cn = "{object:178144}位于熊怪村落顶部的洞穴内（入口在一道拱门下，约38, 30）。箱子和熊怪刷新很快：在一个房间里转圈即可，不必深入。"
zh_tw = "{object:178144}位於熊怪村落頂部的洞穴內（入口在一道拱門下，約38, 30）。箱子和熊怪重生很快：在一個房間裡繞圈即可，不必深入。"

# Vorsha the Lasher: the brazier cannot be used for a few minutes after someone finished the
# event; two waves of naga come before the hydra.
[[note]]
quest = 6641
phase = "objective"
objective = 1
level = "warning"
en = "If the brazier cannot be clicked, someone just finished the event: wait about 5 minutes for it to light again. Then come two waves of three naga (kill the priestesses first) before {npc:12940}."
fr = "Si le brasero ne peut pas être utilisé, quelqu'un vient de terminer l'événement : attendez environ 5 minutes qu'il se rallume. Viennent ensuite deux vagues de trois nagas (tuez d'abord les prêtresses) avant {npc:12940}."
de = "Lässt sich das Kohlebecken nicht anklicken, hat gerade jemand das Ereignis beendet: warte etwa 5 Minuten, bis es wieder brennt. Dann kommen zwei Wellen aus je drei Naga (töte zuerst die Priesterinnen), danach {npc:12940}."
es = "Si no puedes usar el brasero, alguien acaba de terminar el evento: espera unos 5 minutos a que vuelva a encenderse. Luego llegan dos oleadas de tres nagas (mata primero a las sacerdotisas) antes de {npc:12940}."
pt = "Se não der para clicar no braseiro, alguém acabou de terminar o evento: espere cerca de 5 minutos até ele acender de novo. Depois vêm duas ondas de três nagas (mate as sacerdotisas primeiro) antes de {npc:12940}."
ru = "Если жаровня не активируется, кто-то только что завершил событие: подождите около 5 минут, пока она снова загорится. Затем придут две волны по три наги (сначала убивайте жриц), а после них {npc:12940}."
ko = "화로를 클릭할 수 없다면 누군가 방금 이벤트를 마친 것입니다. 다시 불이 붙을 때까지 약 5분 기다리세요. 그다음 나가 셋씩 두 차례 몰려오고(사제부터 처치) 마지막으로 {npc:12940}이(가) 나타납니다."
zh_cn = "如果火盆无法点击，说明有人刚完成这个事件：等待约5分钟让它重新点燃。之后会来两波各三只纳迦（先杀女祭司），然后是{npc:12940}。"
zh_tw = "如果火盆無法點擊，表示有人剛完成這個事件：等待約5分鐘讓它重新點燃。之後會來兩波各三隻納迦（先殺女祭司），然後是{npc:12940}。"

# Ashenvale Outrunners: they are stealthed and stay by the tree trunks south of Splintertree Post.
[[note]]
quest = 6503
phase = "objective"
objective = 1
level = "info"
en = "{npc:12856} are stealthed and linger by the tree trunks on the slopes south of the outpost: walk around the trees pressing Tab, or use a /target macro, and listen for the stealth sound."
fr = "Les {npc:12856} sont camouflés et se tiennent près des troncs d'arbres sur les pentes au sud du poste : tournez autour des arbres en appuyant sur Tab, ou utilisez une macro /target, et guettez le bruit du camouflage."
de = "{npc:12856} sind getarnt und halten sich an den Baumstämmen auf den Hängen südlich des Postens auf: Geh mit Tab um die Bäume oder nutze ein /target-Makro und achte auf das Tarngeräusch."
es = "{npc:12856} están en sigilo junto a los troncos de los árboles en las laderas al sur del puesto: rodea los árboles pulsando Tab, o usa una macro /target, y atento al sonido del sigilo."
pt = "{npc:12856} ficam em furtividade junto aos troncos das árvores nas encostas ao sul do posto: contorne as árvores apertando Tab, ou use uma macro /target, e fique atento ao som de furtividade."
ru = "{npc:12856} скрыты незаметностью и держатся у стволов деревьев на склонах к югу от заставы: обходите деревья, нажимая Tab, или используйте макрос /target и прислушивайтесь к звуку незаметности."
ko = "{npc:12856}은(는) 은신 상태로 전초기지 남쪽 비탈의 나무 밑동 근처에 있습니다. Tab을 누르며 나무 주위를 돌거나 /target 매크로를 쓰고, 은신 소리에 귀를 기울이세요."
zh_cn = "{npc:12856}处于潜行状态，徘徊在哨站南边山坡的树干旁：一边按Tab一边绕着树走，或使用/target宏，并留意潜行的声音。"
zh_tw = "{npc:12856}處於潛行狀態，徘徊在哨站南邊山坡的樹幹旁：一邊按Tab一邊繞著樹走，或使用/target巨集，並留意潛行的聲音。"

# Torek's Assault: clearing the way first lets Torek run straight in; Duriel and her guards spawn by the entrance and attack the nearest target.
[[note]]
quest = 6544
phase = "objective"
objective = 1
level = "warning"
en = "Clear the road and the night elf outpost before talking to {npc:12858}: he runs straight in. Inside, {npc:12860} and her guards appear by the entrance and attack whoever is nearest; wait on the balcony and keep him alive."
fr = "Dégagez la route et l'avant-poste elfe de la nuit avant de parler à {npc:12858} : il y fonce directement. À l'intérieur, {npc:12860} et ses gardes apparaissent près de l'entrée et attaquent le plus proche ; attendez sur le balcon et gardez-le en vie."
de = "Räum die Straße und den Nachtelfenposten frei, bevor du mit {npc:12858} sprichst: Er rennt direkt hinein. Drinnen erscheinen {npc:12860} und ihre Wachen am Eingang und greifen den Nächsten an; warte auf dem Balkon und halte ihn am Leben."
es = "Limpia el camino y el puesto elfo de la noche antes de hablar con {npc:12858}: entra corriendo. Dentro, {npc:12860} y sus guardias aparecen junto a la entrada y atacan al más cercano; espera en el balcón y mantenlo con vida."
pt = "Limpe a estrada e o posto elfo noturno antes de falar com {npc:12858}: ele entra correndo. Lá dentro, {npc:12860} e os guardas dela surgem perto da entrada e atacam quem estiver mais perto; espere na sacada e mantenha-o vivo."
ru = "Расчистите дорогу и заставу ночных эльфов, прежде чем говорить с {npc:12858}: он бежит прямо туда. Внутри у входа появляются {npc:12860} и ее стражи и нападают на ближайшего; ждите на балконе и не дайте ему погибнуть."
ko = "{npc:12858}에게 말을 걸기 전에 길과 나이트 엘프 전초기지를 정리하세요. 그는 곧장 뛰어 들어갑니다. 안에서는 {npc:12860}와(과) 경비병들이 입구 근처에 나타나 가장 가까운 대상을 공격하니, 발코니에서 기다리며 그를 살려 두세요."
zh_cn = "和{npc:12858}对话前先清理道路和暗夜精灵哨站：他会直接冲进去。进去后，{npc:12860}和她的卫兵会在入口附近出现并攻击最近的目标；在阳台上等待，并保住他的性命。"
zh_tw = "和{npc:12858}對話前先清理道路和夜精靈哨站：他會直接衝進去。進去後，{npc:12860}和她的衛兵會在入口附近出現並攻擊最近的目標；在陽台上等待，並保住他的性命。"

# King of the Foulweald: Chief Murgut comes about three minutes after the banner is planted, furbolgs keep coming two at a time, and a lost banner means going back to Karang.
[[note]]
quest = 6621
phase = "objective"
objective = 1
level = "warning"
en = "{npc:12918} shows up about three minutes after the banner is planted. Furbolgs keep coming two at a time: control the first two rather than killing them, then burn him down. If the banner falls, a new one means walking back to {npc:12757}."
fr = "{npc:12918} arrive environ trois minutes après la pose de la bannière. Les furbolgs viennent sans cesse par deux : contrôlez les deux premiers plutôt que de les tuer, puis abattez-le. Si la bannière tombe, il faut retourner voir {npc:12757} pour en avoir une autre."
de = "{npc:12918} erscheint etwa drei Minuten, nachdem das Banner steht. Furbolgs kommen ständig zu zweit: Kontrolliere die ersten beiden, statt sie zu töten, dann schalte ihn schnell aus. Fällt das Banner, musst du für ein neues zurück zu {npc:12757}."
es = "{npc:12918} aparece unos tres minutos después de plantar el estandarte. Los furbolgs no dejan de llegar de dos en dos: controla a los dos primeros en lugar de matarlos y luego acaba con él. Si cae el estandarte, tendrás que volver con {npc:12757} por otro."
pt = "{npc:12918} aparece cerca de três minutos depois de o estandarte ser fincado. Os furbolgs não param de vir de dois em dois: controle os dois primeiros em vez de matá-los e depois derrube-o. Se o estandarte cair, é preciso voltar até {npc:12757} por outro."
ru = "{npc:12918} появляется примерно через три минуты после установки знамени. Фурболги идут по двое без конца: обездвижьте первых двух, а не убивайте, затем быстро убейте его. Если знамя падет, за новым придется возвращаться к {npc:12757}."
ko = "{npc:12918}은(는) 깃발을 꽂고 약 3분 뒤에 나타납니다. 펄볼그가 둘씩 계속 몰려오니 처음 둘은 죽이지 말고 제압해 두었다가 그를 빠르게 처치하세요. 깃발이 쓰러지면 새 깃발을 받으러 {npc:12757}에게 돌아가야 합니다."
zh_cn = "插下旗帜大约三分钟后{npc:12918}才会出现。熊怪会两只两只不断涌来：控制住最先的两只而不要杀死，然后迅速击杀他。如果旗帜倒下，就得回{npc:12757}那里重新领一面。"
zh_tw = "插下旗幟大約三分鐘後{npc:12918}才會出現。熊怪會兩隻兩隻不斷湧來：控制住最先的兩隻而不要殺死，然後迅速擊殺他。如果旗幟倒下，就得回{npc:12757}那裡重新領一面。"

[[icon]]
quest = 6621
phase = "objective"
objective = 1
icon = "event"

# Supplies to Auberdine: Feero is much weaker than the three ambushes on the way (4, then 3, then 3 attackers) and dies within seconds if they target him.
[[note]]
quest = 976
phase = "objective"
objective = 1
level = "warning"
en = "{npc:4484} is far weaker than the three ambushes on the way (4, then 3, then 3 attackers) and dies in seconds if they turn on him: take them all on yourself, and stay a little ahead of him so they reach you first. Easier in a group."
fr = "{npc:4484} est bien plus faible que les trois embuscades du trajet (4, puis 3, puis 3 assaillants) et meurt en quelques secondes s'ils s'en prennent à lui : attirez-les tous sur vous et restez un peu devant lui pour qu'ils vous atteignent d'abord. Plus simple en groupe."
de = "{npc:4484} ist viel schwächer als die drei Hinterhalte unterwegs (4, dann 3, dann 3 Angreifer) und stirbt in Sekunden, wenn sie sich auf ihn stürzen: zieh sie alle auf dich und bleib etwas vor ihm, damit sie zuerst dich erreichen. In einer Gruppe einfacher."
es = "{npc:4484} es mucho más débil que las tres emboscadas del camino (4, luego 3 y luego 3 atacantes) y muere en segundos si van a por él: atráelos a todos hacia ti y quédate un poco por delante para que te alcancen primero. Más fácil en grupo."
pt = "{npc:4484} é bem mais fraco que as três emboscadas do caminho (4, depois 3, depois 3 atacantes) e morre em segundos se eles o atacarem: puxe todos para você e fique um pouco à frente dele para que cheguem primeiro em você. Mais fácil em grupo."
ru = "{npc:4484} гораздо слабее трех засад на пути (4, затем 3, затем 3 противника) и гибнет за секунды, если они нападут на него: берите всех на себя и держитесь чуть впереди него, чтобы они сначала добрались до вас. В группе проще."
ko = "{npc:4484}은(는) 가는 길의 매복 세 번(4명, 3명, 3명)보다 훨씬 약해서 적들이 그를 노리면 몇 초 만에 죽습니다. 모든 적을 직접 끌어오고, 그보다 조금 앞서 가서 적이 먼저 당신에게 오게 하세요. 파티로 하면 더 쉽습니다."
zh_cn = "{npc:4484}比途中的三次伏击（4个、3个、再3个敌人）弱得多，敌人一旦转向他，几秒内他就会死：把所有敌人都拉到自己身上，并走在他前面一点，让敌人先找上你。组队会更轻松。"
zh_tw = "{npc:4484}比途中的三次伏擊（4個、3個、再3個敵人）弱得多，敵人一旦轉向他，幾秒內他就會死：把所有敵人都拉到自己身上，並走在他前面一點，讓敵人先找上你。組隊會更輕鬆。"

# Bathran's Hair: the plant bundles blend into the ground and vanish in the grass at high ground clutter settings.
[[note]]
quest = 1010
phase = "objective"
objective = 1
level = "info"
en = "{object:17282} is small and blends into the ground: set Ground Clutter to its lowest in the graphics options and the bundles stand out."
fr = "{object:17282} est petite et se confond avec le sol : réglez les détails du sol au minimum dans les options graphiques et les bottes ressortent nettement."
de = "{object:17282} ist klein und verschmilzt mit dem Boden: stell die Bodenvegetation in den Grafikoptionen auf das Minimum, dann fallen die Bündel sofort auf."
es = "{object:17282} es pequeño y se confunde con el suelo: pon los detalles del suelo al mínimo en las opciones gráficas y los paquetes se verán con claridad."
pt = "{object:17282} é pequeno e se confunde com o chão: coloque os detalhes do solo no mínimo nas opções gráficas e os pacotes aparecem com clareza."
ru = "{object:17282} — маленький предмет, сливающийся с землей: уменьшите детализацию земли до минимума в настройках графики, и пучки станут хорошо видны."
ko = "{object:17282}은(는) 작고 땅과 잘 구분되지 않습니다. 그래픽 설정에서 지면 효과를 최저로 낮추면 쉽게 눈에 띕니다."
zh_cn = "{object:17282}很小，和地面混在一起：在图像设置中把地表细节调到最低，草捆就会很显眼。"
zh_tw = "{object:17282}很小，和地面混在一起：在圖像設定中把地表細節調到最低，草捆就會很顯眼。"

# Raene's Cleansing (pommel): the pommel comes from a Rusty Chest that a slain Rotting Slime sometimes leaves on the ground, not from its loot.
[[note]]
quest = 1027
phase = "objective"
objective = 1
level = "info"
en = "The pommel is not in the loot: a slain {npc:3928} sometimes leaves a {object:19021} on the ground beside its corpse. Open it to get {item:5519}."
fr = "Le pommeau n'est pas dans le butin : une {npc:3928} tuée laisse parfois un {object:19021} au sol près de son cadavre. Ouvrez-le pour obtenir {item:5519}."
de = "Der Knauf ist nicht in der Beute: ein getöteter {npc:3928} hinterlässt manchmal eine {object:19021} neben seiner Leiche auf dem Boden. Öffne sie, um {item:5519} zu bekommen."
es = "El pomo no está en el botín: una {npc:3928} muerta a veces deja un {object:19021} en el suelo junto a su cadáver. Ábrelo para obtener {item:5519}."
pt = "O castão não vem no saque: um {npc:3928} morto às vezes deixa um {object:19021} no chão ao lado do cadáver. Abra-o para pegar {item:5519}."
ru = "Навершия нет в добыче: убитая {npc:3928} иногда оставляет на земле рядом с трупом {object:19021}. Откройте его, чтобы получить {item:5519}."
ko = "머리장식은 전리품으로 나오지 않습니다. 처치한 {npc:3928} 시체 옆 땅에 가끔 {object:19021}이(가) 생깁니다. 열어서 {item:5519}을(를) 얻으세요."
zh_cn = "柄头不在战利品里：被杀死的{npc:3928}有时会在尸体旁的地上留下一个{object:19021}。打开它即可获得{item:5519}。"
zh_tw = "柄頭不在戰利品裡：被殺死的{npc:3928}有時會在屍體旁的地上留下一個{object:19021}。打開它即可獲得{item:5519}。"

[[icon]]
quest = 1027
