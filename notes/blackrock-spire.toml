# Quest notes of Blackrock Spire. See notes/README.md for the format.

# Warlord's Command: Goretooth has no quest mark; his dialogue gives the letter that starts the quest.
[[note]]
quest = 4903
phase = "accept"
level = "warning"
en = "{npc:9077} shows no quest mark: talk to him and go through his dialogue. He gives you {item:12563}, which starts the quest."
fr = "{npc:9077} n'affiche aucun signe de quête : parlez-lui et suivez son dialogue. Il vous remet {item:12563}, qui lance la quête."
de = "{npc:9077} zeigt kein Questzeichen: Sprich ihn an und geh seinen Dialog durch. Er gibt dir {item:12563}, das die Quest startet."
es = "{npc:9077} no muestra ningún signo de misión: habla con él y recorre su diálogo. Te da {item:12563}, que inicia la misión."
pt = "{npc:9077} não mostra marca de missão: fale com ele e siga o diálogo. Ele entrega {item:12563}, que inicia a missão."
ru = "Над персонажем {npc:9077} нет значка задания: поговорите с ним и пройдите весь диалог. Он даст {item:12563}, который начинает задание."
ko = "{npc:9077}에게는 퀘스트 표시가 없습니다. 말을 걸어 대화를 끝까지 진행하면 퀘스트를 시작하는 {item:12563}을(를) 줍니다."
zh_cn = "{npc:9077}头上没有任务标记：和他对话并把对话进行完。他会给你{item:12563}，用它开始任务。"
zh_tw = "{npc:9077}頭上沒有任務標記：和他對話並把對話進行完。他會給你{item:12563}，用它開始任務。"

# Mother's Milk: the poison must be carried out of the instance to Ragged John; dispels, shapeshifting and Blink remove it.
[[note]]
quest = 4866
phase = "objective"
objective = 1
level = "must_read"
en = "Let {npc:10596} poison you, then leave the dungeon and reach {npc:9563} before it wears off. Do not let anyone cleanse it; shapeshifting or Blink also removes it."
fr = "Laissez {npc:10596} vous empoisonner, puis quittez le donjon et rejoignez {npc:9563} avant la fin de l'effet. Ne laissez personne le dissiper ; changer de forme ou utiliser Transfert l'enlève aussi."
de = "Lass dich von {npc:10596} vergiften, verlasse dann den Dungeon und erreiche {npc:9563}, bevor es abläuft. Lass es von niemandem reinigen; auch Gestaltwandel oder Blinzeln entfernt es."
es = "Deja que {npc:10596} te envenene, sal de la mazmorra y llega hasta {npc:9563} antes de que se pase. Que nadie te lo disipe; cambiar de forma o usar Traslación también lo quita."
pt = "Deixe {npc:10596} envenenar você, saia da masmorra e chegue a {npc:9563} antes que passe. Não deixe ninguém purificar; mudar de forma ou usar Lampejo também remove."
ru = "Позвольте противнику {npc:10596} отравить вас, затем покиньте подземелье и доберитесь до персонажа {npc:9563}, пока эффект не прошёл. Не давайте его рассеять; смена облика или Скачок тоже снимают его."
ko = "{npc:10596}에게 중독된 뒤 던전을 나와 효과가 끝나기 전에 {npc:9563}에게 가세요. 누구도 해제하지 못하게 하세요. 변신이나 점멸로도 사라집니다."
zh_cn = "让{npc:10596}使你中毒，然后离开副本，在效果消失前赶到{npc:9563}那里。别让任何人驱散它；变形或闪现术也会把它移除。"
zh_tw = "讓{npc:10596}使你中毒，然後離開副本，在效果消失前趕到{npc:9563}那裡。別讓任何人驅散它；變形或閃現術也會把它移除。"
