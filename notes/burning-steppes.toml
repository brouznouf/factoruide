# Quest notes of the Burning Steppes. See notes/README.md for the format.

# Broodling Essence: the device is used on a live broodling at short range, then the essence is a crystal on the corpse, not in its loot.
[[note]]
quest = 4726
phase = "objective"
objective = 1
level = "warning"
en = "Use {item:12284} on a living {npc:7047} from close range (taking damage interrupts it), kill it, then click the crystal that forms on the body: the essence is not in its loot."
fr = "Utilisez {item:12284} de près sur un {npc:7047} encore vivant (subir des dégâts l'interrompt), tuez-le, puis cliquez sur le cristal qui se forme sur le corps : l'essence n'est pas dans son butin."
de = "Benutze {item:12284} aus kurzer Entfernung an einem lebenden {npc:7047} (Schaden unterbricht es), töte ihn und klicke dann den Kristall an, der auf der Leiche entsteht: Die Essenz ist nicht in der Beute."
es = "Usa {item:12284} de cerca sobre un {npc:7047} vivo (recibir daño lo interrumpe), mátalo y luego haz clic en el cristal que se forma sobre el cuerpo: la esencia no está en su botín."
pt = "Use {item:12284} de perto em um {npc:7047} vivo (sofrer dano interrompe), mate-o e clique no cristal que se forma sobre o corpo: a essência não está no saque."
ru = "Примените {item:12284} вблизи к живому противнику {npc:7047} (урон прерывает действие), убейте его и щёлкните по кристаллу, появившемуся на теле: сущности нет в добыче."
ko = "살아 있는 {npc:7047}에게 가까이에서 {item:12284}을(를) 사용하고(피해를 입으면 끊깁니다), 처치한 뒤 시체 위에 생기는 수정을 클릭하세요. 정수는 전리품에 없습니다."
zh_cn = "靠近一只活着的{npc:7047}使用{item:12284}（受到伤害会打断），杀死它后点击尸体上出现的水晶：精华不在它的战利品里。"
zh_tw = "靠近一隻活著的{npc:7047}使用{item:12284}（受到傷害會打斷），殺死牠後點擊屍體上出現的水晶：精華不在牠的戰利品裡。"

# Krom'Grul: he has several spawn points across the three caves of Dreadmaul Rock and can spawn stuck inside the terrain.
[[note]]
quest = 3822
phase = "objective"
objective = 1
level = "warning"
en = "{npc:8977} spawns in any of the three caves of the ogre hill. Target him by name from outside to tell which one; he sometimes spawns inside the rock, out of reach until he respawns."
fr = "{npc:8977} apparaît dans n'importe laquelle des trois grottes de la colline des ogres. Ciblez-le par son nom depuis l'extérieur pour savoir laquelle ; il apparaît parfois dans la roche, hors d'atteinte jusqu'à sa réapparition."
de = "{npc:8977} erscheint in einer der drei Höhlen des Oger-Hügels. Wähle ihn von draußen per Namen als Ziel, um zu sehen, in welcher; manchmal steckt er im Fels und ist bis zum nächsten Respawn unerreichbar."
es = "{npc:8977} aparece en cualquiera de las tres cuevas de la colina de los ogros. Selecciónalo por su nombre desde fuera para saber en cuál; a veces aparece dentro de la roca, inalcanzable hasta que reaparezca."
pt = "{npc:8977} surge em qualquer uma das três cavernas da colina dos ogros. Selecione-o pelo nome do lado de fora para saber em qual; às vezes ele surge dentro da rocha, fora de alcance até reaparecer."
ru = "{npc:8977} появляется в любой из трёх пещер огрского холма. Возьмите его в цель по имени снаружи, чтобы понять, в какой; иногда он появляется внутри скалы и недоступен до следующего возрождения."
ko = "{npc:8977}은(는) 오우거 언덕의 동굴 세 곳 중 어디에나 나타납니다. 밖에서 이름으로 대상을 잡아 어느 동굴인지 확인하세요. 가끔 바위 속에 나타나 다시 나타날 때까지 닿을 수 없습니다."
zh_cn = "{npc:8977}会在食人魔山丘的三个洞穴中任意一个刷新。在外面按名字选中他就能判断是哪个洞；他有时会刷在岩石里，要等下次刷新才打得到。"
zh_tw = "{npc:8977}會在食人魔山丘的三個洞穴中任何一個重生。在外面按名字選取他就能判斷是哪個洞；他有時會重生在岩石裡，要等下次重生才打得到。"

[[icon]]
quest = 3822
phase = "objective"
objective = 1
icon = "rare"

# Extinguish the Firegut: the three Firegut kinds share spawn points, so a scarce kind comes back in place of the others.
[[note]]
quest = 3823
phase = "objective"
level = "info"
en = "{npc:7033}, {npc:7034} and {npc:7035} share spawn points: if one kind runs short, keep killing the others nearby and their spots come back as any of the three."
fr = "{npc:7033}, {npc:7034} et {npc:7035} partagent leurs points d'apparition : si une sorte manque, continuez à tuer les autres sur place, leurs emplacements reviennent sous l'une des trois formes."
de = "{npc:7033}, {npc:7034} und {npc:7035} teilen sich Spawnpunkte: Fehlt eine Sorte, töte weiter die anderen in der Nähe, ihre Plätze kommen als eine der drei zurück."
es = "{npc:7033}, {npc:7034} y {npc:7035} comparten puntos de aparición: si falta un tipo, sigue matando a los otros cerca y sus puntos vuelven como cualquiera de los tres."
pt = "{npc:7033}, {npc:7034} e {npc:7035} dividem pontos de surgimento: se faltar um tipo, continue matando os outros por perto e os pontos voltam como qualquer um dos três."
ru = "{npc:7033}, {npc:7034} и {npc:7035} делят точки появления: если какого-то вида не хватает, продолжайте убивать остальных рядом, и на их месте может появиться любой из трёх."
ko = "{npc:7033}, {npc:7034}, {npc:7035}은(는) 생성 지점을 공유합니다. 한 종류가 모자라면 근처의 다른 녀석들을 계속 잡으세요. 그 자리에 셋 중 아무나 다시 나타납니다."
zh_cn = "{npc:7033}、{npc:7034}和{npc:7035}共用刷新点：如果某一种不够，就继续杀附近的其他两种，它们的位置会刷出三种中的任意一种。"
zh_tw = "{npc:7033}、{npc:7034}和{npc:7035}共用重生點：如果某一種不夠，就繼續殺附近的其他兩種，牠們的位置會重生出三種中的任意一種。"

# Gor'tesh the Brute Lord: he is not elite but hits and stuns hard, with a linked caster guard and a patrol passing by his hut.
[[note]]
quest = 3824
phase = "objective"
objective = 1
level = "warning"
en = "{npc:9176} is not elite but hits very hard and stuns; a caster guard is linked to him and a patrol walks by his hut. Kill the patrol first, then pull him away from the hut."
fr = "{npc:9176} n'est pas élite mais frappe très fort et étourdit ; un garde lanceur de sorts lui est lié et une patrouille passe près de sa hutte. Tuez d'abord la patrouille, puis attirez-le loin de la hutte."
de = "{npc:9176} ist kein Elite, schlägt aber sehr hart zu und betäubt; ein zaubernder Wächter ist an ihn gekoppelt, und eine Patrouille kommt an seiner Hütte vorbei. Töte zuerst die Patrouille und zieh ihn dann von der Hütte weg."
es = "{npc:9176} no es élite pero pega muy fuerte y aturde; un guardia lanzador de hechizos está vinculado a él y una patrulla pasa junto a su choza. Mata primero a la patrulla y luego atráelo lejos de la choza."
pt = "{npc:9176} não é elite, mas bate muito forte e atordoa; um guarda conjurador está ligado a ele e uma patrulha passa pela cabana. Mate a patrulha primeiro e depois puxe-o para longe da cabana."
ru = "{npc:9176} не элитный, но бьет очень сильно и оглушает; с ним связан страж-заклинатель, а мимо его хижины ходит патруль. Сначала убейте патруль, затем выманите его подальше от хижины."
ko = "{npc:9176}은(는) 정예가 아니지만 매우 세게 때리고 기절시킵니다. 주문을 쓰는 경비병이 함께 끌려오고, 오두막 옆으로 순찰병이 지나갑니다. 순찰병을 먼저 처치한 뒤 오두막에서 멀리 끌어내세요."
zh_cn = "{npc:9176}不是精英，但打人很疼还会击晕；一个施法护卫与他关联，还有一支巡逻队会经过他的小屋。先杀掉巡逻队，再把他拉离小屋。"
zh_tw = "{npc:9176}不是精英，但打人很痛還會擊暈；一個施法護衛與他連動，還有一支巡邏隊會經過他的小屋。先殺掉巡邏隊，再把他拉離小屋。"

# The True Masters (4): Lady Prestor has no quest mark; while another player's later step plays out she ignores players or is gone for a few minutes.
[[note]]
quest = 4185
phase = "objective"
objective = 1
level = "warning"
en = "{npc:1749} shows no quest mark: talk to her anyway. If she ignores you or is missing, another player's later step is playing out: wait a few minutes for her to come back instead of abandoning."
fr = "{npc:1749} n'affiche aucun marqueur de quête : parlez-lui quand même. Si elle vous ignore ou est absente, l'étape suivante d'un autre joueur est en cours : attendez quelques minutes son retour au lieu d'abandonner."
de = "{npc:1749} zeigt kein Questsymbol: sprich trotzdem mit ihr. Ignoriert sie dich oder fehlt sie, läuft gerade der spätere Schritt eines anderen Spielers: warte ein paar Minuten auf ihre Rückkehr, statt abzubrechen."
es = "{npc:1749} no muestra marca de misión: habla con ella de todos modos. Si te ignora o no está, se está desarrollando el paso posterior de otro jugador: espera unos minutos a que vuelva en lugar de abandonar."
pt = "{npc:1749} não mostra marcador de missão: fale com ela mesmo assim. Se ela ignorar você ou não estiver lá, a etapa seguinte de outro jogador está em andamento: espere alguns minutos pela volta dela em vez de abandonar."
ru = "Над {npc:1749} нет значка задания: всё равно поговорите с ней. Если она вас игнорирует или её нет, идёт более поздний этап другого игрока: подождите несколько минут, пока она вернётся, а не отменяйте задание."
ko = "{npc:1749}에게는 퀘스트 표시가 없지만 그래도 말을 거세요. 반응이 없거나 보이지 않으면 다른 플레이어의 다음 단계가 진행 중입니다. 퀘스트를 포기하지 말고 몇 분 기다리면 돌아옵니다."
zh_cn = "{npc:1749}头上没有任务标记：照样和她对话。如果她不理你或不在，说明另一名玩家的后续步骤正在进行：等几分钟她回来，不要放弃任务。"
zh_tw = "{npc:1749}頭上沒有任務標記：照樣和她對話。如果她不理你或不在，表示另一名玩家的後續步驟正在進行：等幾分鐘她回來，不要放棄任務。"
