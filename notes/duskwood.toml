# Wait for Sirra to Finish: completing it raises Stitches at Raven Hill, who then walks the road to Darkshire.
[[note]]
quest = 401
phase = "turnin"
level = "warning"
en = "Finishing this step raises {npc:412}, a level 35 elite, who walks the road from the western cemetery to Darkshire and fights the guards there. You don't need to kill him: keep off that road for a few minutes."
fr = "Terminer cette étape réveille {npc:412}, un élite de niveau 35, qui suit la route depuis le cimetière de l'ouest jusqu'à Sombre-Comté et y combat les gardes. Inutile de le tuer : évitez cette route quelques minutes."
de = "Der Abschluss dieses Schritts erweckt {npc:412}, einen Elitegegner der Stufe 35, der die Straße vom Friedhof im Westen nach Dunkelhain entlangzieht und dort die Wachen bekämpft. Du musst ihn nicht töten: meide die Straße ein paar Minuten."
es = "Completar este paso despierta a {npc:412}, un élite de nivel 35, que recorre el camino desde el cementerio del oeste hasta Villa Oscura y lucha allí con los guardias. No hace falta matarlo: evita ese camino unos minutos."
pt = "Concluir esta etapa desperta {npc:412}, uma elite de nível 35, que segue a estrada do cemitério a oeste até Vila Sombria e luta com os guardas de lá. Não é preciso matá-lo: evite essa estrada por alguns minutos."
ru = "Завершение этого шага поднимает {npc:412}, элитного противника 35 уровня: он идет по дороге от западного кладбища к Темнолесью и бьется там со стражей. Убивать его не нужно: несколько минут держитесь подальше от дороги."
ko = "이 단계를 마치면 35레벨 정예 {npc:412}이(가) 깨어나 서쪽 묘지에서 어둠골까지 길을 따라 걸어와 경비병과 싸웁니다. 죽일 필요는 없으니 몇 분 동안 그 길을 피하세요."
zh_cn = "完成这一步会唤醒35级精英{npc:412}，他会沿道路从西边的墓地走到夜色镇并与卫兵交战。不必杀他：几分钟内避开这条路即可。"
zh_tw = "完成這一步會喚醒35級精英{npc:412}，他會沿道路從西邊的墓地走到夜色鎮並與衛兵交戰。不必殺他：幾分鐘內避開這條路即可。"
