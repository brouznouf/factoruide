# Quest notes of Dustwallow Marsh. See notes/README.md for the format.

# Theramore Spies: the infiltrators are stealthed and non-aggressive, scattered over the islets around the Horde village.
[[note]]
quest = 1201
phase = "objective"
objective = 1
level = "info"
en = "Every {npc:4834} is stealthed and passive, mostly on the small islands east and south of the Horde village. Walk slowly, listen for the stealth sound and spam a /target macro with its name."
fr = "Chaque {npc:4834} est camouflé et passif, surtout sur les îlots à l'est et au sud du village de la Horde. Marchez lentement, guettez le son du camouflage et répétez une macro /target avec son nom."
de = "Jeder {npc:4834} ist getarnt und passiv, meist auf den kleinen Inseln östlich und südlich des Hordendorfs. Geh langsam, achte auf das Tarngeräusch und nutz wiederholt ein /target-Makro mit seinem Namen."
es = "Cada {npc:4834} está en sigilo y es pasivo, sobre todo en los islotes al este y al sur del poblado de la Horda. Camina despacio, atento al sonido de sigilo, y usa sin parar una macro /target con su nombre."
pt = "Cada {npc:4834} fica furtivo e passivo, principalmente nas ilhotas a leste e ao sul da vila da Horda. Ande devagar, fique atento ao som de furtividade e use repetidamente uma macro /target com o nome dele."
ru = "Каждый {npc:4834} невидим и не нападает сам, в основном на островках к востоку и югу от деревни Орды. Идите медленно, прислушивайтесь к звуку незаметности и жмите макрос /target с его именем."
ko = "{npc:4834}은(는) 모두 은신 상태이며 먼저 공격하지 않고, 주로 호드 마을 동쪽과 남쪽의 작은 섬들에 있습니다. 천천히 걸으며 은신 소리에 귀 기울이고, 이름을 넣은 /target 매크로를 계속 누르세요."
zh_cn = "每个{npc:4834}都处于潜行状态且不会主动攻击，多在部落村庄东边和南边的小岛上。慢慢走，留意潜行的声音，并反复使用带其名字的/target宏。"
zh_tw = "每個{npc:4834}都處於潛行狀態且不會主動攻擊，多在部落村莊東邊和南邊的小島上。慢慢走，留意潛行的聲音，並反覆使用帶其名字的/target巨集。"

# Questioning Reethe: the event bugs if hostiles are left at the tent; four soldiers attack and Ogron's death fails the quest.
[[note]]
quest = 1273
phase = "objective"
objective = 1
level = "must_read"
en = "Before talking to {npc:4983}, check that {npc:4980} stands alone at the tent; kill any leftover attackers there first. Then stay right next to the ogre: four Theramore soldiers ambush you, and the quest fails if he dies."
fr = "Avant de parler à {npc:4983}, vérifiez que {npc:4980} est seul sous la tente ; tuez d'abord les éventuels assaillants restés là. Restez ensuite collé à l'ogre : quatre soldats de Theramore vous attaquent, et la quête échoue s'il meurt."
de = "Bevor du mit {npc:4983} sprichst, prüf, dass {npc:4980} allein am Zelt steht; töte vorher übrig gebliebene Angreifer dort. Bleib dann direkt beim Oger: Vier Soldaten aus Theramore greifen an, und die Quest scheitert, wenn er stirbt."
es = "Antes de hablar con {npc:4983}, comprueba que {npc:4980} está solo en la tienda; mata antes a los atacantes que queden allí. Luego quédate pegado al ogro: te emboscan cuatro soldados de Theramore y la misión falla si él muere."
pt = "Antes de falar com {npc:4983}, confira se {npc:4980} está sozinho na barraca; mate antes os atacantes que tiverem ficado lá. Depois fique colado no ogro: quatro soldados de Theramore emboscam vocês, e a missão falha se ele morrer."
ru = "Прежде чем говорить с персонажем {npc:4983}, убедитесь, что {npc:4980} стоит у палатки один; сначала убейте оставшихся там нападающих. Затем держитесь вплотную к огру: нападут четыре солдата Терамора, и задание провалится, если он погибнет."
ko = "{npc:4983}에게 말을 걸기 전에 {npc:4980}이(가) 천막에 혼자 있는지 확인하고, 남아 있는 공격자가 있으면 먼저 처치하세요. 그다음 오우거 바로 곁에 붙어 있으세요. 테라모어 병사 넷이 기습하며, 그가 죽으면 퀘스트가 실패합니다."
zh_cn = "与{npc:4983}对话前，先确认{npc:4980}独自站在帐篷旁；若有残留的袭击者，先把它们杀掉。随后紧贴食人魔：四名塞拉摩士兵会伏击你们，他一旦死亡任务即失败。"
zh_tw = "與{npc:4983}對話前，先確認{npc:4980}獨自站在帳篷旁；若有殘留的襲擊者，先把他們殺掉。隨後緊貼食人魔：四名塞拉摩士兵會伏擊你們，他一旦死亡任務即失敗。"

# The Theramore Docks: the footlocker is underwater by the north-eastern dock, where an elite Coral Shark patrols.
[[note]]
quest = 1202
phase = "objective"
objective = 1
level = "warning"
en = "The {object:20925} lies on the sea floor under the north-eastern dock of Theramore. A {npc:5434} (elite, level 46) patrols there and may rest beside the chest: wait until it swims off."
fr = "La {object:20925} repose au fond de la mer sous le quai nord-est de Theramore. Un {npc:5434} (élite, niveau 46) patrouille là et s'arrête parfois près du coffre : attendez qu'il s'éloigne."
de = "Die {object:20925} liegt auf dem Meeresgrund unter dem Nordostkai von Theramore. Ein {npc:5434} (Elite, Stufe 46) patrouilliert dort und hält sich manchmal an der Kiste auf: Warte, bis er wegschwimmt."
es = "El {object:20925} está en el fondo del mar bajo el muelle noreste de Theramore. Un {npc:5434} (élite, nivel 46) patrulla la zona y a veces se queda junto al cofre: espera a que se aleje."
pt = "O {object:20925} fica no fundo do mar sob o cais nordeste de Theramore. Um {npc:5434} (elite, nível 46) patrulha ali e às vezes para junto ao baú: espere até ele se afastar."
ru = "«{object:20925}» лежит на дне под северо-восточным причалом Терамора. Там патрулирует {npc:5434} (элита, 46-й уровень), иногда останавливаясь у сундука: дождитесь, пока он уплывёт."
ko = "{object:20925}은(는) 테라모어 북동쪽 부두 아래 바닷속에 있습니다. {npc:5434}(정예, 46레벨)이 그 주변을 순찰하며 상자 옆에 머물기도 하니 멀어질 때까지 기다리세요."
zh_cn = "{object:20925}位于塞拉摩东北码头下方的海底。一只{npc:5434}（精英，46级）在附近巡游，有时停在箱子旁：等它游走再去。"
zh_tw = "{object:20925}位於塞拉摩東北碼頭下方的海底。一隻{npc:5434}（精英，46級）在附近巡游，有時停在箱子旁：等牠游走再去。"

# Lieutenant Paval Reethe: the badge is a tiny object on the lone floor plank of the burned inn.
[[note]]
quest = 1252
phase = "accept"
level = "info"
en = "{object:21042} is tiny: it sits on the lone floor plank inside the burned inn, not on the two crossed ones. Stand right next to that plank and sweep your cursor over it."
fr = "{object:21042} est minuscule : il se trouve sur la planche isolée au sol de l'auberge incendiée, pas sur les deux planches croisées. Placez-vous juste à côté et balayez-la avec le curseur."
de = "{object:21042} ist winzig: Es liegt auf der einzelnen Bodenplanke im abgebrannten Gasthaus, nicht auf den zwei gekreuzten. Stell dich direkt daneben und fahr mit dem Mauszeiger darüber."
es = "{object:21042} es diminuta: está sobre el tablón suelto del suelo de la posada quemada, no sobre los dos cruzados. Ponte justo al lado y pasa el cursor por encima."
pt = "{object:21042} é minúscula: fica sobre a tábua solta no chão da estalagem queimada, não sobre as duas cruzadas. Fique bem ao lado dela e passe o cursor por cima."
ru = "{object:21042} совсем маленькая: она лежит на отдельной доске на полу сгоревшей таверны, а не на двух скрещённых. Встаньте вплотную к доске и проведите по ней курсором."
ko = "{object:21042}은(는) 아주 작습니다. 불탄 여관 바닥의 교차된 두 판자가 아니라 따로 놓인 판자 위에 있습니다. 그 판자 바로 옆에 서서 커서로 훑어보세요."
zh_cn = "{object:21042}非常小：它在烧毁旅店地上单独的那块木板上，而不是交叉的两块。站到那块木板旁边，用鼠标在上面扫一扫。"
zh_tw = "{object:21042}非常小：它在燒毀旅店地上單獨的那塊木板上，而不是交叉的兩塊。站到那塊木板旁邊，用滑鼠在上面掃一掃。"

# The Deserters: Balos Jacken attacks on entering the tower and must be beaten until he surrenders before he talks.
[[note]]
quest = 1286
phase = "turnin"
level = "warning"
en = "{npc:5089} jumps down and attacks as soon as you enter the tower; the other deserters stay out of it. Beat him until he gives up, at about a quarter of his health, then talk to him to hand in."
fr = "{npc:5089} saute d'un étage et attaque dès que vous entrez dans la tour ; les autres déserteurs ne s'en mêlent pas. Battez-le jusqu'à ce qu'il se rende, vers un quart de sa vie, puis parlez-lui pour rendre la quête."
de = "{npc:5089} springt herunter und greift an, sobald du den Turm betrittst; die anderen Deserteure halten sich heraus. Kämpfe, bis er bei etwa einem Viertel seiner Gesundheit aufgibt, und sprich ihn dann zur Abgabe an."
es = "{npc:5089} salta desde arriba y ataca en cuanto entras en la torre; los demás desertores no intervienen. Pelea hasta que se rinda, hacia un cuarto de su salud, y luego háblale para entregar la misión."
pt = "{npc:5089} pula de cima e ataca assim que você entra na torre; os outros desertores não se metem. Lute até ele se render, com cerca de um quarto da vida, e depois fale com ele para entregar a missão."
ru = "{npc:5089} спрыгивает сверху и нападает, как только вы входите в башню; остальные дезертиры не вмешиваются. Бейте его, пока он не сдастся (примерно на четверти здоровья), затем поговорите с ним, чтобы сдать задание."
ko = "탑에 들어서자마자 {npc:5089}이(가) 뛰어내려 공격합니다. 다른 탈영병은 끼어들지 않습니다. 생명력이 4분의 1쯤 남아 항복할 때까지 싸운 뒤 말을 걸어 퀘스트를 완료하세요."
zh_cn = "你一进塔，{npc:5089}就会跳下来攻击；其他逃兵不会插手。把他打到约四分之一生命值投降，然后和他对话交任务。"
zh_tw = "你一進塔，{npc:5089}就會跳下來攻擊；其他逃兵不會插手。把他打到約四分之一生命值投降，然後和他對話交任務。"

# The Missing Diplomat (Hendel): accepting starts a fight with Hendel and his two guards; the event jams when Jaina's party is already there.
[[note]]
quest = 1324
phase = "objective"
level = "warning"
en = "Accepting makes {npc:4966} and his two guards attack: drag a mob into the camp first to keep the guards busy, or fight near the tower guards. If {npc:4968} and {npc:4967} already stand there, wait until they leave. If you fail, abandon, wait about 5 minutes and retake it."
fr = "Accepter fait attaquer {npc:4966} et ses deux gardes : attirez d'abord un monstre dans le camp pour occuper les gardes, ou combattez près des gardes de la tour. Si {npc:4968} et {npc:4967} sont déjà là, attendez leur départ. En cas d'échec, abandonnez, attendez 5 minutes et reprenez-la."
de = "Beim Annehmen greifen {npc:4966} und seine zwei Wachen an: Zieh vorher ein Monster ins Lager, um die Wachen zu beschäftigen, oder kämpfe bei den Turmwachen. Stehen {npc:4968} und {npc:4967} schon da, warte, bis sie gehen. Scheiterst du, brich ab, warte etwa 5 Minuten und nimm sie neu an."
es = "Al aceptar, {npc:4966} y sus dos guardias atacan: arrastra antes un monstruo al campamento para ocupar a los guardias, o lucha cerca de los guardias de la torre. Si {npc:4968} y {npc:4967} ya están allí, espera a que se vayan. Si fallas, abandona, espera unos 5 minutos y vuelve a aceptarla."
pt = "Ao aceitar, {npc:4966} e seus dois guardas atacam: puxe antes um monstro para o acampamento para ocupar os guardas, ou lute perto dos guardas da torre. Se {npc:4968} e {npc:4967} já estiverem lá, espere irem embora. Se falhar, abandone, espere uns 5 minutos e pegue de novo."
ru = "При принятии {npc:4966} и два его стража нападают: заранее заведите в лагерь моба, чтобы занять стражей, или деритесь у стражи башни. Если {npc:4968} и {npc:4967} уже стоят там, дождитесь их ухода. При провале откажитесь, подождите минут 5 и возьмите заново."
ko = "수락하면 {npc:4966}와(과) 경비병 둘이 공격합니다. 먼저 몬스터를 야영지로 끌고 와 경비병을 붙잡아 두거나 탑 경비병 근처에서 싸우세요. {npc:4968}와(과) {npc:4967}이(가) 이미 있다면 떠날 때까지 기다리세요. 실패하면 포기하고 5분쯤 뒤 다시 받으세요."
zh_cn = "接受后{npc:4966}和他的两名卫兵会攻击：先拉一只怪进营地牵制卫兵，或在塔楼卫兵附近战斗。如果{npc:4968}和{npc:4967}已经站在那里，等她们离开。失败的话放弃任务，等约5分钟再接。"
zh_tw = "接受後{npc:4966}和他的兩名衛兵會攻擊：先拉一隻怪進營地牽制衛兵，或在塔樓衛兵附近戰鬥。如果{npc:4968}和{npc:4967}已經站在那裡，等她們離開。失敗的話放棄任務，等約5分鐘再接。"

# The Missing Diplomat: Tervosh and Jaina appear at Hendel's camp only briefly before teleporting back to Theramore.
[[note]]
quest = 1324
phase = "turnin"
level = "info"
en = "{npc:4967} and {npc:4968} appear at the camp once {npc:4966} gives up: hand in here and take {quest:1267} from Jaina at once, before they teleport away. Otherwise Jaina waits at the top of her tower in Theramore."
fr = "{npc:4967} et {npc:4968} apparaissent au camp dès que {npc:4966} se rend : rendez la quête sur place et prenez aussitôt {quest:1267} auprès de Jaina, avant qu'ils ne se téléportent. Sinon, Jaina attend au sommet de sa tour à Theramore."
de = "{npc:4967} und {npc:4968} erscheinen im Lager, sobald {npc:4966} aufgibt: Gib dort ab und nimm sofort {quest:1267} bei Jaina an, bevor sie sich wegteleportieren. Sonst wartet Jaina oben in ihrem Turm in Theramore."
es = "{npc:4967} y {npc:4968} aparecen en el campamento en cuanto {npc:4966} se rinde: entrega allí y acepta enseguida {quest:1267} de Jaina, antes de que se teletransporten. Si no, Jaina espera en lo alto de su torre en Theramore."
pt = "{npc:4967} e {npc:4968} aparecem no acampamento assim que {npc:4966} se rende: entregue ali e pegue logo {quest:1267} com Jaina, antes que se teleportem. Senão, Jaina espera no alto da torre dela em Theramore."
ru = "{npc:4967} и {npc:4968} появляются в лагере, как только {npc:4966} сдаётся: сдайте задание там и сразу возьмите у Джайны «{quest:1267}», пока они не телепортировались. Иначе Джайна ждёт на вершине своей башни в Тераморе."
ko = "{npc:4966}이(가) 항복하면 {npc:4967}와(과) {npc:4968}이(가) 야영지에 나타납니다. 그들이 순간이동해 떠나기 전에 바로 여기서 완료하고 제이나에게 {quest:1267}을(를) 받으세요. 놓치면 제이나는 테라모어의 자기 탑 꼭대기에 있습니다."
zh_cn = "{npc:4966}投降后，{npc:4967}和{npc:4968}会出现在营地：趁他们传送离开前，当场交任务并立刻从吉安娜那里接{quest:1267}。否则吉安娜会在塞拉摩她的法师塔顶层等你。"
zh_tw = "{npc:4966}投降後，{npc:4967}和{npc:4968}會出現在營地：趁他們傳送離開前，當場交任務並立刻從珍娜那裡接{quest:1267}。否則珍娜會在塞拉摩她的法師塔頂層等你。"

# The Exorcism: the 3-minute limit runs until the turn-in; critters nearby join the fight; a failed attempt is retried by abandoning and retaking.
[[note]]
quest = 1955
level = "warning"
en = "Clear the critters around the garden before you start: the 3-minute timer runs until you hand in to {npc:6546}, so go back to her right after the kill. If it fails, abandon the quest and take it again."
fr = "Éliminez les bestioles autour du jardin avant de commencer : le délai de 3 minutes court jusqu'au rendu à {npc:6546}, revenez donc la voir juste après la mise à mort. En cas d'échec, abandonnez la quête et reprenez-la."
de = "Räume vor dem Start die Kleintiere um den Garten weg: das 3-Minuten-Zeitlimit läuft bis zur Abgabe bei {npc:6546}, geh also direkt nach dem Kill zu ihr zurück. Scheitert sie, brich die Quest ab und nimm sie neu an."
es = "Limpia las alimañas alrededor del jardín antes de empezar: el límite de 3 minutos corre hasta que entregues a {npc:6546}, así que vuelve con ella justo después de matarlo. Si fallas, abandona la misión y acéptala de nuevo."
pt = "Limpe os bichos em volta do jardim antes de começar: o limite de 3 minutos corre até a entrega a {npc:6546}, então volte a ela logo após a morte. Se falhar, abandone a missão e pegue-a de novo."
ru = "Перед началом перебейте зверушек вокруг сада: трёхминутный таймер идёт до сдачи {npc:6546}, так что возвращайтесь к ней сразу после убийства. При провале отмените задание и возьмите его снова."
ko = "시작하기 전에 정원 주변의 동물을 처치하세요. 3분 제한은 {npc:6546}에게 보고할 때까지 흐르니, 처치 직후 바로 그녀에게 돌아가세요. 실패하면 퀘스트를 포기하고 다시 받으세요."
zh_cn = "开始前先清掉花园周围的小动物：3分钟时限一直计到向{npc:6546}交任务为止，所以击杀后立刻回去找她。失败的话就放弃任务再重新接。"
zh_tw = "開始前先清掉花園周圍的小動物：3分鐘時限一直計到向{npc:6546}交任務為止，所以擊殺後立刻回去找她。失敗的話就放棄任務再重新接。"
