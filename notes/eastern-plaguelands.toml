# Quest notes of the Eastern Plaguelands. See notes/README.md for the format.

# To Kill With Purpose: Living Rot does not stack and has a 10-minute timer that starts on looting; deleting it abandons the quest.
[[note]]
quest = 6022
phase = "objective"
objective = 1
level = "warning"
en = "{item:15447} does not stack and expires 10 minutes after you loot it. Kill several undead first, then loot them all at once, with enough free bag slots."
fr = "{item:15447} ne s'empile pas et disparaît 10 minutes après avoir été ramassée. Tuez d'abord plusieurs morts-vivants, puis fouillez-les tous d'un coup, avec assez de place libre dans vos sacs."
de = "{item:15447} ist nicht stapelbar und verschwindet 10 Minuten nach dem Plündern. Töte erst mehrere Untote und plündere sie dann alle auf einmal, mit genug freien Taschenplätzen."
es = "{item:15447} no se apila y caduca 10 minutos después de despojarla. Mata primero a varios no-muertos y despójalos todos a la vez, con huecos libres en las bolsas."
pt = "{item:15447} não empilha e expira 10 minutos depois de saqueada. Mate primeiro vários mortos-vivos e saqueie todos de uma vez, com espaços livres nas bolsas."
ru = "{item:15447} не складывается в стопку и пропадает через 10 минут после добычи. Сначала убейте нескольких нежитей, затем обыщите их всех разом; освободите место в сумках."
ko = "{item:15447}은(는) 겹쳐지지 않고 획득 10분 뒤에 사라집니다. 언데드를 여러 마리 먼저 처치한 뒤 한꺼번에 전리품을 챙기고, 가방 칸을 충분히 비워 두세요."
zh_cn = "{item:15447}无法堆叠，拾取10分钟后就会消失。先杀掉几只亡灵，再一次性拾取，并留出足够的背包空位。"
zh_tw = "{item:15447}無法堆疊，拾取10分鐘後就會消失。先殺掉幾隻不死生物，再一次拾取，並留出足夠的背包空位。"

# Pamela's Doll: the three parts spawn at random spots in the Darrowshire houses, each calls a ghost, and they must be combined from the bags.
[[note]]
quest = 5149
phase = "objective"
objective = 1
level = "warning"
en = "The doll's parts can lie in any of the three houses, and taking each one calls a {npc:10940}. Once you hold all three, right-click one of them to put the doll together."
fr = "Les morceaux de la poupée peuvent se trouver dans n'importe laquelle des trois maisons, et chacun ramassé fait apparaître un {npc:10940}. Une fois les trois en main, faites un clic droit sur l'un d'eux pour reconstituer la poupée."
de = "Die Teile der Puppe können in jedem der drei Häuser liegen, und jedes aufgehobene Teil ruft einen {npc:10940} herbei. Hast du alle drei, klicke eines mit Rechtsklick an, um die Puppe zusammenzusetzen."
es = "Las piezas de la muñeca pueden estar en cualquiera de las tres casas, y cada una que cojas invoca a un {npc:10940}. Cuando tengas las tres, haz clic derecho en una para montar la muñeca."
pt = "As partes da boneca podem estar em qualquer uma das três casas, e cada uma que você pega invoca um {npc:10940}. Com as três em mãos, clique com o botão direito em uma delas para montar a boneca."
ru = "Части куклы могут лежать в любом из трёх домов, и каждая подобранная призывает {npc:10940}. Собрав все три, щёлкните правой кнопкой по одной из них, чтобы собрать куклу."
ko = "인형 조각은 세 집 중 어디에나 있을 수 있으며, 조각을 하나 집을 때마다 {npc:10940}이(가) 나타납니다. 세 조각을 모두 모으면 그중 하나를 오른쪽 클릭해 인형을 맞추세요."
zh_cn = "娃娃的部件可能在三座房子中的任意一座里，每拿起一个都会招来一个{npc:10940}。集齐三个后，右键点击其中一个把娃娃拼起来。"
zh_tw = "娃娃的部件可能在三棟房子中的任何一棟裡，每拿起一個都會招來一個{npc:10940}。集齊三個後，右鍵點擊其中一個把娃娃拼起來。"

[[icon]]
quest = 5149
phase = "objective"
objective = 1
icon = "pickup"

# Of Forgotten Memories: only Mercutio must die, his corpse despawns fast; the gap in the graveyard fence splits his helpers.
[[note]]
quest = 5781
phase = "objective"
objective = 1
level = "warning"
en = "The mound calls {npc:11886} and his helpers. Only he must die: loot {item:14613} at once, his body vanishes quickly. Jumping through the gap in the fence by the grave makes the others walk the long way round."
fr = "Le monticule fait venir {npc:11886} et ses acolytes. Seul lui doit mourir : ramassez {item:14613} aussitôt, son corps disparaît vite. Sauter par la brèche de la clôture près de la tombe oblige les autres à faire le tour."
de = "Der Erdhügel ruft {npc:11886} und seine Helfer. Nur er muss sterben: Plündere {item:14613} sofort, seine Leiche verschwindet schnell. Springst du durch die Lücke im Zaun beim Grab, müssen die anderen außen herumlaufen."
es = "El montículo invoca a {npc:11886} y sus secuaces. Solo él debe morir: despoja {item:14613} enseguida, su cuerpo desaparece pronto. Saltar por el hueco de la valla junto a la tumba obliga a los demás a dar la vuelta."
pt = "O monte invoca {npc:11886} e seus ajudantes. Só ele precisa morrer: saqueie {item:14613} na hora, o corpo some rápido. Pular pela abertura da cerca junto ao túmulo obriga os outros a dar a volta."
ru = "Холмик призывает {npc:11886} и его подручных. Убить нужно только его: сразу заберите {item:14613}, тело быстро исчезает. Прыжок через пролом в ограде у могилы заставит остальных идти в обход."
ko = "흙더미를 누르면 {npc:11886}와(과) 부하들이 나타납니다. 그만 죽이면 됩니다. 시체가 금방 사라지니 {item:14613}을(를) 바로 챙기세요. 무덤 옆 울타리 틈으로 뛰어넘으면 나머지는 먼 길로 돌아옵니다."
zh_cn = "土堆会召唤{npc:11886}和他的手下。只需杀死他本人：立刻拾取{item:14613}，他的尸体很快就会消失。从坟墓旁篱笆的缺口跳过去，其他怪就得绕远路。"
zh_tw = "土堆會召喚{npc:11886}和他的手下。只需殺死他本人：立刻拾取{item:14613}，他的屍體很快就會消失。從墳墓旁籬笆的缺口跳過去，其他怪就得繞遠路。"

# The Ranger Lord's Behest: the registry's two level 60 guards come back quickly after being killed.
[[note]]
quest = 6133
phase = "objective"
objective = 4
level = "warning"
en = "{item:15847} lies on a bench in the lodge's south wing, guarded by two level 60 {npc:12322} that respawn after about a minute: kill them, take it and leave at once."
fr = "{item:15847} est posé sur un banc dans l'aile sud du pavillon, gardé par deux {npc:12322} de niveau 60 qui réapparaissent au bout d'une minute environ : tuez-les, prenez-le et repartez aussitôt."
de = "{item:15847} liegt auf einer Bank im Südflügel der Hütte, bewacht von zwei {npc:12322} der Stufe 60, die nach etwa einer Minute respawnen: Töte sie, nimm es und geh sofort."
es = "{item:15847} está sobre un banco en el ala sur del pabellón, vigilado por dos {npc:12322} de nivel 60 que reaparecen al cabo de un minuto más o menos: mátalos, cógelo y vete enseguida."
pt = "{item:15847} está sobre um banco na ala sul do pavilhão, guardado por dois {npc:12322} de nível 60 que reaparecem após cerca de um minuto: mate-os, pegue-o e saia logo."
ru = "{item:15847} лежит на скамье в южном крыле домика под охраной двух {npc:12322} 60-го уровня, которые возрождаются примерно через минуту: убейте их, заберите его и сразу уходите."
ko = "{item:15847}은(는) 산장 남쪽 동의 벤치 위에 있으며, 약 1분 뒤 다시 나타나는 60레벨 {npc:12322} 둘이 지킵니다. 처치하고 바로 챙겨서 떠나세요."
zh_cn = "{item:15847}放在小屋南翼的一张长椅上，由两个60级的{npc:12322}看守，他们约一分钟后就会重生：击杀后立刻拿走并离开。"
zh_tw = "{item:15847}放在小屋南翼的一張長椅上，由兩個60級的{npc:12322}看守，他們約一分鐘後就會重生：擊殺後立刻拿走並離開。"

# Hameya's Plea: Hameya walks around the graves of Zul'Mashar, and the graves raise more trolls when stepped on.
[[note]]
quest = 6024
phase = "objective"
objective = 1
level = "warning"
en = "{npc:12248} paces around the graves in front of the temple. Stay off the graves, as stepping on them raises extra undead trolls, and pull him when he walks away from the other mobs."
fr = "{npc:12248} fait les cent pas autour des tombes devant le temple. Ne marchez pas sur les tombes, cela fait surgir d'autres trolls morts-vivants, et attirez-le quand il s'éloigne des autres monstres."
de = "{npc:12248} läuft um die Gräber vor dem Tempel herum. Betritt die Gräber nicht, das ruft weitere untote Trolle hervor, und zieh ihn, wenn er sich von den anderen Gegnern entfernt."
es = "{npc:12248} da vueltas alrededor de las tumbas frente al templo. No pises las tumbas, eso hace surgir más trols no-muertos, y atráelo cuando se aleje de los demás enemigos."
pt = "{npc:12248} anda em volta dos túmulos diante do templo. Não pise nos túmulos, isso faz surgir mais trolls mortos-vivos, e atraia-o quando ele se afastar dos outros inimigos."
ru = "{npc:12248} бродит вокруг могил перед храмом. Не наступайте на могилы, из них поднимаются новые тролли-нежить, и выманивайте его, когда он отходит от остальных врагов."
ko = "{npc:12248}은(는) 사원 앞 무덤 주위를 서성입니다. 무덤을 밟으면 언데드 트롤이 더 일어나니 피하고, 그가 다른 몹에게서 멀어질 때 끌어오세요."
zh_cn = "{npc:12248}在神殿前的坟墓周围来回走动。不要踩上坟墓，否则会冒出更多亡灵巨魔；等他离开其他怪物时再把他引过来。"
zh_tw = "{npc:12248}在神殿前的墳墓周圍來回走動。不要踩上墳墓，否則會冒出更多亡靈食人妖；等他離開其他怪物時再把他引過來。"

# Villains of Darrowshire: the skull lies under the friendly spectral ghosts fighting at the bottom of Blackwood Lake; looking straight down avoids clicking them.
[[note]]
quest = 5181
phase = "objective"
objective = 1
level = "info"
en = "{object:176208} lies at the bottom of the lake among fighting spectral warriors, who ignore you. Swim right above it and look straight down so you click the skull and not the ghosts; water elementals swim nearby."
fr = "{object:176208} repose au fond du lac au milieu de guerriers spectraux qui se battent et vous ignorent. Nagez juste au-dessus et regardez droit vers le bas pour cliquer sur le crâne et non sur les fantômes ; des élémentaires d'eau nagent autour."
de = "{object:176208} liegt am Grund des Sees zwischen kämpfenden Geisterkriegern, die dich ignorieren. Schwimm direkt darüber und schau senkrecht nach unten, damit du den Schädel anklickst und nicht die Geister; in der Nähe schwimmen Wasserelementare."
es = "{object:176208} está en el fondo del lago entre guerreros espectrales que luchan y te ignoran. Nada justo encima y mira hacia abajo para hacer clic en el cráneo y no en los fantasmas; cerca nadan elementales de agua."
pt = "{object:176208} fica no fundo do lago entre guerreiros espectrais que lutam e ignoram você. Nade logo acima e olhe direto para baixo para clicar no crânio e não nos fantasmas; elementais da água nadam por perto."
ru = "{object:176208} лежит на дне озера среди сражающихся призрачных воинов, которые вас не замечают. Подплывите прямо сверху и посмотрите вертикально вниз, чтобы щелкнуть по черепу, а не по призракам; рядом плавают водные элементали."
ko = "{object:176208}은(는) 서로 싸우는 유령 전사들 사이, 호수 바닥에 있습니다. 유령들은 당신을 무시합니다. 바로 위에서 수직으로 내려다보며 유령이 아닌 해골을 클릭하세요. 근처에 물의 정령이 헤엄쳐 다닙니다."
zh_cn = "{object:176208}在湖底，周围有互相厮杀的幽灵战士，它们不会理你。游到正上方垂直向下看，才能点到头骨而不是幽灵；附近有水元素游荡。"
zh_tw = "{object:176208}在湖底，周圍有互相廝殺的幽靈戰士，它們不會理你。游到正上方垂直向下看，才能點到頭骨而不是幽靈；附近有水元素遊蕩。"

# Defenders of Darrowshire: the ghouls and flayers release a spirit that must be talked to; they share spawn points with the other Scourge of the area.
[[note]]
quest = 5211
phase = "objective"
objective = 1
level = "info"
en = "Killing {npc:8530}, {npc:8531} and {npc:8532} frees a spirit ({npc:11064}): talk to it quickly so it counts. They share spawn points with the other Scourge around, so kill those too when no ghoul is left."
fr = "Chaque victime parmi {npc:8530}, {npc:8531} et {npc:8532} libère un esprit ({npc:11064}) : parlez-lui vite pour qu'il compte. Ils partagent leurs points d'apparition avec le reste du Fléau alentour : tuez-le aussi quand il ne reste plus de goule."
de = "Jeder getötete {npc:8530}, {npc:8531} oder {npc:8532} befreit einen Geist ({npc:11064}): Sprich schnell mit ihm, damit er zählt. Sie teilen sich Spawnpunkte mit der übrigen Geißel in der Gegend, töte also auch diese, wenn kein Ghul mehr da ist."
es = "Matar a {npc:8530}, {npc:8531} y {npc:8532} libera un espíritu ({npc:11064}): habla con él rápido para que cuente. Comparten puntos de aparición con el resto de la Plaga de la zona, así que mátalos también cuando no quede ningún necrófago."
pt = "Matar {npc:8530}, {npc:8531} e {npc:8532} liberta um espírito ({npc:11064}): fale com ele rápido para que conte. Eles dividem pontos de surgimento com o resto do Flagelo da área, então mate esses também quando não houver mais carniçais."
ru = "Убийство противников {npc:8530}, {npc:8531} и {npc:8532} освобождает дух ({npc:11064}): быстро поговорите с ним, чтобы он засчитался. Они делят точки появления с остальной Плетью вокруг, так что убивайте и ее, когда вурдалаков не осталось."
ko = "{npc:8530}, {npc:8531}, {npc:8532}을(를) 처치하면 영혼({npc:11064})이 풀려납니다. 빨리 말을 걸어야 집계됩니다. 이들은 주변의 다른 스컬지와 생성 지점을 공유하므로, 구울이 보이지 않으면 다른 스컬지도 처치하세요."
zh_cn = "击杀{npc:8530}、{npc:8531}和{npc:8532}会放出一个灵魂（{npc:11064}）：尽快和它对话才算数。它们与附近其他天灾共用刷新点，没有食尸鬼时就把其他天灾也杀掉。"
zh_tw = "擊殺{npc:8530}、{npc:8531}和{npc:8532}會放出一個靈魂（{npc:11064}）：儘快和它對話才算數。牠們與附近其他天譴軍共用重生點，沒有食屍鬼時就把其他天譴軍也殺掉。"

# Heroes of Darrowshire: the libram is in Hearthglen's town hall among elite Scarlet paladins that heal each other, sometimes with the rare Scarlet Judge.
[[note]]
quest = 5168
phase = "objective"
objective = 1
level = "warning"
en = "{object:176206} lies in the town hall of the Scarlet town in northern {zone:28}, guarded by pairs of elite {npc:1834} that heal each other; a rare {npc:1837} may stand in the same room. Bring a group or a sure way out."
fr = "{object:176206} se trouve dans l'hôtel de ville de la ville écarlate au nord de {zone:28}, gardé par des paires de {npc:1834} élites qui se soignent entre eux ; un rare, {npc:1837}, peut se tenir dans la même salle. Venez en groupe ou avec un moyen sûr de fuir."
de = "{object:176206} liegt im Rathaus der Stadt des Scharlachroten Kreuzzugs im Norden von {zone:28}, bewacht von Paaren von Elite-{npc:1834}, die sich gegenseitig heilen; ein seltener {npc:1837} kann im selben Raum stehen. Komm mit Gruppe oder einem sicheren Fluchtweg."
es = "{object:176206} está en el ayuntamiento del pueblo Escarlata al norte de {zone:28}, vigilado por parejas de {npc:1834} élite que se curan entre sí; un raro, {npc:1837}, puede estar en la misma sala. Ve en grupo o con una forma segura de huir."
pt = "{object:176206} fica na prefeitura da cidade Escarlate no norte de {zone:28}, guardado por pares de {npc:1834} de elite que se curam; um raro, {npc:1837}, pode estar na mesma sala. Vá em grupo ou com um jeito seguro de fugir."
ru = "{object:176206} лежит в ратуше города Алого ордена на севере зоны {zone:28}; его охраняют пары элитных противников {npc:1834}, которые лечат друг друга, а в том же зале может стоять редкий {npc:1837}. Идите группой или с надежным способом сбежать."
ko = "{object:176206}은(는) {zone:28} 북쪽 붉은십자군 마을의 시청 안에 있으며, 서로 치유하는 정예 {npc:1834} 두 명씩이 지키고 있습니다. 같은 방에 희귀 몹 {npc:1837}이(가) 있을 수도 있습니다. 파티를 꾸리거나 확실한 탈출 수단을 챙기세요."
zh_cn = "{object:176206}在{zone:28}北部血色十字军城镇的市政厅里，由成对的精英{npc:1834}看守，他们会互相治疗；同一房间里可能还有稀有怪{npc:1837}。请组队，或准备好可靠的脱身手段。"
zh_tw = "{object:176206}在{zone:28}北部血色十字軍城鎮的市政廳裡，由成對的精英{npc:1834}看守，他們會互相治療；同一房間裡可能還有稀有怪{npc:1837}。請組隊，或準備好可靠的脫身手段。"

# Marauders of Darrowshire: the champions share spawn points with three other undead; the crystal turns only part of the skulls, and a full bag loses the skull.
[[note]]
quest = 5206
phase = "objective"
objective = 1
level = "warning"
en = "{npc:8529} shares spawn points with {npc:8528}, {npc:8542} and {npc:8532}: kill them all to make it spawn more often. {item:13156} does not always turn {item:13157} into {item:13155}; keep a free bag slot when you use it."
fr = "{npc:8529} partage ses points d'apparition avec {npc:8528}, {npc:8542} et {npc:8532} : tuez-les tous pour qu'il apparaisse plus souvent. {item:13156} ne change pas toujours {item:13157} en {item:13155} ; gardez une place libre dans vos sacs en l'utilisant."
de = "{npc:8529} teilt sich die Spawnpunkte mit {npc:8528}, {npc:8542} und {npc:8532}: Töte alle, damit er öfter spawnt. {item:13156} verwandelt {item:13157} nicht immer in {item:13155}; halte beim Benutzen einen Taschenplatz frei."
es = "{npc:8529} comparte puntos de aparición con {npc:8528}, {npc:8542} y {npc:8532}: mátalos a todos para que aparezca más a menudo. {item:13156} no siempre convierte {item:13157} en {item:13155}; deja un hueco libre en las bolsas al usarlo."
pt = "{npc:8529} compartilha pontos de surgimento com {npc:8528}, {npc:8542} e {npc:8532}: mate todos para que ele surja mais vezes. {item:13156} nem sempre transforma {item:13157} em {item:13155}; deixe um espaço livre nas bolsas ao usá-lo."
ru = "{npc:8529} появляется в тех же точках, что {npc:8528}, {npc:8542} и {npc:8532}: убивайте всех, чтобы он появлялся чаще. {item:13156} не всегда превращает предмет {item:13157} в {item:13155}; при использовании держите в сумках свободное место."
ko = "{npc:8529}은(는) {npc:8528}, {npc:8542}, {npc:8532}와(과) 생성 지점을 공유합니다. 모두 처치해 더 자주 나타나게 하세요. {item:13156}은(는) {item:13157}을(를) 항상 {item:13155}(으)로 바꾸지는 않습니다. 사용할 때 가방에 빈칸을 남겨 두세요."
zh_cn = "{npc:8529}与{npc:8528}、{npc:8542}和{npc:8532}共用刷新点：把它们全部杀掉，它才会更常刷新。{item:13156}并不总能把{item:13157}变成{item:13155}；使用时背包要留一个空位。"
zh_tw = "{npc:8529}與{npc:8528}、{npc:8542}和{npc:8532}共用重生點：把牠們全部殺掉，牠才會更常重生。{item:13156}並不總能把{item:13157}變成{item:13155}；使用時背包要留一個空位。"

# Establishing New Outposts: a capture counts only while PvP-flagged, out of stealth, in a tower your faction does not hold yet.
[[note]]
quest = 9664
phase = "objective"
level = "warning"
en = "Turn on PvP, stay inside the tower out of stealth and wait for its bar to move to your side. A tower your faction already holds gives no credit: wait until the other faction takes it."
fr = "Activez le JcJ, restez dans la tour sans camouflage et attendez que sa barre passe de votre côté. Une tour déjà tenue par votre faction ne compte pas : attendez que l'autre faction la prenne."
de = "Aktiviere PvP, bleib ohne Verstohlenheit im Turm und warte, bis sein Balken auf deine Seite wandert. Ein Turm, den deine Fraktion schon hält, zählt nicht: Warte, bis die andere Fraktion ihn einnimmt."
es = "Activa el JcJ, quédate dentro de la torre sin sigilo y espera a que su barra pase a tu lado. Una torre que ya tiene tu facción no cuenta: espera a que la tome la otra facción."
pt = "Ative o JxJ, fique dentro da torre sem furtividade e espere a barra passar para o seu lado. Uma torre que sua facção já controla não conta: espere a outra facção tomá-la."
ru = "Включите режим PvP, оставайтесь в башне без незаметности и ждите, пока её полоса не сдвинется на вашу сторону. Башня, которую уже держит ваша фракция, не засчитывается: дождитесь, пока её захватит другая фракция."
ko = "PvP를 켜고 은신하지 않은 채 탑 안에 머물며 막대가 내 진영 쪽으로 넘어올 때까지 기다리세요. 이미 내 진영이 차지한 탑은 인정되지 않으니 상대 진영이 점령할 때까지 기다리세요."
zh_cn = "开启PvP，不要潜行，待在塔里等进度条移到你的阵营一侧。你的阵营已经控制的塔不算：等另一方阵营夺下它再来。"
zh_tw = "開啟PvP，不要潛行，待在塔裡等進度條移到你的陣營一側。你的陣營已經控制的塔不算：等另一方陣營奪下它再來。"

# The Battle of Darrowshire: Davil and Captain Redpath must live and cannot be healed; the event tends to stall when the player who placed the bundle wanders off.
[[note]]
quest = 5721
phase = "objective"
objective = 1
level = "warning"
en = "{npc:10944}, then {npc:10937}, must survive and cannot be healed: pull mobs off them. Whoever places {item:15209} should stay near it by the well, or the battle can stall. The graveyard is next to the town."
fr = "{npc:10944}, puis {npc:10937}, doivent survivre et ne peuvent pas être soignés : détournez les monstres d'eux. Celui qui pose {item:15209} doit rester près du puits, sinon la bataille peut se bloquer. Le cimetière est juste à côté du village."
de = "{npc:10944} und danach {npc:10937} müssen überleben und können nicht geheilt werden: Zieh die Gegner von ihnen weg. Wer {item:15209} abstellt, sollte beim Brunnen in der Nähe bleiben, sonst kann die Schlacht hängen bleiben. Der Friedhof liegt direkt beim Dorf."
es = "{npc:10944} y después {npc:10937} deben sobrevivir y no se pueden curar: quítales los enemigos de encima. Quien coloque {item:15209} debe quedarse cerca, junto al pozo, o la batalla puede atascarse. El cementerio está al lado del pueblo."
pt = "{npc:10944} e depois {npc:10937} precisam sobreviver e não podem ser curados: tire os monstros de cima deles. Quem colocar {item:15209} deve ficar por perto, junto ao poço, ou a batalha pode travar. O cemitério fica ao lado da vila."
ru = "{npc:10944}, а затем {npc:10937} должны выжить, и лечить их нельзя: отвлекайте врагов на себя. Тот, кто положил {item:15209}, должен оставаться рядом у колодца, иначе битва может застрять. Кладбище совсем рядом с деревней."
ko = "{npc:10944}, 이어서 {npc:10937}이(가) 살아남아야 하며 치유할 수 없습니다. 몹을 그들에게서 떼어 내세요. {item:15209}을(를) 놓은 사람은 우물 근처에 머물러야 합니다. 그렇지 않으면 전투가 멈출 수 있습니다. 무덤은 마을 바로 옆에 있습니다."
zh_cn = "{npc:10944}和之后的{npc:10937}必须存活，且无法被治疗：把怪从他们身上拉走。放置{item:15209}的人要留在井边附近，否则战斗可能卡住。墓地就在村子旁边。"
zh_tw = "{npc:10944}和之後的{npc:10937}必須存活，且無法被治療：把怪從他們身上拉走。放置{item:15209}的人要留在井邊附近，否則戰鬥可能卡住。墓地就在村子旁邊。"
