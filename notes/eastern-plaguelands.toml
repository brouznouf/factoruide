# Quest notes of the Eastern Plaguelands. See notes/README.md for the format.

# To Kill With Purpose: Living Rot does not stack and has a 10-minute timer that starts on looting; deleting it abandons the quest.
[[note]]
quest = 6022
phase = "objective"
objective = 1
level = "warning"
en = "{item:15447} does not stack and expires 10 minutes after you loot it. Kill several undead first, then loot them all at once, with enough free bag slots."
fr = "{item:15447} ne s'empile pas et disparaît 10 minutes après avoir été ramassée. Tuez d'abord plusieurs morts-vivants, puis fouillez-les tous d'un coup, avec assez de place libre dans vos sacs."
de = "{item:15447} ist nicht stapelbar und verschwindet 10 Minuten nach dem Plündern. Töte erst mehrere Untote und plündere sie dann alle auf einmal, mit genug freien Taschenplätzen."
es = "{item:15447} no se apila y caduca 10 minutos después de despojarla. Mata primero a varios no-muertos y despójalos todos a la vez, con huecos libres en las bolsas."
pt = "{item:15447} não empilha e expira 10 minutos depois de saqueada. Mate primeiro vários mortos-vivos e saqueie todos de uma vez, com espaços livres nas bolsas."
ru = "{item:15447} не складывается в стопку и пропадает через 10 минут после добычи. Сначала убейте нескольких нежитей, затем обыщите их всех разом; освободите место в сумках."
ko = "{item:15447}은(는) 겹쳐지지 않고 획득 10분 뒤에 사라집니다. 언데드를 여러 마리 먼저 처치한 뒤 한꺼번에 전리품을 챙기고, 가방 칸을 충분히 비워 두세요."
zh_cn = "{item:15447}无法堆叠，拾取10分钟后就会消失。先杀掉几只亡灵，再一次性拾取，并留出足够的背包空位。"
zh_tw = "{item:15447}無法堆疊，拾取10分鐘後就會消失。先殺掉幾隻不死生物，再一次拾取，並留出足夠的背包空位。"

# Pamela's Doll: the three parts spawn at random spots in the Darrowshire houses, each calls a ghost, and they must be combined from the bags.
[[note]]
quest = 5149
phase = "objective"
objective = 1
level = "warning"
en = "The doll's parts can lie in any of the three houses, and taking each one calls a {npc:10940}. Once you hold all three, right-click one of them to put the doll together."
fr = "Les morceaux de la poupée peuvent se trouver dans n'importe laquelle des trois maisons, et chacun ramassé fait apparaître un {npc:10940}. Une fois les trois en main, faites un clic droit sur l'un d'eux pour reconstituer la poupée."
de = "Die Teile der Puppe können in jedem der drei Häuser liegen, und jedes aufgehobene Teil ruft einen {npc:10940} herbei. Hast du alle drei, klicke eines mit Rechtsklick an, um die Puppe zusammenzusetzen."
es = "Las piezas de la muñeca pueden estar en cualquiera de las tres casas, y cada una que cojas invoca a un {npc:10940}. Cuando tengas las tres, haz clic derecho en una para montar la muñeca."
pt = "As partes da boneca podem estar em qualquer uma das três casas, e cada uma que você pega invoca um {npc:10940}. Com as três em mãos, clique com o botão direito em uma delas para montar a boneca."
ru = "Части куклы могут лежать в любом из трёх домов, и каждая подобранная призывает {npc:10940}. Собрав все три, щёлкните правой кнопкой по одной из них, чтобы собрать куклу."
ko = "인형 조각은 세 집 중 어디에나 있을 수 있으며, 조각을 하나 집을 때마다 {npc:10940}이(가) 나타납니다. 세 조각을 모두 모으면 그중 하나를 오른쪽 클릭해 인형을 맞추세요."
zh_cn = "娃娃的部件可能在三座房子中的任意一座里，每拿起一个都会招来一个{npc:10940}。集齐三个后，右键点击其中一个把娃娃拼起来。"
zh_tw = "娃娃的部件可能在三棟房子中的任何一棟裡，每拿起一個都會招來一個{npc:10940}。集齊三個後，右鍵點擊其中一個把娃娃拼起來。"

[[icon]]
quest = 5149
phase = "objective"
objective = 1
icon = "pickup"

# Of Forgotten Memories: only Mercutio must die, his corpse despawns fast; the gap in the graveyard fence splits his helpers.
[[note]]
quest = 5781
phase = "objective"
objective = 1
level = "warning"
en = "The mound calls {npc:11886} and his helpers. Only he must die: loot {item:14613} at once, his body vanishes quickly. Jumping through the gap in the fence by the grave makes the others walk the long way round."
fr = "Le monticule fait venir {npc:11886} et ses acolytes. Seul lui doit mourir : ramassez {item:14613} aussitôt, son corps disparaît vite. Sauter par la brèche de la clôture près de la tombe oblige les autres à faire le tour."
de = "Der Erdhügel ruft {npc:11886} und seine Helfer. Nur er muss sterben: Plündere {item:14613} sofort, seine Leiche verschwindet schnell. Springst du durch die Lücke im Zaun beim Grab, müssen die anderen außen herumlaufen."
es = "El montículo invoca a {npc:11886} y sus secuaces. Solo él debe morir: despoja {item:14613} enseguida, su cuerpo desaparece pronto. Saltar por el hueco de la valla junto a la tumba obliga a los demás a dar la vuelta."
pt = "O monte invoca {npc:11886} e seus ajudantes. Só ele precisa morrer: saqueie {item:14613} na hora, o corpo some rápido. Pular pela abertura da cerca junto ao túmulo obriga os outros a dar a volta."
ru = "Холмик призывает {npc:11886} и его подручных. Убить нужно только его: сразу заберите {item:14613}, тело быстро исчезает. Прыжок через пролом в ограде у могилы заставит остальных идти в обход."
ko = "흙더미를 누르면 {npc:11886}와(과) 부하들이 나타납니다. 그만 죽이면 됩니다. 시체가 금방 사라지니 {item:14613}을(를) 바로 챙기세요. 무덤 옆 울타리 틈으로 뛰어넘으면 나머지는 먼 길로 돌아옵니다."
zh_cn = "土堆会召唤{npc:11886}和他的手下。只需杀死他本人：立刻拾取{item:14613}，他的尸体很快就会消失。从坟墓旁篱笆的缺口跳过去，其他怪就得绕远路。"
zh_tw = "土堆會召喚{npc:11886}和他的手下。只需殺死他本人：立刻拾取{item:14613}，他的屍體很快就會消失。從墳墓旁籬笆的缺口跳過去，其他怪就得繞遠路。"

# The Ranger Lord's Behest: the registry's two level 60 guards come back quickly after being killed.
[[note]]
quest = 6133
phase = "objective"
objective = 4
level = "warning"
en = "{item:15847} lies on a bench in the lodge's south wing, guarded by two level 60 {npc:12322} that respawn after about a minute: kill them, take it and leave at once."
fr = "{item:15847} est posé sur un banc dans l'aile sud du pavillon, gardé par deux {npc:12322} de niveau 60 qui réapparaissent au bout d'une minute environ : tuez-les, prenez-le et repartez aussitôt."
de = "{item:15847} liegt auf einer Bank im Südflügel der Hütte, bewacht von zwei {npc:12322} der Stufe 60, die nach etwa einer Minute respawnen: Töte sie, nimm es und geh sofort."
es = "{item:15847} está sobre un banco en el ala sur del pabellón, vigilado por dos {npc:12322} de nivel 60 que reaparecen al cabo de un minuto más o menos: mátalos, cógelo y vete enseguida."
pt = "{item:15847} está sobre um banco na ala sul do pavilhão, guardado por dois {npc:12322} de nível 60 que reaparecem após cerca de um minuto: mate-os, pegue-o e saia logo."
ru = "{item:15847} лежит на скамье в южном крыле домика под охраной двух {npc:12322} 60-го уровня, которые возрождаются примерно через минуту: убейте их, заберите его и сразу уходите."
ko = "{item:15847}은(는) 산장 남쪽 동의 벤치 위에 있으며, 약 1분 뒤 다시 나타나는 60레벨 {npc:12322} 둘이 지킵니다. 처치하고 바로 챙겨서 떠나세요."
zh_cn = "{item:15847}放在小屋南翼的一张长椅上，由两个60级的{npc:12322}看守，他们约一分钟后就会重生：击杀后立刻拿走并离开。"
zh_tw = "{item:15847}放在小屋南翼的一張長椅上，由兩個60級的{npc:12322}看守，他們約一分鐘後就會重生：擊殺後立刻拿走並離開。"

# Hameya's Plea: Hameya walks around the graves of Zul'Mashar, and the graves raise more trolls when stepped on.
[[note]]
quest = 6024
phase = "objective"
objective = 1
level = "warning"
en = "{npc:12248} paces around the graves in front of the temple. Stay off the graves, as stepping on them raises extra undead trolls, and pull him when he walks away from the other mobs."
fr = "{npc:12248} fait les cent pas autour des tombes devant le temple. Ne marchez pas sur les tombes, cela fait surgir d'autres trolls morts-vivants, et attirez-le quand il s'éloigne des autres monstres."
de = "{npc:12248} läuft um die Gräber vor dem Tempel herum. Betritt die Gräber nicht, das ruft weitere untote Trolle hervor, und zieh ihn, wenn er sich von den anderen Gegnern entfernt."
es = "{npc:12248} da vueltas alrededor de las tumbas frente al templo. No pises las tumbas, eso hace surgir más trols no-muertos, y atráelo cuando se aleje de los demás enemigos."
pt = "{npc:12248} anda em volta dos túmulos diante do templo. Não pise nos túmulos, isso faz surgir mais trolls mortos-vivos, e atraia-o quando ele se afastar dos outros inimigos."
ru = "{npc:12248} бродит вокруг могил перед храмом. Не наступайте на могилы, из них поднимаются новые тролли-нежить, и выманивайте его, когда он отходит от остальных врагов."
ko = "{npc:12248}은(는) 사원 앞 무덤 주위를 서성입니다. 무덤을 밟으면 언데드 트롤이 더 일어나니 피하고, 그가 다른 몹에게서 멀어질 때 끌어오세요."
zh_cn = "{npc:12248}在神殿前的坟墓周围来回走动。不要踩上坟墓，否则会冒出更多亡灵巨魔；等他离开其他怪物时再把他引过来。"
zh_tw = "{npc:12248}在神殿前的墳墓周圍來回走動。不要踩上墳墓，否則會冒出更多亡靈食人妖；等他離開其他怪物時再把他引過來。"
