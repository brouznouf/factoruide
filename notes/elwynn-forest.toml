# Quest notes of Elwynn Forest (Northshire Valley included). See notes/README.md for the format.

# Milly's Harvest: Defias thugs stand next to most crates and attack while one is being opened.
[[note]]
quest = 3904
phase = "objective"
objective = 1
level = "info"
en = "Defias ({npc:38}) stand next to most {object:161557} crates and attack while you open them: kill those close by first so the opening is not interrupted."
fr = "Des Défias ({npc:38}) se tiennent près de la plupart des caisses ({object:161557}) et attaquent pendant que vous les ouvrez : tuez d'abord ceux qui sont proches pour ne pas être interrompu."
de = "Defias ({npc:38}) stehen neben den meisten Kisten ({object:161557}) und greifen an, während du sie öffnest: Töte zuerst die in der Nähe, damit das Öffnen nicht unterbrochen wird."
es = "Hay Defias ({npc:38}) junto a la mayoría de las cajas ({object:161557}) y atacan mientras las abres: mata primero a los que estén cerca para que no te interrumpan."
pt = "Há Défias ({npc:38}) ao lado da maioria dos caixotes ({object:161557}) e eles atacam enquanto você os abre: mate primeiro os que estão perto para não ser interrompido."
ru = "Рядом с большинством ящиков ({object:161557}) стоят Братья Справедливости ({npc:38}) и нападают, пока вы их открываете: сначала убейте тех, кто рядом, чтобы вас не прервали."
ko = "대부분의 상자({object:161557}) 옆에 데피아즈단({npc:38})이 서 있다가 상자를 여는 동안 공격합니다. 방해받지 않도록 가까이 있는 적부터 처치하세요."
zh_cn = "大多数箱子（{object:161557}）旁都站着迪菲亚（{npc:38}），会在你打开时发起攻击：先杀掉附近的敌人，以免打开被打断。"
zh_tw = "大多數箱子（{object:161557}）旁都站著迪菲亞（{npc:38}），會在你打開時發動攻擊：先殺掉附近的敵人，以免打開被打斷。"

# Grape Manifest: Brother Neals is at the top of the abbey's bell tower, two flights up.
[[note]]
quest = 3905
phase = "turnin"
level = "info"
en = "{npc:952} stands at the very top of the abbey's bell tower, not on the ground floor. Take the spiral staircase inside the abbey and keep climbing past the first floor."
fr = "{npc:952} se tient tout en haut du clocher de l'abbaye, pas au rez-de-chaussée. Prenez l'escalier en colimaçon dans l'abbaye et continuez à monter après le premier étage."
de = "{npc:952} steht ganz oben im Glockenturm der Abtei, nicht im Erdgeschoss. Nimm die Wendeltreppe in der Abtei und steig über das erste Stockwerk hinaus weiter."
es = "{npc:952} está en lo más alto del campanario de la abadía, no en la planta baja. Toma la escalera de caracol dentro de la abadía y sigue subiendo más allá del primer piso."
pt = "{npc:952} fica no alto do campanário da abadia, não no térreo. Pegue a escada em espiral dentro da abadia e continue subindo depois do primeiro andar."
ru = "{npc:952} стоит на самом верху колокольни аббатства, а не на первом этаже. Поднимитесь по винтовой лестнице внутри аббатства и идите выше второго этажа."
ko = "{npc:952}은(는) 1층이 아니라 수도원 종탑 꼭대기에 있습니다. 수도원 안의 나선 계단을 타고 첫 번째 층을 지나 계속 올라가세요."
zh_cn = "{npc:952}站在修道院钟楼的最顶层，不在一楼。走修道院内的螺旋楼梯，过了第一层继续往上爬。"
zh_tw = "{npc:952}站在修道院鐘樓的最頂層，不在一樓。走修道院內的螺旋樓梯，過了第一層繼續往上爬。"

# Goldtooth: he is on the lower level of Fargodeep Mine; the wooden platform up the stairs is
# above the same map spot.
[[note]]
quest = 87
phase = "objective"
objective = 1
level = "info"
en = "{npc:327} is on the lower level of the mine. The wooden platform up the stairs is above the same spot on the map: stay down. A kobold guards him."
fr = "{npc:327} se trouve au niveau inférieur de la mine. La plate-forme en bois en haut des escaliers est au-dessus du même point de la carte : restez en bas. Un kobold le garde."
de = "{npc:327} ist auf der unteren Ebene der Mine. Die Holzplattform oben an der Treppe liegt über derselben Stelle der Karte: bleib unten. Ein Kobold bewacht ihn."
es = "{npc:327} está en el nivel inferior de la mina. La plataforma de madera al subir las escaleras está sobre el mismo punto del mapa: quédate abajo. Un kobold lo protege."
pt = "{npc:327} fica no nível inferior da mina. A plataforma de madeira no alto da escada está sobre o mesmo ponto do mapa: fique embaixo. Um kobold o protege."
ru = "{npc:327} находится на нижнем уровне шахты. Деревянный помост наверху лестницы расположен над той же точкой карты: оставайтесь внизу. Его охраняет кобольд."
ko = "{npc:327}은(는) 광산 아래층에 있습니다. 계단 위 나무 발판은 지도에서 같은 지점의 위층이니 아래에 머무르세요. 코볼트 하나가 그를 지킵니다."
zh_cn = "{npc:327}在矿洞的下层。楼梯上方的木平台在地图上是同一位置的上层：留在下面。有一个狗头人守着他。"
zh_tw = "{npc:327}在礦坑的下層。樓梯上方的木平台在地圖上是同一位置的上層：留在下面。有一個狗頭人守著他。"

# Princess Must Die!: Princess roams with two Porcine Entourage that join the fight.
[[note]]
quest = 88
phase = "objective"
objective = 1
level = "warning"
en = "{npc:330} roams the pumpkin patch with her guards ({npc:390} ×2), who join the fight. At level 9, deal with the guards first or bring a friend."
fr = "{npc:330} parcourt le champ de citrouilles avec ses gardes ({npc:390} ×2), qui se joignent au combat. Au niveau 9, occupez-vous d'abord des gardes ou venez avec un ami."
de = "{npc:330} streift mit ihren Wachen ({npc:390} ×2) durch das Kürbisfeld, die sich in den Kampf einmischen. Auf Stufe 9 kümmere dich zuerst um die Wachen oder nimm einen Freund mit."
es = "{npc:330} recorre el huerto de calabazas con sus guardias ({npc:390} ×2), que se unen al combate. A nivel 9, encárgate primero de los guardias o ve con un amigo."
pt = "{npc:330} anda pela plantação de abóboras com seus guardas ({npc:390} ×2), que entram na luta. No nível 9, cuide primeiro dos guardas ou leve um amigo."
ru = "{npc:330} бродит по тыквенному полю со своей охраной ({npc:390} ×2), которая вступает в бой. На 9-м уровне сначала разберитесь с охраной или возьмите друга."
ko = "{npc:330}은(는) 호위({npc:390} ×2)와 함께 호박밭을 돌아다니며, 호위도 전투에 끼어듭니다. 9레벨이라면 호위부터 처리하거나 친구와 함께 가세요."
zh_cn = "{npc:330}带着护卫（{npc:390} ×2）在南瓜田里游荡，护卫会一起参战。9级时先解决护卫，或者找个朋友帮忙。"
zh_tw = "{npc:330}帶著護衛（{npc:390} ×2）在南瓜田裡遊蕩，護衛會一起參戰。9級時先解決護衛，或者找個朋友幫忙。"

# Discover Rolf's Fate: the murlocs around the remains pull in pairs and respawn quickly.
[[note]]
quest = 45
phase = "turnin"
level = "warning"
en = "The murlocs around the remains come in pairs and respawn fast. Pull them away one at a time and click the remains as soon as the spot is clear, or come with a friend."
fr = "Les murlocs autour de la dépouille viennent par deux et réapparaissent vite. Attirez-les un par un à l'écart et cliquez sur la dépouille dès que la place est libre, ou venez avec un ami."
de = "Die Murlocs um die Überreste kommen paarweise und respawnen schnell. Zieh sie einzeln weg und klick die Überreste an, sobald die Stelle frei ist, oder komm mit einem Freund."
es = "Los múrlocs alrededor de los restos vienen de dos en dos y reaparecen rápido. Atráelos uno a uno lejos y haz clic en los restos en cuanto el sitio quede libre, o ve con un amigo."
pt = "Os murlocs em volta dos restos vêm em pares e ressurgem rápido. Puxe-os um de cada vez para longe e clique nos restos assim que o local estiver livre, ou leve um amigo."
ru = "Мурлоки вокруг останков нападают парами и быстро появляются снова. Уводите их по одному и щелкните по останкам, как только место освободится, или возьмите друга."
ko = "유해 주변 멀록은 둘씩 몰려오고 빠르게 다시 나타납니다. 하나씩 끌어내 처치하고 자리가 비자마자 유해를 클릭하거나, 친구와 함께 가세요."
zh_cn = "遗骸周围的鱼人成对出现且刷新很快。把它们一只只引开，场地一清空就点击遗骸，或者找个朋友一起。"
zh_tw = "遺骸周圍的魚人成對出現且重生很快。把牠們一隻隻引開，場地一清空就點擊遺骸，或者找個朋友一起。"

# A Bundle of Trouble: the bundles are small and hidden by the grass at the foot of the trees.
[[note]]
quest = 5545
phase = "objective"
objective = 1
level = "info"
en = "The {item:13872} piles are small and hide in the grass at the foot of the trees. Lowering ground clutter in the graphics settings makes them much easier to see."
fr = "Les tas ({item:13872}) sont petits et se cachent dans l'herbe au pied des arbres. Baisser la densité de la végétation au sol dans les options graphiques les rend bien plus visibles."
de = "Die Haufen ({item:13872}) sind klein und verstecken sich im Gras am Fuß der Bäume. Wenn du die Bodenvegetation in den Grafikeinstellungen senkst, siehst du sie viel leichter."
es = "Los montones ({item:13872}) son pequeños y se esconden en la hierba al pie de los árboles. Bajar la vegetación del suelo en las opciones gráficas hace que se vean mucho mejor."
pt = "Os montes ({item:13872}) são pequenos e se escondem na grama ao pé das árvores. Reduzir a vegetação do solo nas opções gráficas os torna muito mais fáceis de ver."
ru = "Вязанки ({item:13872}) маленькие и прячутся в траве у подножия деревьев. Если уменьшить детализацию растительности в настройках графики, их гораздо легче заметить."
ko = "{item:13872} 더미는 작고 나무 밑동의 풀숲에 가려져 있습니다. 그래픽 설정에서 지면 디테일을 낮추면 훨씬 쉽게 보입니다."
zh_cn = "{item:13872}堆很小，藏在树根旁的草丛里。在图像设置中调低地面杂物，就容易看到得多。"
zh_tw = "{item:13872}堆很小，藏在樹根旁的草叢裡。在圖形設定中調低地面雜物，就容易看到得多。"

# The Great Outdoors (Forever): the sitting part often fails to count; sitting again while seated,
# in the tent, or retaking the quest fixes it.
[[note]]
quest = 95998
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "If sitting by the campfire gives no credit, sit again while already seated (type /sit twice), or sit inside the tent behind {npc:263399}. Still stuck: abandon the quest, take it again and sit once more."
fr = "Si s'asseoir près du feu de camp ne valide rien, asseyez-vous à nouveau alors que vous êtes déjà assis (tapez /sit deux fois), ou asseyez-vous dans la tente derrière {npc:263399}. Toujours bloqué : abandonnez la quête, reprenez-la et asseyez-vous encore."
de = "Wenn das Sitzen am Lagerfeuer nicht zählt, setz dich erneut, während du schon sitzt (/sit zweimal eingeben), oder setz dich in das Zelt hinter {npc:263399}. Klappt es immer noch nicht: Brich die Quest ab, nimm sie neu an und setz dich noch einmal."
es = "Si sentarte junto a la hoguera no cuenta, vuelve a sentarte cuando ya estés sentado (escribe /sit dos veces) o siéntate dentro de la tienda detrás de {npc:263399}. Si sigue sin funcionar: abandona la misión, vuelve a aceptarla y siéntate otra vez."
pt = "Se sentar perto da fogueira não contar, sente-se de novo quando já estiver sentado (digite /sit duas vezes) ou sente-se dentro da barraca atrás de {npc:263399}. Se ainda não funcionar: abandone a missão, pegue-a de novo e sente-se outra vez."
ru = "Если сидение у костра не засчитывается, сядьте ещё раз, уже сидя (введите /sit дважды), или сядьте в палатке позади персонажа {npc:263399}. Не помогло: откажитесь от задания, возьмите его снова и сядьте ещё раз."
ko = "모닥불 옆에 앉아도 인정되지 않으면 앉은 상태에서 다시 앉으세요(/sit 두 번 입력). 또는 {npc:263399} 뒤에 있는 천막 안에 앉으세요. 그래도 안 되면 퀘스트를 포기하고 다시 받은 뒤 또 앉으세요."
zh_cn = "如果坐在篝火旁没有计数，在已经坐下的状态下再坐一次（输入两次/sit），或者坐到{npc:263399}身后的帐篷里。仍然不行：放弃任务，重新接取后再坐一次。"
zh_tw = "如果坐在營火旁沒有計數，在已經坐下的狀態下再坐一次（輸入兩次/sit），或者坐到{npc:263399}身後的帳篷裡。仍然不行：放棄任務，重新接取後再坐一次。"

# Shhh! We're Hunting Kobolds (Forever): the tracks are small, hazy green, by the trees on the
# road south of Northshire; the tracker buff does not always show them.
[[note]]
quest = 91772
phase = "objective"
objective = 1
level = "info"
editions = ["forever"]
en = "{object:563442} are small and give off a faint green haze, mostly beside the trees along the road from {zone:9} to Goldshire. Click them even if the tracker's buff fails to show them on the minimap."
fr = "Les {object:563442} sont petites et dégagent une légère brume verte, surtout au pied des arbres le long de la route de {zone:9} à Comté-de-l'Or. Cliquez-les même si l'effet du pisteur ne les affiche pas sur la minicarte."
de = "{object:563442} sind klein und verströmen einen schwachen grünen Dunst, meist neben den Bäumen an der Straße von {zone:9} nach Goldhain. Klick sie an, auch wenn der Buff des Fährtenlesers sie nicht auf der Minikarte zeigt."
es = "Las {object:563442} son pequeñas y desprenden una leve neblina verde, sobre todo junto a los árboles del camino de {zone:9} a Villadorada. Haz clic en ellas aunque el efecto del rastreador no las muestre en el minimapa."
pt = "As {object:563442} são pequenas e soltam uma leve névoa verde, principalmente ao lado das árvores na estrada de {zone:9} até Vila d'Ouro. Clique nelas mesmo que o efeito do rastreador não as mostre no minimapa."
ru = "{object:563442} маленькие и испускают слабую зелёную дымку, в основном у деревьев вдоль дороги из локации {zone:9} в Златоземье. Щёлкайте по ним, даже если эффект следопыта не показывает их на мини-карте."
ko = "{object:563442}은(는) 작고 옅은 초록 안개를 내뿜으며, 주로 {zone:9}에서 골드샤이어로 가는 길가의 나무 옆에 있습니다. 추적기 효과가 미니맵에 표시하지 않아도 클릭할 수 있습니다."
zh_cn = "{object:563442}很小，散发淡淡的绿雾，大多在从{zone:9}到闪金镇的路边树旁。即使追踪器的效果没有在小地图上显示它们，也可以直接点击。"
zh_tw = "{object:563442}很小，散發淡淡的綠霧，大多在從{zone:9}到閃金鎮的路邊樹旁。即使追蹤器的效果沒有在小地圖上顯示它們，也可以直接點擊。"

# Book Return (Forever): Nimsy is an elite with guards up the stairs in the mine and summons an
# elemental; hard to solo at the quest's level.
[[note]]
quest = 91775
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "{npc:248464} waits with guards up the stairs east of the mine's large room and calls an elemental during the fight: group up, or come back a couple of levels higher."
fr = "{npc:248464} attend avec des gardes en haut de l'escalier à l'est de la grande salle de la mine et invoque un élémentaire pendant le combat : groupez-vous, ou revenez quelques niveaux plus haut."
de = "{npc:248464} wartet mit Wachen oben an der Treppe östlich der großen Halle der Mine und ruft im Kampf einen Elementar herbei: Such dir eine Gruppe oder komm ein paar Stufen höher wieder."
es = "{npc:248464} espera con guardias al subir la escalera al este de la sala grande de la mina e invoca un elemental durante el combate: busca grupo o vuelve con un par de niveles más."
pt = "{npc:248464} espera com guardas no alto da escada a leste do salão grande da mina e invoca um elemental durante a luta: forme um grupo ou volte alguns níveis acima."
ru = "{npc:248464} ждёт с охраной наверху лестницы к востоку от большого зала шахты и призывает элементаля во время боя: соберите группу или вернитесь на пару уровней выше."
ko = "{npc:248464}은(는) 광산의 큰 방 동쪽 계단 위에서 경비병들과 함께 기다리며 전투 중에 정령을 부릅니다. 파티를 맺거나 레벨을 두어 단계 올린 뒤 다시 오세요."
zh_cn = "{npc:248464}带着守卫待在矿洞大厅东边的楼梯上方，战斗中会召唤一个元素：组队，或者高几级再来。"
zh_tw = "{npc:248464}帶著守衛待在礦坑大廳東邊的樓梯上方，戰鬥中會召喚一個元素：組隊，或者高幾級再來。"

# Rare Books (Forever): Geosculptor Yip summons three earth elementals that linger after the fight.
[[note]]
quest = 91777
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "{npc:248474} summons three earth elementals that stay for a while after the fight, and another player's attempt may have left some up already: group up if you can."
fr = "{npc:248474} invoque trois élémentaires de terre qui restent un moment après le combat, et la tentative d'un autre joueur a pu en laisser déjà en place : groupez-vous si possible."
de = "{npc:248474} beschwört drei Erdelementare, die nach dem Kampf noch eine Weile bleiben, und der Versuch eines anderen Spielers hat vielleicht schon welche zurückgelassen: Such dir wenn möglich eine Gruppe."
es = "{npc:248474} invoca tres elementales de tierra que se quedan un rato tras el combate, y el intento de otro jugador puede haber dejado ya algunos: busca grupo si puedes."
pt = "{npc:248474} invoca três elementais da terra que ficam um tempo depois da luta, e a tentativa de outro jogador pode já ter deixado alguns por ali: forme um grupo se puder."
ru = "{npc:248474} призывает трёх элементалей земли, которые остаются ещё какое-то время после боя, а после попытки другого игрока некоторые могут уже стоять: по возможности соберите группу."
ko = "{npc:248474}은(는) 대지 정령 셋을 소환하며, 이들은 전투가 끝난 뒤에도 한동안 남아 있습니다. 다른 플레이어의 시도로 이미 몇이 남아 있을 수도 있으니 가능하면 파티를 맺으세요."
zh_cn = "{npc:248474}会召唤三个土元素，战斗结束后它们还会停留一段时间，其他玩家的尝试也可能已经留下了几个：尽量组队。"
zh_tw = "{npc:248474}會召喚三個土元素，戰鬥結束後它們還會停留一段時間，其他玩家的嘗試也可能已經留下了幾個：盡量組隊。"

# A Net Disaster (Forever): the traps are hard to see, some are fully underwater, and the stream
# toward Northshire has spawns too.
[[note]]
quest = 99127
phase = "objective"
objective = 1
level = "info"
editions = ["forever"]
en = "{object:694772} are hard to spot: look in the shallow water along the shore and underwater too. When the lake is crowded, check the stream running up toward {zone:9}."
fr = "Les {object:694772} sont difficiles à repérer : cherchez dans l'eau peu profonde le long de la rive et aussi sous l'eau. Quand le lac est bondé, fouillez le ruisseau qui remonte vers {zone:9}."
de = "{object:694772} sind schwer zu erkennen: Such im flachen Wasser am Ufer und auch unter Wasser. Wenn am See viel los ist, schau am Bach nach, der hinauf nach {zone:9} führt."
es = "Las {object:694772} son difíciles de ver: busca en el agua poco profunda de la orilla y también bajo el agua. Si el lago está lleno de gente, revisa el arroyo que sube hacia {zone:9}."
pt = "As {object:694772} são difíceis de achar: procure na água rasa ao longo da margem e também debaixo d'água. Quando o lago estiver cheio, confira o riacho que sobe em direção a {zone:9}."
ru = "{object:694772} трудно заметить: ищите на мелководье у берега и под водой. Если у озера толпа, проверьте ручей, который тянется к локации {zone:9}."
ko = "{object:694772}은(는) 찾기 어렵습니다. 물가의 얕은 물과 물속까지 살펴보세요. 호수가 붐비면 {zone:9} 쪽으로 이어지는 개울을 확인하세요."
zh_cn = "{object:694772}很难发现：在岸边浅水里找，也要看看水下。湖边人多时，去通往{zone:9}的小溪看看。"
zh_tw = "{object:694772}很難發現：在岸邊淺水裡找，也要看看水下。湖邊人多時，去通往{zone:9}的小溪看看。"

# An Enticing Offer (Forever): the Duskweed flowers are small, purple and few at a time, often in
# the bushes by the farm fences.
[[note]]
quest = 99130
phase = "objective"
objective = 2
level = "info"
editions = ["forever"]
en = "{object:694855} is a small purple flower that blends in: look in the farm gardens and fields and in the bushes along the fences. Only a few are up at a time."
fr = "La {object:694855} est une petite fleur violette qui se fond dans le décor : cherchez dans les potagers et les champs des fermes et dans les buissons le long des clôtures. Seules quelques-unes sont présentes à la fois."
de = "{object:694855} ist eine kleine violette Blume, die kaum auffällt: Such in den Gärten und Feldern der Höfe und in den Büschen an den Zäunen. Es sind immer nur wenige gleichzeitig da."
es = "{object:694855} es una pequeña flor morada que se confunde con el entorno: busca en los huertos y campos de las granjas y en los arbustos junto a las vallas. Solo hay unas pocas a la vez."
pt = "{object:694855} é uma pequena flor roxa que se confunde com o cenário: procure nas hortas e campos das fazendas e nos arbustos junto às cercas. Só há algumas de cada vez."
ru = "{object:694855} — маленький фиолетовый цветок, который сливается с местностью: ищите в огородах и на полях ферм и в кустах вдоль заборов. Одновременно их растёт всего несколько."
ko = "{object:694855}은(는) 눈에 잘 띄지 않는 작은 보라색 꽃입니다. 농장의 텃밭과 밭, 울타리를 따라 난 덤불 속을 살펴보세요. 한 번에 몇 개만 피어 있습니다."
zh_cn = "{object:694855}是一种不起眼的紫色小花：在农场的菜园和田地里，以及围栏边的灌木丛中寻找。同一时间只有少数几株。"
zh_tw = "{object:694855}是一種不起眼的紫色小花：在農場的菜園和田地裡，以及圍欄邊的灌木叢中尋找。同一時間只有少數幾株。"

