# Treant Muisek: only Wandering Forest Walkers count (not Cursed Sycamores); one respawns every few minutes behind the Ruins of Isildien.
[[note]]
quest = 3126
phase = "objective"
objective = 1
level = "warning"
en = "Only {npc:7584} counts, not {npc:5881}. Few of them roam the zone: one respawns about every 5 minutes behind the Ruins of Isildien (about 58, 74), so wait there instead of searching."
fr = "Seul {npc:7584} compte, pas {npc:5881}. Ils sont peu nombreux dans la zone : l'un réapparaît environ toutes les 5 minutes derrière les ruines d'Isildien (vers 58, 74), attendez-le là plutôt que de chercher."
de = "Nur {npc:7584} zählt, nicht {npc:5881}. Nur wenige streifen durch das Gebiet: einer erscheint etwa alle 5 Minuten hinter den Ruinen von Isildien (um 58, 74) neu, warte also dort, statt zu suchen."
es = "Solo cuenta {npc:7584}, no {npc:5881}. Hay pocos en la zona: uno reaparece cada 5 minutos aproximadamente detrás de las Ruinas de Isildien (hacia 58, 74), así que espera allí en lugar de buscar."
pt = "Só {npc:7584} conta, não {npc:5881}. Há poucos na zona: um reaparece a cada 5 minutos, mais ou menos, atrás das Ruínas de Isildien (por volta de 58, 74), então espere ali em vez de procurar."
ru = "Засчитывается только {npc:7584}, а не {npc:5881}. Их в зоне мало: один появляется примерно каждые 5 минут за руинами Исилдиэна (около 58, 74), так что ждите там, а не ищите."
ko = "{npc:5881}이(가) 아니라 {npc:7584}만 인정됩니다. 지역에 몇 마리 없으며, 한 마리가 이실디엔 폐허 뒤(약 58, 74)에서 약 5분마다 다시 나타나니 찾아다니지 말고 그곳에서 기다리세요."
zh_cn = "只有{npc:7584}算数，{npc:5881}不算。这片区域里数量很少：其中一只大约每5分钟在伊斯迪尔废墟后方（约58, 74）重生，与其到处找，不如在那里等。"
zh_tw = "只有{npc:7584}算數，{npc:5881}不算。這片區域裡數量很少：其中一隻大約每5分鐘在伊斯迪爾廢墟後方（約58, 74）重生，與其到處找，不如在那裡等。"

[[icon]]
quest = 3126
phase = "objective"
objective = 1
icon = "rare"

# Mountain Giant Muisek: Zorbin's Ultra-Shrinker (Zapped Giants) removes the giants' elite status and the vessel still works; the coastal sea giants do not count.
[[note]]
quest = 3127
phase = "objective"
objective = 1
level = "info"
en = "Take {quest:7003} from {npc:14637} first: his {item:18904} makes {npc:5357} and {npc:5358} lose their elite status, and the vessel still works on their corpses. The sea giants on the coast do not count."
fr = "Prenez d'abord {quest:7003} auprès de {npc:14637} : son {item:18904} fait perdre leur statut d'élite à {npc:5357} et {npc:5358}, et le réceptacle marche toujours sur leurs cadavres. Les géants des mers de la côte ne comptent pas."
de = "Nimm zuerst {quest:7003} bei {npc:14637} an: sein {item:18904} nimmt {npc:5357} und {npc:5358} den Elitestatus, und das Gefäß wirkt weiterhin auf ihre Leichen. Die Meeresriesen an der Küste zählen nicht."
es = "Acepta primero {quest:7003} de {npc:14637}: su {item:18904} hace que {npc:5357} y {npc:5358} pierdan su estatus de élite, y el recipiente sigue funcionando con sus cadáveres. Los gigantes de mar de la costa no cuentan."
pt = "Pegue primeiro {quest:7003} com {npc:14637}: o {item:18904} dele faz {npc:5357} e {npc:5358} perderem o status de elite, e o receptáculo ainda funciona nos cadáveres. Os gigantes marinhos da costa não contam."
ru = "Сначала возьмите задание {quest:7003} у {npc:14637}: его {item:18904} лишает {npc:5357} и {npc:5358} статуса элиты, а сосуд по-прежнему действует на их трупы. Морские великаны на побережье не подходят."
ko = "먼저 {npc:14637}에게서 {quest:7003} 퀘스트를 받으세요. 그의 {item:18904}을(를) 쓰면 {npc:5357}, {npc:5358} 모두 정예 등급이 사라지고, 그 시체에도 그릇을 그대로 쓸 수 있습니다. 해안의 바다 거인은 해당하지 않습니다."
zh_cn = "先从{npc:14637}那里接受{quest:7003}：他的{item:18904}能让{npc:5357}和{npc:5358}失去精英状态，而容器对它们的尸体依然有效。海岸边的海巨人不算。"
zh_tw = "先從{npc:14637}那裡接受{quest:7003}：他的{item:18904}能讓{npc:5357}和{npc:5358}失去精英狀態，而容器對牠們的屍體依然有效。海岸邊的海巨人不算。"

# The High Wilderness: the shamans share spawn points with the other ogres of the ruins, so killing the warlocks and others brings more shamans.
[[note]]
quest = 2982
phase = "objective"
objective = 2
level = "info"
en = "{npc:5236} share spawn points with the other ogres of the ruins, so few are up at once. Keep killing the {npc:5240} and the others around them to bring more shamans."
fr = "Les {npc:5236} partagent leurs points d'apparition avec les autres ogres des ruines, si bien qu'il y en a peu à la fois. Continuez à tuer les {npc:5240} et les autres autour d'eux pour faire venir plus de chamans."
de = "{npc:5236} teilen ihre Spawnpunkte mit den anderen Ogern der Ruinen, daher sind nur wenige gleichzeitig da. Töte weiter die {npc:5240} und die anderen um sie herum, damit mehr Schamanen erscheinen."
es = "Los {npc:5236} comparten puntos de aparición con los demás ogros de las ruinas, así que hay pocos a la vez. Sigue matando a los {npc:5240} y al resto a su alrededor para que salgan más chamanes."
pt = "Os {npc:5236} dividem pontos de surgimento com os outros ogros das ruínas, então há poucos de cada vez. Continue matando os {npc:5240} e os demais ao redor para que surjam mais xamãs."
ru = "{npc:5236} делят точки появления с другими ограми руин, поэтому одновременно их мало. Продолжайте убивать {npc:5240} и остальных вокруг, чтобы появлялось больше шаманов."
ko = "{npc:5236}은(는) 폐허의 다른 오우거와 생성 지점을 공유해서 한 번에 몇 마리 없습니다. 주변의 {npc:5240} 등 다른 오우거도 계속 처치해야 주술사가 더 나타납니다."
zh_cn = "{npc:5236}和废墟里的其他食人魔共用刷新点，所以同时存在的很少。继续击杀周围的{npc:5240}和其他食人魔，才能刷出更多萨满。"
zh_tw = "{npc:5236}和廢墟裡的其他食人魔共用重生點，所以同時存在的很少。繼續擊殺周圍的{npc:5240}和其他食人魔，才能刷出更多薩滿。"

# The Missing Courier: the rowboat is half buried just off the shore and blends into the sea floor.
[[note]]
quest = 4125
phase = "turnin"
level = "info"
en = "{object:164909} is half buried in the sand a few steps into the water and very hard to see: look for a broken crate and green bottles on the beach, then sweep your cursor over the shallows. Swimming in from the sea avoids the giants and elementals on the shore."
fr = "{object:164909} est à moitié enfouie dans le sable, à quelques pas dans l'eau, et très difficile à voir : repérez une caisse brisée et des bouteilles vertes sur la plage, puis balayez le haut-fond avec le curseur. Arriver à la nage depuis le large évite les géants et les élémentaires du rivage."
de = "{object:164909} liegt halb im Sand vergraben, ein paar Schritte im Wasser, und ist kaum zu sehen: Achte auf eine zerbrochene Kiste und grüne Flaschen am Strand und fahr dann mit dem Mauszeiger über das flache Wasser. Vom Meer her anzuschwimmen umgeht die Riesen und Elementare am Ufer."
es = "{object:164909} está medio enterrado en la arena, a pocos pasos dentro del agua, y cuesta mucho verlo: busca una caja rota y botellas verdes en la playa y pasa el cursor por el agua poco profunda. Llegar nadando desde el mar evita a los gigantes y elementales de la orilla."
pt = "{object:164909} fica meio enterrada na areia, a poucos passos dentro d'água, e é muito difícil de ver: procure um caixote quebrado e garrafas verdes na praia e passe o cursor pela parte rasa. Chegar nadando pelo mar evita os gigantes e elementais da margem."
ru = "{object:164909} наполовину зарыта в песок в паре шагов от берега и почти не видна: ищите разбитый ящик и зелёные бутылки на пляже, затем водите курсором по мелководью. Если подплыть со стороны моря, можно обойти великанов и элементалей на берегу."
ko = "{object:164909}은(는) 물가에서 몇 걸음 들어간 모래에 반쯤 묻혀 있어 잘 보이지 않습니다. 해변의 부서진 상자와 초록색 병을 찾은 뒤 얕은 물을 커서로 훑으세요. 바다 쪽에서 헤엄쳐 오면 해안의 거인과 정령을 피할 수 있습니다."
zh_cn = "{object:164909}半埋在离岸几步远的水下沙子里，很难看到：先在海滩上找破箱子和绿瓶子，再用鼠标在浅水处扫一扫。从海上游过来可以避开岸边的巨人和元素。"
zh_tw = "{object:164909}半埋在離岸幾步遠的水下沙子裡，很難看到：先在海灘上找破箱子和綠瓶子，再用滑鼠在淺水處掃一掃。從海上游過來可以避開岸邊的巨人和元素。"

# The Writhing Deep: the pod is in the western hive, down the spiral ramp, southwest tunnel, right at the fork.
[[note]]
quest = 4135
phase = "turnin"
level = "info"
en = "{object:164954} is in the western hive, the one with the spiral ramp: go down to the bottom, take the southwest tunnel and keep right at the fork. The eastern hive holds nothing for this quest."
fr = "{object:164954} se trouve dans la ruche ouest, celle à la rampe en spirale : descendez jusqu'en bas, prenez le tunnel sud-ouest et restez à droite à l'embranchement. La ruche est ne contient rien pour cette quête."
de = "{object:164954} ist im westlichen Stock, dem mit der Spiralrampe: Geh ganz nach unten, nimm den Südwesttunnel und halte dich an der Gabelung rechts. Der östliche Stock hat für diese Quest nichts."
es = "{object:164954} está en la colmena oeste, la de la rampa en espiral: baja hasta el fondo, toma el túnel suroeste y sigue a la derecha en la bifurcación. La colmena este no tiene nada para esta misión."
pt = "{object:164954} fica na colmeia oeste, a da rampa em espiral: desça até o fundo, pegue o túnel sudoeste e siga pela direita na bifurcação. A colmeia leste não tem nada para esta missão."
ru = "{object:164954} находится в западном улье, со спиральным спуском: спуститесь до самого низа, войдите в юго-западный туннель и на развилке держитесь правее. В восточном улье для этого задания ничего нет."
ko = "{object:164954}은(는) 나선형 경사로가 있는 서쪽 둥지에 있습니다. 맨 아래까지 내려가 남서쪽 굴로 들어간 뒤 갈림길에서 오른쪽으로 가세요. 동쪽 둥지에는 이 퀘스트에 필요한 것이 없습니다."
zh_cn = "{object:164954}在带螺旋坡道的西边虫巢里：下到最底部，进入西南方的隧道，在岔路口靠右走。东边的虫巢里没有这个任务需要的东西。"
zh_tw = "{object:164954}在帶螺旋坡道的西邊蟲巢裡：下到最底部，進入西南方的隧道，在岔路口靠右走。東邊的蟲巢裡沒有這個任務需要的東西。"

# Freed from the Hive: credit comes only once the courier has finished speaking; reopening the pod fixes a missed credit.
[[note]]
quest = 4265
phase = "objective"
level = "warning"
en = "After breaking the pod, stay until {npc:9546} has finished talking and the quest shows as complete. If it does not, abandon it at the pod and break the pod open again."
fr = "Après avoir brisé l'alvéole, restez jusqu'à ce que {npc:9546} ait fini de parler et que la quête soit indiquée comme terminée. Sinon, abandonnez-la près de l'alvéole et brisez-la à nouveau."
de = "Bleib nach dem Aufbrechen der Kapsel, bis {npc:9546} ausgeredet hat und die Quest als abgeschlossen gilt. Wenn nicht, brich sie an der Kapsel ab und brich die Kapsel erneut auf."
es = "Tras romper la vaina, quédate hasta que {npc:9546} termine de hablar y la misión aparezca como completada. Si no, abandónala junto a la vaina y vuelve a romperla."
pt = "Depois de quebrar a carapaça, fique até {npc:9546} terminar de falar e a missão aparecer como concluída. Se não aparecer, abandone-a junto à carapaça e quebre-a de novo."
ru = "Разбив кокон, оставайтесь на месте, пока {npc:9546} не договорит и задание не отметится выполненным. Если этого не произошло, откажитесь от задания у кокона и разбейте его снова."
ko = "고치를 깬 뒤 {npc:9546}의 말이 끝나고 퀘스트가 완료로 표시될 때까지 자리를 지키세요. 완료되지 않으면 고치 옆에서 퀘스트를 포기하고 고치를 다시 깨세요."
zh_cn = "打破虫茧后，待在原地直到{npc:9546}说完话、任务显示完成。如果没有完成，就在虫茧旁放弃任务，再打破一次虫茧。"
zh_tw = "打破蟲繭後，待在原地直到{npc:9546}說完話、任務顯示完成。如果沒有完成，就在蟲繭旁放棄任務，再打破一次蟲繭。"

# Wandering Shay: Shay strays during the escort and the bell calls her back; the quest has a 15-minute timer, and going east to the road avoids the harpies.
[[note]]
quest = 2845
phase = "objective"
objective = 2
level = "warning"
en = "{npc:7774} wanders off now and then: ring {item:9189} at once to make her follow you again, or the 15-minute timer runs out. Skirting the harpies east to the road and then south avoids most fights."
fr = "{npc:7774} s'éloigne de temps en temps : agitez aussitôt {item:9189} pour qu'elle vous suive à nouveau, sinon le délai de 15 minutes expire. Contourner les harpies par l'est jusqu'à la route, puis aller au sud, évite la plupart des combats."
de = "{npc:7774} läuft ab und zu davon: Läute sofort {item:9189}, damit sie dir wieder folgt, sonst läuft das 15-Minuten-Zeitlimit ab. Wenn du die Harpyien östlich zur Straße umgehst und dann nach Süden gehst, vermeidest du die meisten Kämpfe."
es = "{npc:7774} se aleja de vez en cuando: haz sonar {item:9189} enseguida para que vuelva a seguirte, o se agotará el límite de 15 minutos. Rodear a las arpías por el este hasta el camino y luego ir al sur evita la mayoría de combates."
pt = "{npc:7774} se afasta de vez em quando: toque {item:9189} na hora para que ela volte a segui-lo, ou o limite de 15 minutos acaba. Contornar as harpias pelo leste até a estrada e depois seguir para o sul evita a maioria das lutas."
ru = "{npc:7774} время от времени уходит в сторону: сразу используйте {item:9189}, чтобы она снова пошла за вами, иначе истекут 15 минут. Обойдите гарпий с востока до дороги, затем идите на юг — так удастся избежать большинства боев."
ko = "{npc:7774}은(는) 가끔 다른 곳으로 가 버립니다. 바로 {item:9189}을(를) 울려 다시 따라오게 하세요. 그러지 않으면 15분 제한 시간이 끝납니다. 하피를 동쪽으로 돌아 길로 나간 뒤 남쪽으로 가면 대부분의 전투를 피할 수 있습니다."
zh_cn = "{npc:7774}时不时会走开：立即摇响{item:9189}让她重新跟着你，否则15分钟的时限会耗尽。从东边绕过鹰身人到大路上再往南走，可以避开大部分战斗。"
zh_tw = "{npc:7774}時不時會走開：立即搖響{item:9189}讓她重新跟著你，否則15分鐘的時限會耗盡。從東邊繞過鷹身人到大路上再往南走，可以避開大部分戰鬥。"

# Freedom for All Creatures: the Grimtotem at the cage respawn fast; clearing them before accepting and following the largest group of darters keeps Kindal alive.
[[note]]
quest = 2969
phase = "objective"
objective = 1
level = "warning"
en = "The tauren around the cage respawn fast: clear them before taking the quest from {npc:7956}, then jump down with her and open the cage at once. Follow the biggest group of {npc:7997} and keep her alive."
fr = "Les taurens autour de la cage réapparaissent vite : éliminez-les avant de prendre la quête auprès de {npc:7956}, puis sautez en bas avec elle et ouvrez la cage aussitôt. Suivez le plus grand groupe de {npc:7997} et gardez-la en vie."
de = "Die Tauren um den Käfig respawnen schnell: Räum sie weg, bevor du die Quest bei {npc:7956} annimmst, spring dann mit ihr hinunter und öffne sofort den Käfig. Folge der größten Gruppe von {npc:7997} und halte sie am Leben."
es = "Los tauren alrededor de la jaula reaparecen rápido: elimínalos antes de aceptar la misión de {npc:7956}, luego salta abajo con ella y abre la jaula enseguida. Sigue al grupo más grande de {npc:7997} y mantenla con vida."
pt = "Os taurens ao redor da jaula reaparecem rápido: elimine-os antes de pegar a missão com {npc:7956}, depois pule com ela e abra a jaula na hora. Siga o maior grupo de {npc:7997} e mantenha-a viva."
ru = "Таурены вокруг клетки быстро появляются снова: перебейте их, прежде чем брать задание у {npc:7956}, затем спрыгните вниз вместе с ней и сразу откройте клетку. Следуйте за самой большой группой «{npc:7997}» и не дайте ей погибнуть."
ko = "우리 주변의 타우렌은 빨리 다시 나타납니다. {npc:7956}에게 퀘스트를 받기 전에 처치해 두고, 그녀와 함께 뛰어내려 곧바로 우리를 여세요. 가장 큰 {npc:7997} 무리를 따라가며 그녀를 살려 두세요."
zh_cn = "笼子周围的牛头人刷新很快：先清掉他们，再从{npc:7956}处接任务，然后和她一起跳下去立刻打开笼子。跟着最大的一群{npc:7997}，并确保她存活。"
zh_tw = "籠子周圍的牛頭人重生很快：先清掉他們，再從{npc:7956}處接任務，然後和她一起跳下去立刻打開籠子。跟著最大的一群{npc:7997}，並確保她存活。"

# Against Lord Shalzaru: the naga of the Isle of Dread cave respawn very fast; Shalzaru can be pulled without his two guards.
[[note]]
quest = 2870
phase = "objective"
objective = 1
level = "warning"
en = "The naga in the cave respawn very fast, so expect to fight your way out too, or hearth after the kill. {npc:8136} can be pulled apart from his two guards."
fr = "Les nagas de la grotte réapparaissent très vite : attendez-vous à devoir aussi vous frayer un chemin pour sortir, ou utilisez votre pierre de foyer après la victoire. {npc:8136} peut être attiré séparément de ses deux gardes."
de = "Die Naga in der Höhle respawnen sehr schnell, rechne also damit, dich auch wieder hinauszukämpfen, oder nutz nach dem Kill den Ruhestein. {npc:8136} lässt sich getrennt von seinen beiden Wachen ziehen."
es = "Los naga de la cueva reaparecen muy rápido: cuenta con abrirte paso también al salir, o usa la piedra de hogar tras matarlo. {npc:8136} se puede atraer por separado de sus dos guardias."
pt = "Os nagas da caverna reaparecem muito rápido: conte com abrir caminho também na saída, ou use a pedra de regresso depois de matá-lo. {npc:8136} pode ser puxado separado dos seus dois guardas."
ru = "Наги в пещере появляются снова очень быстро: будьте готовы пробиваться и на выходе или используйте камень возвращения после убийства. {npc:8136} можно выманить отдельно от двух его стражей."
ko = "동굴 안의 나가는 매우 빨리 다시 나타나므로 나올 때도 싸워야 할 각오를 하거나, 처치 후 귀환석을 쓰세요. {npc:8136}은(는) 두 경비병과 따로 끌어낼 수 있습니다."
zh_cn = "洞里的纳迦刷新非常快，出来时也得一路打出去，或者击杀后使用炉石。{npc:8136}可以和他的两个护卫分开拉。"
zh_tw = "洞裡的納迦重生非常快，出來時也得一路打出去，或者擊殺後使用爐石。{npc:8136}可以和他的兩個護衛分開拉。"

# The Mystery of Morrowgrain: Morrowgrain only comes from Evergreen Herb Casings grown by the pouch, which has a 10-minute cooldown and does not always yield it.
[[note]]
quest = 3791
phase = "objective"
objective = 1
level = "info"
en = "{item:11040} comes from {item:11024}, grown with {item:11020} from {item:11018} ×2 and a seed of {item:11022}. The pouch has a 10-minute cooldown and casings do not always hold it: start early and use it every 10 minutes while questing."
fr = "{item:11040} s'obtient dans {item:11024}, que fait pousser {item:11020} à partir de {item:11018} ×2 et d'une graine de {item:11022}. La bourse a un temps de recharge de 10 minutes et n'en donne pas toujours : commencez tôt et utilisez-la toutes les 10 minutes en faisant vos quêtes."
de = "{item:11040} stammt aus {item:11024}, das {item:11020} aus {item:11018} ×2 und einem Samen aus {item:11022} wachsen lässt. Der Beutel hat 10 Minuten Abklingzeit und nicht jede Hülle enthält es: Fang früh an und benutze ihn beim Questen alle 10 Minuten."
