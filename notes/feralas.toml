en = "Take {quest:7003} from {npc:14637} first: his {item:18904} makes {npc:5357} and {npc:5358} lose their elite status, and the vessel still works on their corpses. The sea giants on the coast do not count."
fr = "Prenez d'abord {quest:7003} auprès de {npc:14637} : son {item:18904} fait perdre leur statut d'élite à {npc:5357} et {npc:5358}, et le réceptacle marche toujours sur leurs cadavres. Les géants des mers de la côte ne comptent pas."
de = "Nimm zuerst {quest:7003} bei {npc:14637} an: sein {item:18904} nimmt {npc:5357} und {npc:5358} den Elitestatus, und das Gefäß wirkt weiterhin auf ihre Leichen. Die Meeresriesen an der Küste zählen nicht."
es = "Acepta primero {quest:7003} de {npc:14637}: su {item:18904} hace que {npc:5357} y {npc:5358} pierdan su estatus de élite, y el recipiente sigue funcionando con sus cadáveres. Los gigantes de mar de la costa no cuentan."
pt = "Pegue primeiro {quest:7003} com {npc:14637}: o {item:18904} dele faz {npc:5357} e {npc:5358} perderem o status de elite, e o receptáculo ainda funciona nos cadáveres. Os gigantes marinhos da costa não contam."
ru = "Сначала возьмите задание {quest:7003} у {npc:14637}: его {item:18904} лишает {npc:5357} и {npc:5358} статуса элиты, а сосуд по-прежнему действует на их трупы. Морские великаны на побережье не подходят."
ko = "먼저 {npc:14637}에게서 {quest:7003} 퀘스트를 받으세요. 그의 {item:18904}을(를) 쓰면 {npc:5357}, {npc:5358} 모두 정예 등급이 사라지고, 그 시체에도 그릇을 그대로 쓸 수 있습니다. 해안의 바다 거인은 해당하지 않습니다."
zh_cn = "先从{npc:14637}那里接受{quest:7003}：他的{item:18904}能让{npc:5357}和{npc:5358}失去精英状态，而容器对它们的尸体依然有效。海岸边的海巨人不算。"
zh_tw = "先從{npc:14637}那裡接受{quest:7003}：他的{item:18904}能讓{npc:5357}和{npc:5358}失去精英狀態，而容器對牠們的屍體依然有效。海岸邊的海巨人不算。"
