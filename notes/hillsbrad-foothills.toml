en = "Use the quest item from your bags on the lectern in front of where {npc:2335} stands, not on the tables. He does not need to be there."
fr = "Utilisez l'objet de quête depuis vos sacs sur le lutrin devant l'endroit où se tient {npc:2335}, pas sur les tables. Il n'a pas besoin d'être là."
de = "Benutze den Questgegenstand aus deinen Taschen am Lesepult vor der Stelle, an der {npc:2335} steht, nicht an den Tischen. Er muss nicht da sein."
es = "Usa el objeto de misión desde tus bolsas en el atril frente al lugar donde está {npc:2335}, no en las mesas. No hace falta que él esté allí."
pt = "Use o item de missão das suas bolsas no atril em frente ao lugar onde {npc:2335} fica, não nas mesas. Ele não precisa estar lá."
ru = "Используйте предмет задания из сумки на кафедре перед местом, где стоит {npc:2335}, а не на столах. Ему не обязательно быть там."
ko = "가방에서 퀘스트 아이템을 {npc:2335}이(가) 서 있는 자리 앞의 독서대에 사용하세요. 탁자가 아닙니다. 그가 그 자리에 있을 필요는 없습니다."
zh_cn = "从背包里对{npc:2335}所站位置前的讲台使用任务物品，不是桌子。他不在也没关系。"
zh_tw = "從背包裡對{npc:2335}所站位置前的講台使用任務物品，不是桌子。他不在也沒關係。"
