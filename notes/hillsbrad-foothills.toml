objective = 1
icon = "pickup"

# Hints of a New Plague?: the courier and her four guards spawn at the apothecary's house on Go'Shek Farm and walk to Tarren Mill; the Stromgarde riders on the road attack them.
[[note]]
quest = 658
phase = "objective"
objective = 1
level = "warning"
en = "{npc:2714} and four bodyguards leave {npc:2733}'s house at the farm and walk the road west to Tarren Mill; she reappears at the farm a few minutes after dying. Riders ({npc:2738}) patrolling the same road attack her group: strike when they meet."
fr = "{npc:2714} et quatre gardes du corps partent de la maison de {npc:2733}, à la ferme, et suivent la route à l'ouest jusqu'à Moulin-de-Tarren ; elle réapparaît à la ferme quelques minutes après sa mort. Des cavaliers ({npc:2738}) sur la même route attaquent son groupe : frappez quand ils se croisent."
de = "{npc:2714} und vier Leibwächter brechen vom Haus von {npc:2733} auf dem Hof auf und folgen der Straße nach Westen bis Tarrens Mühle; nach ihrem Tod ist sie wenige Minuten später wieder am Hof. Reiter ({npc:2738}) auf derselben Straße greifen ihre Gruppe an: Schlag zu, wenn sie sich treffen."
es = "{npc:2714} y cuatro guardaespaldas salen de la casa de {npc:2733}, en la granja, y siguen el camino hacia el oeste hasta Molino Tarren; reaparece en la granja unos minutos después de morir. Unos jinetes ({npc:2738}) que patrullan el mismo camino atacan a su grupo: ataca cuando se encuentren."
pt = "{npc:2714} e quatro guarda-costas saem da casa de {npc:2733}, na fazenda, e seguem a estrada para oeste até Moinho Tarren; ela reaparece na fazenda alguns minutos após morrer. Cavaleiros ({npc:2738}) que patrulham a mesma estrada atacam o grupo dela: ataque quando eles se encontrarem."
ru = "{npc:2714} с четырьмя телохранителями выходит из дома персонажа {npc:2733} на ферме и идёт по дороге на запад до Мельницы Таррен; после смерти она появляется на ферме через несколько минут. Всадники ({npc:2738}) на той же дороге нападают на её отряд: бейте, когда они встретятся."
ko = "{npc:2714}은(는) 경호원 넷과 함께 농장의 {npc:2733} 집에서 출발해 길을 따라 서쪽 타렌 밀농장까지 걸어갑니다. 죽으면 몇 분 뒤 농장에 다시 나타납니다. 같은 길을 순찰하는 기병({npc:2738})이 그 무리를 공격하니 둘이 마주칠 때 공격하세요."
zh_cn = "{npc:2714}带着四名保镖从农场里{npc:2733}的房子出发，沿道路向西走到塔伦米尔；她死后几分钟会在农场重新出现。同一条路上巡逻的骑兵（{npc:2738}）会攻击她的队伍：趁双方相遇时动手。"
zh_tw = "{npc:2714}帶著四名保鏢從農場裡{npc:2733}的房子出發，沿道路向西走到塔倫米爾；她死後幾分鐘會在農場重新出現。同一條路上巡邏的騎兵（{npc:2738}）會攻擊她的隊伍：趁雙方相遇時動手。"

# Hints of a New Plague?: Kinelory keeps walking during fights and fails if left behind; orcs wait below the hill; she respawns beside Quae.
[[note]]
quest = 660
level = "warning"
en = "Stay close to {npc:2713}: she keeps walking while you fight, and the escort fails if she gets too far or dies. Clear the orcs below the hill first. If she is not beside {npc:2712}, wait a few minutes for her to come back."
fr = "Restez près de {npc:2713} : elle continue d'avancer pendant que vous combattez, et l'escorte échoue si elle s'éloigne trop ou meurt. Nettoyez d'abord les orcs au pied de la colline. Si elle n'est pas à côté de {npc:2712}, attendez quelques minutes qu'elle revienne."
de = "Bleib nah bei {npc:2713}: Sie läuft weiter, während du kämpfst, und die Eskorte scheitert, wenn sie sich zu weit entfernt oder stirbt. Räum vorher die Orcs unterhalb des Hügels ab. Ist sie nicht bei {npc:2712}, warte ein paar Minuten, bis sie zurückkommt."
es = "Quédate cerca de {npc:2713}: sigue caminando mientras luchas, y la escolta falla si se aleja demasiado o muere. Limpia antes los orcos al pie de la colina. Si no está junto a {npc:2712}, espera unos minutos a que vuelva."
pt = "Fique perto de {npc:2713}: ela continua andando enquanto você luta, e a escolta falha se ela se afastar demais ou morrer. Limpe antes os orcs ao pé da colina. Se ela não estiver ao lado de {npc:2712}, espere alguns minutos até ela voltar."
ru = "Держитесь рядом с персонажем {npc:2713}: она идёт дальше, пока вы сражаетесь, и сопровождение провалится, если она уйдёт далеко или погибнет. Сначала перебейте орков у подножия холма. Если её нет рядом с персонажем {npc:2712}, подождите несколько минут."
ko = "{npc:2713} 곁에 붙어 있으세요. 전투 중에도 계속 걸어가며, 너무 멀어지거나 죽으면 호위가 실패합니다. 먼저 언덕 아래의 오크를 처치하세요. {npc:2712} 옆에 없다면 몇 분 기다리면 돌아옵니다."
zh_cn = "紧跟{npc:2713}：你战斗时她会继续前进，如果她走得太远或死亡，护送就会失败。先清掉山坡下的兽人。如果她不在{npc:2712}身边，等几分钟她就会回来。"
zh_tw = "緊跟{npc:2713}：你戰鬥時她會繼續前進，如果她走得太遠或死亡，護送就會失敗。先清掉山坡下的獸人。如果她不在{npc:2712}身邊，等幾分鐘她就會回來。"

# Hillsbrad's Hoard: the item goes on the lectern where the magistrate stands, not on the tables of the town hall; the magistrate need not be alive.
