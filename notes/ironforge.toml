# Quest notes of Ironforge. See notes/README.md for the format.

# Signal for Pickup: the pilot does not appear at once after the flare; he lands after a wait that can reach a few minutes.
[[note]]
quest = 3451
phase = "turnin"
level = "info"
en = "After you fire the {item:10444} on the pad, {npc:8392} can take a few minutes to fly in and land: stay on the pad and wait for him."
fr = "Après avoir tiré avec le {item:10444} sur la plateforme, {npc:8392} peut mettre quelques minutes à arriver et se poser : restez sur la plateforme et attendez-le."
de = "Nachdem du die {item:10444} auf der Plattform abgefeuert hast, kann {npc:8392} einige Minuten brauchen, bis er heranfliegt und landet: Bleib auf der Plattform und warte auf ihn."
es = "Después de disparar la {item:10444} en la plataforma, {npc:8392} puede tardar unos minutos en llegar y aterrizar: quédate en la plataforma y espéralo."
pt = "Depois de disparar a {item:10444} na plataforma, {npc:8392} pode levar alguns minutos para chegar e pousar: fique na plataforma e espere por ele."
ru = "После выстрела из {item:10444} на площадке {npc:8392} может прилететь и приземлиться только через несколько минут: оставайтесь на площадке и ждите его."
ko = "착륙장에서 {item:10444}을(를) 쏜 뒤 {npc:8392}이(가) 날아와 착륙하기까지 몇 분이 걸릴 수 있습니다. 착륙장에 머물며 기다리세요."
zh_cn = "在停机坪上发射{item:10444}后，{npc:8392}可能要过几分钟才会飞来降落：待在停机坪上等他。"
zh_tw = "在停機坪上發射{item:10444}後，{npc:8392}可能要過幾分鐘才會飛來降落：待在停機坪上等他。"

# The Smoldering Ruins of Thaurissan (first part): it completes by hearing the historian's whole story after accepting; the relics of the next part cannot be taken before.
[[note]]
quest = 3702
phase = "objective"
objective = 1
level = "info"
en = "After accepting, talk to {npc:8879} again and click through her whole story: that completes the quest, and the relics of the next part cannot be collected before."
fr = "Après avoir accepté, reparlez à {npc:8879} et faites défiler tout son récit : cela termine la quête, et les reliques de la suite ne peuvent pas être récupérées avant."
de = "Sprich nach dem Annehmen erneut mit {npc:8879} und klick dich durch ihre ganze Geschichte: Das schließt die Quest ab, und vorher lassen sich die Relikte des nächsten Teils nicht einsammeln."
es = "Tras aceptarla, vuelve a hablar con {npc:8879} y pasa por todo su relato: eso completa la misión, y antes no se pueden recoger las reliquias de la siguiente parte."
pt = "Depois de aceitar, fale de novo com {npc:8879} e passe por toda a história dela: isso conclui a missão, e antes disso as relíquias da próxima parte não podem ser coletadas."
ru = "Приняв задание, снова поговорите с {npc:8879} и прослушайте весь её рассказ: это выполняет задание, а до этого реликвии следующей части собрать нельзя."
ko = "퀘스트를 받은 뒤 {npc:8879}에게 다시 말을 걸어 이야기를 끝까지 넘기세요. 그래야 퀘스트가 완료되고, 그 전에는 다음 단계의 유물을 모을 수 없습니다."
zh_cn = "接受任务后，再和{npc:8879}对话，把她的故事全部点完：这样任务才会完成，在此之前无法收集下一部分的遗物。"
zh_tw = "接受任務後，再和{npc:8879}對話，把她的故事全部點完：這樣任務才會完成，在此之前無法收集下一部分的遺物。"

# Dwarven Justice: the Dying Archaeologist lies in the caves under Thorium Point; the crane shaft south of the camp is the quick way down.
[[note]]
quest = 3371
phase = "turnin"
level = "info"
en = "{npc:8417} lies in the caves under the flight point camp, not on the surface. Drop through the shaft with a crane south of the camp onto the hanging stone block, then to the cave floor, and walk north."
fr = "{npc:8417} est étendu dans les grottes sous le camp du maître de vol, pas en surface. Descendez par le puits à la grue au sud du camp sur le bloc de pierre suspendu, puis jusqu'au sol de la grotte, et marchez vers le nord."
de = "{npc:8417} liegt in den Höhlen unter dem Lager mit dem Flugmeister, nicht an der Oberfläche. Lass dich durch den Schacht mit dem Kran südlich des Lagers auf den hängenden Steinblock fallen, dann auf den Höhlenboden, und geh nach Norden."
es = "{npc:8417} yace en las cuevas bajo el campamento del maestro de vuelo, no en la superficie. Déjate caer por el pozo con una grúa al sur del campamento sobre el bloque de piedra colgante, luego al suelo de la cueva, y ve hacia el norte."
pt = "{npc:8417} está nas cavernas sob o acampamento do mestre de voo, não na superfície. Desça pelo poço com um guindaste ao sul do acampamento até o bloco de pedra suspenso, depois até o chão da caverna, e siga para o norte."
ru = "{npc:8417} лежит в пещерах под лагерем с распорядителем полетов, а не на поверхности. Спрыгните в шахту с краном к югу от лагеря на подвешенный каменный блок, затем на дно пещеры и идите на север."
ko = "{npc:8417}은(는) 지상이 아니라 비행 조련사가 있는 야영지 아래 동굴에 누워 있습니다. 야영지 남쪽의 기중기가 있는 수직 갱도로 매달린 돌덩이 위에 뛰어내린 뒤 동굴 바닥으로 내려가 북쪽으로 가세요."
zh_cn = "{npc:8417}躺在飞行点营地下方的洞穴里，而不是地面上。从营地南边有起重机的竖井跳到吊着的石块上，再跳到洞底，然后往北走。"
zh_tw = "{npc:8417}躺在飛行點營地下方的洞穴裡，而不是地面上。從營地南邊有起重機的豎井跳到吊著的石塊上，再跳到洞底，然後往北走。"

# Seeing What Happens: the Uldum pedestal can be reached along the hills on the left without fighting the elite giants; one giant patrols.
[[note]]
quest = 2946
phase = "turnin"
level = "warning"
en = "Reach the {object:142343} by the path along the hills left of the gate, away from the elite giants. A {npc:5470} patrols there: the ground shakes as it comes near."
fr = "Rejoignez {object:142343} par le chemin qui longe les collines à gauche de la porte, à l'écart des géants élites. Attention à {npc:5470} qui patrouille là : le sol tremble quand il approche."
de = "Erreiche {object:142343} über den Pfad an den Hügeln links vom Tor, abseits der Elite-Riesen. Achte auf {npc:5470}, der dort patrouilliert: der Boden bebt, wenn er näher kommt."
es = "Llega a {object:142343} por el sendero que bordea las colinas a la izquierda de la puerta, lejos de los gigantes élite. Cuidado con {npc:5470}, que patrulla allí: el suelo tiembla cuando se acerca."
pt = "Chegue a {object:142343} pela trilha ao longo das colinas à esquerda do portão, longe dos gigantes elite. Cuidado com {npc:5470}, que patrulha ali: o chão treme quando ele se aproxima."
ru = "Подойдите к {object:142343} по тропе вдоль холмов слева от ворот, подальше от элитных великанов. Там патрулирует {npc:5470}: когда он рядом, земля дрожит."
ko = "문 왼쪽 언덕을 따라 난 길로 정예 거인들을 피해 {object:142343}에 가세요. 그곳을 순찰하는 {npc:5470}을(를) 조심하세요. 가까이 오면 땅이 흔들립니다."
zh_cn = "沿大门左侧山丘边的小路前往{object:142343}，避开精英巨人。小心在那里巡逻的{npc:5470}：它靠近时地面会震动。"
zh_tw = "沿大門左側山丘邊的小路前往{object:142343}，避開精英巨人。小心在那裡巡邏的{npc:5470}：牠靠近時地面會震動。"
