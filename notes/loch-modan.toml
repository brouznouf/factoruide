zh_cn = "Daggerfang（15级）沿着岸边来回巡逻，你到达时可能不在：等他的时候，先在附近的鳄鱼身上做{quest:385}。"
zh_tw = "Daggerfang（15級）沿著岸邊來回巡邏，你到達時可能不在：等牠的時候，先在附近的鱷魚身上做{quest:385}。"

# Banner of the Fallen: the banner starts trogg waves before the named trogg comes; it stays and can be used again after 30 s.
[[note]]
quest = 86585
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "Plant the banner where you found it, next to Mountaineer Ylva: trogg waves come from both sides of the cave, then Headsplitter (level 15-17) runs in. If someone else tags him, plant it again after its 30-second cooldown."
fr = "Plantez la bannière là où vous l'avez trouvée, près de Mountaineer Ylva : des vagues de troggs arrivent des deux côtés de la grotte, puis Headsplitter (niveau 15-17) accourt. Si un autre le touche avant vous, replantez-la après 30 secondes de recharge."
de = "Stell das Banner dort auf, wo du es gefunden hast, neben Mountaineer Ylva: Troggwellen kommen von beiden Seiten der Höhle, dann stürmt Headsplitter (Stufe 15-17) heran. Markiert ihn jemand anderes zuerst, stell es nach 30 Sekunden Abklingzeit erneut auf."
es = "Planta el estandarte donde lo encontraste, junto a Mountaineer Ylva: llegan oleadas de troggs por ambos lados de la cueva y luego aparece Headsplitter (nivel 15-17). Si otro lo marca antes, plántalo de nuevo tras su reutilización de 30 segundos."
pt = "Finque o estandarte onde você o encontrou, ao lado de Mountaineer Ylva: ondas de troggs vêm dos dois lados da caverna, depois Headsplitter (nível 15-17) chega correndo. Se outro jogador o marcar antes, finque-o de novo após a recarga de 30 segundos."
ru = "Установите знамя там, где нашли его, рядом с Mountaineer Ylva: волны троггов идут с обеих сторон пещеры, затем прибегает Headsplitter (уровень 15-17). Если его первым атакует другой игрок, установите знамя снова через 30 секунд."
ko = "깃발을 찾은 자리, Mountaineer Ylva 옆에 꽂으세요. 동굴 양쪽에서 트로그 무리가 몰려온 뒤 Headsplitter(15-17레벨)이(가) 달려옵니다. 다른 사람이 먼저 선점하면 30초 재사용 대기시간 후 다시 꽂으세요."
zh_cn = "把旗帜插回你找到它的地方，Mountaineer Ylva旁边：穴居人会从洞穴两侧一波波涌来，随后Headsplitter（15-17级）冲过来。如果被别人抢先攻击，30秒冷却后再插一次。"
zh_tw = "把旗幟插回你找到它的地方，Mountaineer Ylva旁邊：穴居人會從洞穴兩側一波波湧來，隨後Headsplitter（15-17級）衝過來。如果被別人搶先攻擊，30秒冷卻後再插一次。"

