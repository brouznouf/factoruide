# Quest notes of the Riverglades. See notes/README.md for the format.

# WANTED: Trapclaw: the crab spawns on the sea floor east of the docks, walks south-west towards them, respawns slowly; it is not elite.
[[note]]
quest = 95254
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "The crab spawns on the sea floor around 87, 50 and walks south-west towards the docks. It respawns slowly, so you may have to wait. It is not elite and can be soloed."
fr = "Le crabe apparaît au fond de la mer vers 87, 50 et marche vers le sud-ouest en direction des quais. Sa réapparition est lente, il faudra peut-être attendre. Il n'est pas élite et se fait en solo."
de = "Die Krabbe erscheint auf dem Meeresgrund bei etwa 87, 50 und läuft nach Südwesten zu den Docks. Ihr Respawn ist langsam, du musst eventuell warten. Sie ist kein Elite und solo machbar."
es = "El cangrejo aparece en el fondo del mar hacia 87, 50 y camina hacia el suroeste, en dirección a los muelles. Reaparece despacio, así que quizá tengas que esperar. No es élite y se puede hacer solo."
pt = "O caranguejo surge no fundo do mar por volta de 87, 50 e anda para o sudoeste rumo às docas. Ele reaparece devagar, então talvez seja preciso esperar. Não é elite e dá para fazer sozinho."
ru = "Краб появляется на морском дне около 87, 50 и идёт на юго-запад к причалам. Он возрождается медленно, возможно, придётся подождать. Он не элитный, его можно убить в одиночку."
ko = "게는 87, 50 부근 바다 밑에서 나타나 남서쪽 부두 쪽으로 걸어갑니다. 재생성이 느리니 기다려야 할 수도 있습니다. 정예가 아니라 혼자서도 잡을 수 있습니다."
zh_cn = "这只螃蟹在大约87, 50的海底刷新，然后向西南走向码头。它刷新很慢，可能要等一会儿。它不是精英，可以单刷。"
zh_tw = "這隻螃蟹在大約87, 50的海底重生，然後向西南走向碼頭。牠重生很慢，可能要等一會兒。牠不是菁英，可以單刷。"

[[icon]]
quest = 95254
