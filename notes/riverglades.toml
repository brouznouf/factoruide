# Quest notes of the Riverglades. See notes/README.md for the format.

# WANTED: Trapclaw: the crab spawns on the sea floor east of the docks, walks south-west towards them, respawns slowly; it is not elite.
[[note]]
quest = 95254
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "The crab spawns on the sea floor around 87, 50 and walks south-west towards the docks. It respawns slowly, so you may have to wait. It is not elite and can be soloed."
fr = "Le crabe apparaît au fond de la mer vers 87, 50 et marche vers le sud-ouest en direction des quais. Sa réapparition est lente, il faudra peut-être attendre. Il n'est pas élite et se fait en solo."
de = "Die Krabbe erscheint auf dem Meeresgrund bei etwa 87, 50 und läuft nach Südwesten zu den Docks. Ihr Respawn ist langsam, du musst eventuell warten. Sie ist kein Elite und solo machbar."
es = "El cangrejo aparece en el fondo del mar hacia 87, 50 y camina hacia el suroeste, en dirección a los muelles. Reaparece despacio, así que quizá tengas que esperar. No es élite y se puede hacer solo."
pt = "O caranguejo surge no fundo do mar por volta de 87, 50 e anda para o sudoeste rumo às docas. Ele reaparece devagar, então talvez seja preciso esperar. Não é elite e dá para fazer sozinho."
ru = "Краб появляется на морском дне около 87, 50 и идёт на юго-запад к причалам. Он возрождается медленно, возможно, придётся подождать. Он не элитный, его можно убить в одиночку."
ko = "게는 87, 50 부근 바다 밑에서 나타나 남서쪽 부두 쪽으로 걸어갑니다. 재생성이 느리니 기다려야 할 수도 있습니다. 정예가 아니라 혼자서도 잡을 수 있습니다."
zh_cn = "这只螃蟹在大约87, 50的海底刷新，然后向西南走向码头。它刷新很慢，可能要等一会儿。它不是精英，可以单刷。"
zh_tw = "這隻螃蟹在大約87, 50的海底重生，然後向西南走向碼頭。牠重生很慢，可能要等一會兒。牠不是菁英，可以單刷。"

[[icon]]
quest = 95254
phase = "objective"
objective = 1
icon = "rare"
editions = ["forever"]

# In Need of Relief: the turn-in NPC is the escort of the next quest; while someone escorts him, he is gone until a few minutes after the escort ends.
[[note]]
quest = 96125
phase = "turnin"
level = "warning"
editions = ["forever"]
en = "If the NPC you turn in to is not in his cave, someone is doing his escort: he is back a few minutes after it ends."
fr = "Si le PNJ à qui rendre la quête n'est pas dans sa grotte, quelqu'un fait son escorte : il revient quelques minutes après la fin de celle-ci."
de = "Ist der NPC, bei dem du abgibst, nicht in seiner Höhle, macht gerade jemand seine Eskorte: er ist ein paar Minuten nach deren Ende zurück."
es = "Si el PNJ al que entregas la misión no está en su cueva, alguien está haciendo su escolta: vuelve unos minutos después de que termine."
pt = "Se o PNJ a quem você entrega a missão não estiver na caverna, alguém está fazendo a escolta dele: ele volta alguns minutos depois que ela termina."
ru = "Если НИП, которому нужно сдать задание, нет в его пещере, кто-то его сопровождает: он вернётся через несколько минут после конца сопровождения."
ko = "퀘스트를 완료할 NPC가 동굴에 없다면 누군가 그를 호위하는 중입니다. 호위가 끝나고 몇 분 뒤에 돌아옵니다."
zh_cn = "如果交任务的NPC不在他的洞里，说明有人正在护送他：护送结束几分钟后他就会回来。"
zh_tw = "如果交任務的NPC不在他的洞裡，表示有人正在護送他：護送結束幾分鐘後他就會回來。"

# If a Tree Falls, and No One Hears...: the turn-in NPC sits on the back of the wagon and is away while another player escorts him.
[[note]]
quest = 94857
phase = "turnin"
level = "warning"
editions = ["forever"]
en = "The NPC you turn in to sits on the back of the wagon. If he is missing, another player is escorting him: wait for him to come back."
fr = "Le PNJ à qui rendre la quête est assis à l'arrière du chariot. S'il n'y est pas, un autre joueur l'escorte : attendez qu'il revienne."
de = "Der NPC, bei dem du abgibst, sitzt hinten auf dem Wagen. Fehlt er, eskortiert ihn gerade ein anderer Spieler: warte, bis er zurück ist."
es = "El PNJ al que entregas la misión está sentado en la parte trasera del carro. Si no está, otro jugador lo está escoltando: espera a que vuelva."
pt = "O PNJ a quem você entrega a missão fica sentado na traseira da carroça. Se ele não estiver lá, outro jogador o está escoltando: espere ele voltar."
ru = "НИП, которому нужно сдать задание, сидит в задней части повозки. Если его нет, его сопровождает другой игрок: дождитесь его возвращения."
ko = "퀘스트를 완료할 NPC는 마차 뒤쪽에 앉아 있습니다. 보이지 않으면 다른 플레이어가 그를 호위하는 중이니 돌아올 때까지 기다리세요."
zh_cn = "交任务的NPC坐在马车后部。如果他不在，说明有其他玩家正在护送他：等他回来。"
zh_tw = "交任務的NPC坐在馬車後方。如果他不在，表示有其他玩家正在護送他：等他回來。"

# Wheeler's Fleeing Steeds: the horse waits by the river bend north of Wheeler's Grange, is not always up, and two pairs of coyotes ambush the escort back to the farm.
[[note]]
quest = 94618
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "The horse waits by the river bend north of the farm, around 53.6, 66.4; if it is not there, wait a little for it to appear. Feed it and lead it back to Benjy Wheeler: two pairs of coyotes ambush you on the way."
fr = "Le cheval attend près du coude de la rivière au nord de la ferme, vers 53.6, 66.4 ; s'il n'y est pas, attendez un peu qu'il apparaisse. Nourrissez-le et ramenez-le à Benjy Wheeler : deux paires de coyotes vous tendent une embuscade en route."
de = "Das Pferd wartet an der Flussbiegung nördlich des Hofs, bei etwa 53.6, 66.4; ist es nicht da, warte kurz, bis es erscheint. Füttere es und führe es zu Benjy Wheeler zurück: Unterwegs greifen dich zweimal zwei Kojoten an."
es = "El caballo espera junto al recodo del río al norte de la granja, hacia 53.6, 66.4; si no está, espera un poco a que aparezca. Dale de comer y llévalo de vuelta con Benjy Wheeler: dos parejas de coyotes te emboscan por el camino."
pt = "O cavalo espera perto da curva do rio ao norte da fazenda, por volta de 53.6, 66.4; se ele não estiver lá, espere um pouco até aparecer. Alimente-o e leve-o de volta a Benjy Wheeler: dois pares de coiotes emboscam você no caminho."
ru = "Лошадь ждёт у излучины реки к северу от фермы, около 53.6, 66.4; если её нет, подождите немного, пока она появится. Накормите её и отведите к Benjy Wheeler: по дороге на вас дважды нападут по два койота."
ko = "말은 농장 북쪽 강굽이 근처 53.6, 66.4 부근에서 기다립니다. 보이지 않으면 나타날 때까지 잠시 기다리세요. 먹이를 준 뒤 Benjy Wheeler에게 데려가세요. 가는 길에 코요테 두 마리씩 두 번 매복해 있습니다."
zh_cn = "马在农场北边的河湾旁等着，大约在53.6, 66.4；如果它不在，稍等片刻它就会出现。喂它之后把它带回Benjy Wheeler那里：路上会有两拨各两只郊狼伏击你。"
zh_tw = "馬在農場北邊的河灣旁等著，大約在53.6, 66.4；如果牠不在，稍等片刻牠就會出現。餵牠之後把牠帶回Benjy Wheeler那裡：路上會有兩批各兩隻郊狼伏擊你。"

# WANTED: Ghostmaw (Alliance and Horde): the elite crocolisk spawns in the north of the river and swims down it to the south.
[[note]]
quest = 95991
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "Ghostmaw (elite) does not stay in one place: it appears in the river around 65.1, 35.7 and swims down it all the way south. Wait at its spawn or follow the river to find it."
fr = "Ghostmaw (élite) ne reste pas en place : il apparaît dans la rivière vers 65.1, 35.7 et la descend jusqu'au sud. Attendez-le à son point d'apparition ou suivez la rivière pour le trouver."
de = "Ghostmaw (Elite) bleibt nicht an einem Ort: Es erscheint im Fluss bei etwa 65.1, 35.7 und schwimmt ihn hinab bis in den Süden. Warte an seinem Spawnpunkt oder folge dem Fluss, um es zu finden."
es = "Ghostmaw (élite) no se queda quieto: aparece en el río hacia 65.1, 35.7 y lo recorre río abajo hasta el sur. Espéralo donde aparece o sigue el río para encontrarlo."
pt = "Ghostmaw (elite) não fica parado: ele surge no rio por volta de 65.1, 35.7 e desce por ele até o sul. Espere-o onde ele surge ou siga o rio para encontrá-lo."
ru = "Ghostmaw (элитный) не стоит на месте: он появляется в реке около 65.1, 35.7 и плывёт вниз по ней до самого юга. Ждите его у точки появления или идите вдоль реки, чтобы найти его."
ko = "Ghostmaw(정예)는 한곳에 머물지 않습니다. 65.1, 35.7 부근 강에서 나타나 강을 따라 남쪽 끝까지 내려갑니다. 나타나는 곳에서 기다리거나 강을 따라가며 찾으세요."
zh_cn = "Ghostmaw（精英）不会待在一个地方：它在大约65.1, 35.7的河里出现，然后顺流一路游到南边。在它的刷新点等它，或者沿河去找它。"
zh_tw = "Ghostmaw（菁英）不會待在一個地方：牠在大約65.1, 35.7的河裡出現，然後順流一路游到南邊。在牠的重生點等牠，或者沿河去找牠。"

[[icon]]
quest = 95991
phase = "objective"
objective = 1
icon = "rare"
editions = ["forever"]

