# Digging for Answers: the miner is in the caves under Sunnyglade, reached by stairs in a ruined house next to the big tree.
[[note]]
quest = 94727
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "The caves under Sunnyglade are reached by the stairs in a ruined house next to the big tree, at 50.0, 46.0. The miner stands right at the bottom; the quests that follow are also done down there."
fr = "On accède aux grottes sous Sunnyglade par l'escalier d'une maison en ruine à côté du grand arbre, en 50.0, 46.0. Le mineur se tient juste en bas ; les quêtes suivantes se font aussi là-dessous."
de = "Zu den Höhlen unter Sunnyglade gelangst du über die Treppe in einem zerstörten Haus neben dem großen Baum, bei 50.0, 46.0. Der Minenarbeiter steht direkt unten; die folgenden Quests erledigst du ebenfalls dort unten."
es = "A las cuevas bajo Sunnyglade se llega por la escalera de una casa en ruinas junto al gran árbol, en 50.0, 46.0. El minero está justo abajo; las misiones siguientes también se hacen ahí abajo."
pt = "As cavernas sob Sunnyglade são acessadas pela escada de uma casa em ruínas ao lado da grande árvore, em 50.0, 46.0. O mineiro fica logo lá embaixo; as missões seguintes também são feitas lá."
ru = "В пещеры под Sunnyglade ведёт лестница в разрушенном доме рядом с большим деревом, в точке 50.0, 46.0. Шахтёр стоит прямо внизу; следующие задания тоже выполняются там."
ko = "Sunnyglade 아래 동굴은 큰 나무 옆 폐허가 된 집 안의 계단(50.0, 46.0)으로 내려갑니다. 광부는 계단 바로 아래에 있으며, 이어지는 퀘스트도 그 아래에서 진행합니다."
zh_cn = "Sunnyglade下方的洞穴要从大树旁一座废弃房屋里的楼梯下去，位置在50.0, 46.0。矿工就站在楼梯下面；后续任务也在那下面完成。"
zh_tw = "Sunnyglade下方的洞穴要從大樹旁一座廢棄房屋裡的樓梯下去，位置在50.0, 46.0。礦工就站在樓梯下面；後續任務也在那下面完成。"

# Abominable Magics: the cultists are in the caves under Sunnyglade (stairs in the ruined house at 50.0, 46.0); the catalyst is used on their corpses.
[[note]]
quest = 95642
phase = "objective"
objective = 1
level = "info"
editions = ["forever"]
en = "The cultists are in the caves under Sunnyglade: take the stairs in the ruined house next to the big tree, at 50.0, 46.0. Use the catalyst on their corpses and on the ritual circles."
fr = "Les cultistes sont dans les grottes sous Sunnyglade : prenez l'escalier de la maison en ruine à côté du grand arbre, en 50.0, 46.0. Utilisez le catalyseur sur leurs cadavres et sur les cercles rituels."
de = "Die Kultisten sind in den Höhlen unter Sunnyglade: Nimm die Treppe im zerstörten Haus neben dem großen Baum, bei 50.0, 46.0. Benutze den Katalysator an ihren Leichen und an den Ritualkreisen."
es = "Los cultistas están en las cuevas bajo Sunnyglade: baja por la escalera de la casa en ruinas junto al gran árbol, en 50.0, 46.0. Usa el catalizador sobre sus cadáveres y sobre los círculos rituales."
pt = "Os cultistas estão nas cavernas sob Sunnyglade: desça a escada da casa em ruínas ao lado da grande árvore, em 50.0, 46.0. Use o catalisador nos cadáveres deles e nos círculos rituais."
ru = "Культисты находятся в пещерах под Sunnyglade: спуститесь по лестнице в разрушенном доме рядом с большим деревом, в точке 50.0, 46.0. Используйте катализатор на их трупах и на ритуальных кругах."
ko = "광신도들은 Sunnyglade 아래 동굴에 있습니다. 큰 나무 옆 폐허가 된 집의 계단(50.0, 46.0)으로 내려가세요. 촉매는 그들의 시체와 의식의 법진에 사용합니다."
zh_cn = "邪教徒在Sunnyglade下方的洞穴里：从大树旁那座废弃房屋里的楼梯下去，位置在50.0, 46.0。对他们的尸体和仪式法阵使用催化剂。"
zh_tw = "邪教徒在Sunnyglade下方的洞穴裡：從大樹旁那座廢棄房屋裡的樓梯下去，位置在50.0, 46.0。對他們的屍體和儀式法陣使用催化劑。"
