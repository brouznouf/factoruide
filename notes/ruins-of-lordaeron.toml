# Quest notes of the Ruins of Lordaeron. See notes/README.md for the format.

# Crest of Lordaeron (Forever): the crest spawns at one of several places in the dungeon, or not
# at all; the tower right of the entrance is the usual spot, resetting the instance rerolls it.
[[note]]
quest = 95204
phase = "accept"
level = "warning"
editions = ["forever"]
en = "{object:614679} appears at one of several spots in {zone:16611}, and sometimes not at all. Look first on the upper floor of the tower right of the entrance, in the spider area; if it is missing, leave and reset the instance."
fr = "L'{object:614679} apparaît à l'un de plusieurs endroits des {zone:16611}, et parfois pas du tout. Regardez d'abord à l'étage de la tour à droite de l'entrée, dans la zone des araignées ; s'il n'y est pas, sortez et réinitialisez l'instance."
de = "{object:614679} erscheint an einer von mehreren Stellen in {zone:16611}, manchmal auch gar nicht. Schau zuerst im oberen Stockwerk des Turms rechts vom Eingang nach, im Spinnenbereich; fehlt es, geh raus und setz die Instanz zurück."
es = "{object:614679} aparece en uno de varios puntos de {zone:16611}, y a veces no aparece. Mira primero en el piso de arriba de la torre a la derecha de la entrada, en la zona de las arañas; si no está, sal y reinicia la instancia."
pt = "{object:614679} aparece em um de vários pontos de {zone:16611}, e às vezes não aparece. Olhe primeiro no andar de cima da torre à direita da entrada, na área das aranhas; se não estiver lá, saia e reinicie a instância."
ru = "{object:614679} появляется в одном из нескольких мест (локация {zone:16611}), а иногда не появляется вовсе. Сначала проверьте верхний этаж башни справа от входа, в зоне пауков; если его нет, выйдите и сбросьте подземелье."
ko = "{object:614679}은(는) {zone:16611}의 여러 장소 중 한 곳에 나타나며, 아예 없을 때도 있습니다. 먼저 입구 오른쪽 탑의 위층, 거미 구역을 살펴보세요. 없으면 밖으로 나가 인스턴스를 초기화하세요."
zh_cn = "{object:614679}会出现在{zone:16611}的几个地点之一，有时根本不出现。先去入口右侧塔楼的上层、蜘蛛区域找；如果没有，就出去重置副本。"
zh_tw = "{object:614679}會出現在{zone:16611}的幾個地點之一，有時根本不出現。先去入口右側塔樓的上層、蜘蛛區域找；如果沒有，就出去重置副本。"
