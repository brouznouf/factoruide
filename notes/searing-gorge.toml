# The Torch of Retribution (2): Kalaran takes about a minute to make the torch, which floats next to him and ends the quest; his despawning fails it.
[[note]]
quest = 3454
level = "warning"
en = "Stay by {npc:8479} after you accept it: he takes about a minute to make the torch, which then floats beside him; click it to hand the quest in. If he vanishes meanwhile, the quest fails."
fr = "Restez près de {npc:8479} après l'avoir acceptée : il met environ une minute à fabriquer la torche, qui flotte ensuite à côté de lui ; cliquez dessus pour rendre la quête. S'il disparaît entre-temps, la quête échoue."
de = "Bleib nach der Annahme bei {npc:8479}: er braucht etwa eine Minute für die Fackel, die dann neben ihm schwebt; klicke sie an, um die Quest abzugeben. Verschwindet er währenddessen, scheitert die Quest."
es = "Quédate junto a {npc:8479} tras aceptarla: tarda cerca de un minuto en crear la antorcha, que luego flota a su lado; haz clic en ella para entregar la misión. Si él desaparece mientras tanto, la misión falla."
pt = "Fique perto de {npc:8479} depois de aceitar: ele leva cerca de um minuto para fazer a tocha, que depois flutua ao lado dele; clique nela para entregar a missão. Se ele sumir nesse meio-tempo, a missão falha."
ru = "Взяв задание, оставайтесь рядом с {npc:8479}: он делает факел около минуты, потом факел парит рядом с ним; нажмите на него, чтобы сдать задание. Если он исчезнет за это время, задание провалится."
ko = "퀘스트를 받은 뒤 {npc:8479} 곁에 머무르세요. 횃불을 만드는 데 1분쯤 걸리며, 완성된 횃불은 그의 옆에 떠 있습니다. 횃불을 클릭해 퀘스트를 완료하세요. 그사이 그가 사라지면 퀘스트가 실패합니다."
zh_cn = "接任务后留在{npc:8479}身边：他大约需要一分钟制作火炬，做好后火炬会飘在他旁边；点击火炬交任务。如果他在此期间消失，任务就会失败。"
zh_tw = "接任務後留在{npc:8479}身邊：他大約需要一分鐘製作火炬，做好後火炬會飄在他旁邊；點擊火炬交任務。如果他在此期間消失，任務就會失敗。"

# Set Them Ablaze!: the torch must be equipped; each brazier is a tiny object on a tower's top floor, next to an elite guard, and the click counts at once.
[[note]]
quest = 3463
phase = "objective"
level = "warning"
en = "Equip the {item:10515}, then click the small {object:149025} on the top floor of each tower: it is easy to miss on the floor. An elite guard waits up there, but the click counts at once, so you can leave without killing it."
fr = "Équipez {item:10515}, puis cliquez sur le petit {object:149025} au dernier étage de chaque tour : il passe facilement inaperçu au sol. Un garde élite s'y trouve, mais le clic compte aussitôt : vous pouvez repartir sans le tuer."
de = "Rüste {item:10515} aus und klicke im obersten Stock jedes Turms auf {object:149025}: es ist am Boden leicht zu übersehen. Oben wartet eine Elite-Wache, doch der Klick zählt sofort, du kannst also gehen, ohne sie zu töten."
es = "Equípate {item:10515} y haz clic en el pequeño {object:149025} del piso superior de cada torre: es fácil no verlo en el suelo. Arriba espera un guardia élite, pero el clic cuenta al instante, así que puedes irte sin matarlo."
pt = "Equipe {item:10515} e clique no pequeno {object:149025} no último andar de cada torre: é fácil não vê-lo no chão. Um guarda elite fica lá em cima, mas o clique conta na hora, então você pode sair sem matá-lo."
ru = "Возьмите в руки {item:10515} и нажмите на маленький {object:149025} на верхнем этаже каждой башни: его легко не заметить на полу. Наверху ждёт элитный страж, но нажатие засчитывается сразу, так что можно уйти, не убивая его."
ko = "{item:10515}을(를) 장착하고 각 탑 꼭대기 층의 작은 {object:149025}을(를) 클릭하세요. 바닥에 있어 놓치기 쉽습니다. 위에 정예 경비병이 있지만 클릭하는 즉시 인정되니 처치하지 않고 떠나도 됩니다."
zh_cn = "装备{item:10515}，然后点击每座塔顶层的小型{object:149025}：它在地上，很容易漏看。上面有一名精英卫兵，但点击后立即完成，可以不杀它直接离开。"
zh_tw = "裝備{item:10515}，然後點擊每座塔頂層的小型{object:149025}：它在地上，很容易漏看。上面有一名精英衛兵，但點擊後立即完成，可以不殺它直接離開。"
