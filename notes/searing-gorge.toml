de = "Stirbt deine Gruppe, klicke erneut auf {object:148498}, um {npc:8391} und {npc:8400} zurückzurufen: du musst die Quest nicht abbrechen."
es = "Si tu grupo muere, vuelve a hacer clic en {object:148498} para invocar de nuevo a {npc:8391} y {npc:8400}: no hace falta abandonar la misión."
pt = "Se o seu grupo morrer, clique de novo em {object:148498} para chamar {npc:8391} e {npc:8400} de volta: não é preciso abandonar a missão."
ru = "Если группа погибла, снова нажмите на {object:148498}, чтобы вызвать {npc:8391} и {npc:8400}: отменять задание не нужно."
ko = "파티가 전멸하면 {object:148498}을(를) 다시 클릭해 {npc:8391}와(과) {npc:8400}을(를) 다시 불러내세요. 퀘스트를 포기할 필요는 없습니다."
