# Quest notes of Silithus. See notes/README.md for the format.

# Hive in the Tower: the pod gives only goo and spawns ambushers; the quest item drops from an ambusher, and they keep coming while the goo is carried.
[[note]]
quest = 1126
phase = "objective"
objective = 1
level = "warning"
en = "{object:178553} only gives {item:17345} and calls foes ({npc:13301}): {item:17346} drops from them. Kill one and loot it before leaving; more keep coming while the goo is in your bags."
fr = "{object:178553} ne donne que {item:17345} et appelle des ennemis ({npc:13301}) : {item:17346} tombe sur eux. Tuez-en un et fouillez-le avant de partir ; d'autres arrivent tant que la bave est dans vos sacs."
de = "{object:178553} gibt nur {item:17345} und ruft Gegner ({npc:13301}) herbei: {item:17346} droppt bei ihnen. Töte einen und plündere ihn, bevor du gehst; solange der Schleim in deinen Taschen ist, kommen weitere."
es = "{object:178553} solo da {item:17345} y atrae enemigos ({npc:13301}): {item:17346} cae de ellos. Mata a uno y despójalo antes de irte; seguirán llegando mientras lleves la baba en las bolsas."
pt = "{object:178553} só dá {item:17345} e atrai inimigos ({npc:13301}): {item:17346} cai deles. Mate um e saqueie antes de sair; outros continuam vindo enquanto a gosma estiver nas bolsas."
ru = "{object:178553} даёт только {item:17345} и призывает врагов ({npc:13301}): {item:17346} выпадает с них. Убейте одного и обыщите его перед уходом; пока слизь у вас в сумках, будут приходить новые."
ko = "{object:178553}에서는 {item:17345}만 나오고 적({npc:13301})이 나타납니다. {item:17346}은(는) 그들에게서 떨어집니다. 하나를 처치해 전리품을 챙긴 뒤 떠나세요. 점액이 가방에 있는 동안 계속 몰려옵니다."
zh_cn = "{object:178553}只给{item:17345}，还会招来敌人（{npc:13301}）：{item:17346}是从它们身上掉的。杀一只并拾取后再离开；黏液在背包里时会不断有新的过来。"
zh_tw = "{object:178553}只給{item:17345}，還會招來敵人（{npc:13301}）：{item:17346}是從牠們身上掉的。殺一隻並拾取後再離開；黏液在背包裡時會不斷有新的過來。"

# Noggle's Lost Satchel: the satchel sits on Deathclasp's walk and comes back only minutes after being taken.
[[note]]
quest = 8282
phase = "objective"
objective = 1
level = "warning"
en = "{object:180435} lies on the path where elite {npc:15196} and two flayers walk: wait until they head up the hill, grab it and leave. Once taken, it takes several minutes to come back."
fr = "{object:180435} se trouve sur le chemin où passent {npc:15196} (élite) et deux écorcheurs : attendez qu'ils montent la colline, ramassez l'objet et partez. Une fois pris, il met plusieurs minutes à réapparaître."
de = "{object:180435} liegt am Pfad, auf dem {npc:15196} (Elite) und zwei Schinder laufen: Warte, bis sie den Hügel hinaufgehen, schnapp es dir und geh. Danach dauert es einige Minuten, bis es wieder da ist."
es = "{object:180435} está en el sendero por donde pasan {npc:15196} (élite) y dos desolladores: espera a que suban la colina, cógelo y vete. Una vez cogido, tarda varios minutos en volver."
pt = "{object:180435} fica na trilha por onde passam {npc:15196} (elite) e dois esfoladores: espere que subam a colina, pegue-o e saia. Depois de pego, leva vários minutos para voltar."
ru = "{object:180435} лежит на тропе, по которой ходят {npc:15196} (элита) и два живодёра: дождитесь, пока они поднимутся на холм, хватайте предмет и уходите. После этого он появляется снова лишь через несколько минут."
ko = "{object:180435}은(는) 정예 {npc:15196}와(과) 가죽벗기개 둘이 다니는 길 위에 있습니다. 그들이 언덕 위로 올라갈 때까지 기다렸다가 집어 들고 떠나세요. 한 번 가져가면 다시 나타나기까지 몇 분 걸립니다."
zh_cn = "{object:180435}位于精英{npc:15196}和两只剥皮者巡逻的小路上：等它们走上山坡再拿走并离开。被拿走后要过几分钟才会重新出现。"
zh_tw = "{object:180435}位於菁英{npc:15196}和兩隻剝皮者巡邏的小路上：等牠們走上山坡再拿走並離開。被拿走後要過幾分鐘才會重新出現。"

# Scouring the Desert: carrying silithyst flags for PvP and slows; mounting drops it.
[[note]]
quest = 9422
phase = "objective"
objective = 1
level = "warning"
en = "Taking silithyst from a {object:181598} flags you for PvP and slows you. Do not mount on the way back, as that drops it on the ground: walk it to your faction's camp."
fr = "Prendre de la silithyste sur un {object:181598} vous rend JcJ et vous ralentit. Ne montez pas en selle au retour, cela la fait tomber au sol : rapportez-la à pied au camp de votre faction."
de = "Silithyst aus {object:181598} zu nehmen, markiert dich für PvP und verlangsamt dich. Steig auf dem Rückweg nicht auf ein Reittier, sonst fällt es zu Boden: Bring es zu Fuß ins Lager deiner Fraktion."
es = "Tomar silitista de {object:181598} te activa el JcJ y te ralentiza. No montes al volver, eso la deja caer al suelo: llévala a pie al campamento de tu facción."
pt = "Pegar silitista de {object:181598} ativa o JxJ e deixa você lento. Não monte na volta, isso a derruba no chão: leve-a a pé até o acampamento da sua facção."
ru = "Если взять силитист из {object:181598}, вы получите метку PvP и замедление. Не садитесь на ездовое животное на обратном пути, иначе он упадёт на землю: донесите его пешком до лагеря своей фракции."
ko = "{object:181598}에서 실리시스트를 얻으면 PvP가 활성화되고 이동 속도가 느려집니다. 돌아가는 길에 탈것을 타면 땅에 떨어지니, 걸어서 진영 야영지로 가져가세요."
zh_cn = "从{object:181598}获取希利苏斯之尘会让你进入PvP状态并减速。返回途中不要上坐骑，否则它会掉在地上：步行把它带回本阵营的营地。"
zh_tw = "從{object:181598}取得希利蘇斯之塵會讓你進入PvP狀態並減速。返回途中不要騎乘坐騎，否則它會掉在地上：步行把它帶回本陣營的營地。"

