# Quest notes of Stormwind City. See notes/README.md for the format.

# Beat Bartleby: he hits hard for a level 10 duel; after a loss he respawns (about 4.5 minutes) and
# can be challenged again without abandoning.
[[note]]
quest = 1640
phase = "objective"
objective = 1
level = "warning"
en = "{npc:6090} hits hard for his level: fight with a weapon you have skill in, not a new one. If he wins, do not abandon the quest: wait for him to respawn (about 5 minutes) and talk to him again."
fr = "{npc:6090} frappe fort pour son niveau : combattez avec une arme que vous maîtrisez, pas une nouvelle. S'il gagne, n'abandonnez pas la quête : attendez qu'il réapparaisse (environ 5 minutes) et parlez-lui de nouveau."
de = "{npc:6090} schlägt für seine Stufe hart zu: Kämpfe mit einer Waffe, die du beherrschst, nicht mit einer neuen. Gewinnt er, brich die Quest nicht ab: Warte, bis er respawnt (etwa 5 Minuten), und sprich ihn erneut an."
es = "{npc:6090} pega fuerte para su nivel: lucha con un arma que domines, no con una nueva. Si gana, no abandones la misión: espera a que reaparezca (unos 5 minutos) y vuelve a hablar con él."
pt = "{npc:6090} bate forte para o nível dele: lute com uma arma em que você tem perícia, não com uma nova. Se ele vencer, não abandone a missão: espere ele ressurgir (cerca de 5 minutos) e fale com ele de novo."
ru = "{npc:6090} бьет сильно для своего уровня: сражайтесь оружием, которым владеете, а не новым. Если он победит, не отменяйте задание: дождитесь, пока он появится снова (около 5 минут), и поговорите с ним еще раз."
ko = "{npc:6090}은(는) 레벨에 비해 강하게 때립니다. 새 무기 말고 숙련도가 있는 무기로 싸우세요. 지더라도 퀘스트를 포기하지 말고, 다시 나타날 때까지(약 5분) 기다렸다가 다시 말을 거세요."
zh_cn = "{npc:6090}以他的等级来说打得很疼：用你有熟练度的武器战斗，别用新武器。如果输了，不要放弃任务：等他重新出现（约5分钟）后再和他对话。"
zh_tw = "{npc:6090}以他的等級來說打得很痛：用你有熟練度的武器戰鬥，別用新武器。如果輸了，不要放棄任務：等他重新出現（約5分鐘）後再和他對話。"

# Rethban Ore: a regular trade good, cheap at the auction house; in the cave it comes from the drudgers and from the tin and copper veins.
[[note]]
quest = 347
phase = "objective"
objective = 1
level = "info"
en = "{item:2798} is a regular trade good: buying 5 at the auction house saves the farm. In the cave, only {npc:580} carry it, and miners also find it in {object:2054} and {object:2055}."
fr = "{item:2798} est un objet d'artisanat ordinaire : en acheter 5 à l'hôtel des ventes évite de le farmer. Dans la grotte, seuls les {npc:580} en portent, et les mineurs en trouvent aussi dans les {object:2054} et {object:2055}."
de = "{item:2798} ist eine normale Handelsware: 5 Stück im Auktionshaus zu kaufen erspart das Farmen. In der Höhle tragen sie nur {npc:580}, und Bergbauer finden es auch in {object:2054} und {object:2055}."
es = "{item:2798} es un objeto comerciable normal: comprar 5 en la casa de subastas te ahorra farmear. En la cueva solo lo llevan los {npc:580}, y los mineros también lo sacan de {object:2054} y {object:2055}."
pt = "{item:2798} é um item comum de comércio: comprar 5 na casa de leilões poupa o farm. Na caverna, só {npc:580} o carregam, e mineradores também o tiram de {object:2054} e {object:2055}."
ru = "{item:2798} — обычный товар: купив 5 штук на аукционе, вы избавитесь от фарма. В пещере ее носят только {npc:580}, а шахтеры также добывают ее из жил {object:2054} и {object:2055}."
ko = "{item:2798}은(는) 일반 거래 품목이라 경매장에서 5개를 사면 수집할 필요가 없습니다. 동굴에서는 {npc:580}만 지니고 있으며, 채광 기술이 있으면 {object:2054}와(과) {object:2055}에서도 얻을 수 있습니다."
zh_cn = "{item:2798}是普通的交易物品：在拍卖行买5个就不用去刷。洞穴里只有{npc:580}身上有，采矿者还能从{object:2054}和{object:2055}中采到。"
zh_tw = "{item:2798}是普通的交易物品：在拍賣場買5個就不用去刷。洞穴裡只有{npc:580}身上有，採礦者還能從{object:2054}和{object:2055}中採到。"

# A Noble Brew: the Tear of Tilloa is a tiny flower in the fenced garden next to Stalvan Mistmantle's house, and he comes out after players who get close to the house.
[[note]]
quest = 335
phase = "objective"
objective = 1
level = "warning"
en = "The {object:321} is a tiny white flower in the middle of the fenced garden beside the manor north of Darkshire, easy to miss in the grass. Keep away from the house: {npc:315} comes out after players who get close."
fr = "{object:321} est une minuscule fleur blanche au milieu du jardin clôturé à côté du manoir au nord de Sombre-Comté, facile à manquer dans l'herbe. Restez loin de la maison : {npc:315} sort s'en prendre à qui s'approche."
de = "{object:321} ist eine winzige weiße Blume mitten im eingezäunten Garten neben dem Herrenhaus nördlich von Dunkelhain, im Gras leicht zu übersehen. Halte Abstand zum Haus: {npc:315} kommt heraus, wenn man zu nahe kommt."
es = "{object:321} es una diminuta flor blanca en medio del jardín vallado junto a la mansión al norte de Villa Oscura, fácil de pasar por alto entre la hierba. Aléjate de la casa: {npc:315} sale a por quien se acerca."
pt = "{object:321} é uma minúscula flor branca no meio do jardim cercado ao lado da mansão ao norte de Vila Sombria, fácil de perder na grama. Fique longe da casa: {npc:315} sai atrás de quem se aproxima."
ru = "{object:321} — крошечный белый цветок посреди огороженного сада у поместья к северу от Темнолесья, в траве его легко пропустить. Не подходите к дому: {npc:315} выходит к тем, кто приблизится."
ko = "{object:321}은(는) 어둠골 북쪽 저택 옆 울타리 정원 한가운데 있는 아주 작은 흰 꽃으로, 풀 속에서 놓치기 쉽습니다. 집에 다가가지 마세요. 가까이 가면 {npc:315}이(가) 나옵니다."
zh_cn = "{object:321}是一朵很小的白花，位于夜色镇以北庄园旁围栏花园的正中，在草丛里很容易错过。别靠近房子：靠近的玩家会引出{npc:315}。"
zh_tw = "{object:321}是一朵很小的白花，位於夜色鎮以北莊園旁圍欄花園的正中，在草叢裡很容易錯過。別靠近房子：靠近的玩家會引出{npc:315}。"

# The Missing Diplomat (Dashel Stonefist): he yields at low health instead of dying, but his two thugs often keep attacking afterwards; after a lost fight he can be talked to again.
[[note]]
quest = 1447
phase = "objective"
objective = 1
level = "warning"
en = "{npc:4961} gives up at about a quarter of his health, but his thugs ({npc:4969} ×2) often keep attacking for a while after: be ready to finish or outrun them. If you lose, talk to him again to restart the fight."
fr = "{npc:4961} abandonne vers un quart de ses points de vie, mais ses hommes de main ({npc:4969} ×2) continuent souvent d'attaquer un moment : soyez prêt à les achever ou à les semer. En cas d'échec, reparlez-lui pour relancer le combat."
de = "{npc:4961} gibt bei etwa einem Viertel seiner Gesundheit auf, aber seine Schläger ({npc:4969} ×2) greifen oft noch eine Weile an: sei bereit, sie zu erledigen oder abzuhängen. Verlierst du, sprich ihn erneut an, um den Kampf neu zu starten."
es = "{npc:4961} se rinde hacia un cuarto de su salud, pero sus matones ({npc:4969} ×2) suelen seguir atacando un rato: prepárate para acabar con ellos o huir. Si pierdes, vuelve a hablar con él para reiniciar el combate."
pt = "{npc:4961} se rende perto de um quarto da vida, mas seus capangas ({npc:4969} ×2) costumam continuar atacando por um tempo: esteja pronto para acabar com eles ou fugir. Se perder, fale com ele de novo para recomeçar a luta."
ru = "{npc:4961} сдается примерно на четверти здоровья, но его громилы ({npc:4969} ×2) часто еще какое-то время атакуют: будьте готовы добить их или убежать. Если проиграете, поговорите с ним снова, чтобы начать бой заново."
ko = "{npc:4961}은(는) 생명력이 4분의 1쯤 남으면 항복하지만, 부하들({npc:4969} ×2)은 한동안 계속 공격하는 경우가 많습니다. 처치하거나 따돌릴 준비를 하세요. 지면 다시 말을 걸어 전투를 다시 시작하세요."
zh_cn = "{npc:4961}生命值降到约四分之一时会认输，但他的打手（{npc:4969} ×2）常会继续攻击一阵：准备好解决他们或甩掉他们。如果打输了，再和他对话即可重新开始战斗。"
zh_tw = "{npc:4961}生命值降到約四分之一時會認輸，但他的打手（{npc:4969} ×2）常會繼續攻擊一陣：準備好解決他們或甩掉他們。如果打輸了，再和他對話即可重新開始戰鬥。"
