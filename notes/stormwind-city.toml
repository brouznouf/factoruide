# Quest notes of Stormwind City. See notes/README.md for the format.

# Beat Bartleby: he hits hard for a level 10 duel; after a loss he respawns (about 4.5 minutes) and
# can be challenged again without abandoning.
[[note]]
quest = 1640
phase = "objective"
objective = 1
level = "warning"
en = "{npc:6090} hits hard for his level: fight with a weapon you have skill in, not a new one. If he wins, do not abandon the quest: wait for him to respawn (about 5 minutes) and talk to him again."
fr = "{npc:6090} frappe fort pour son niveau : combattez avec une arme que vous maîtrisez, pas une nouvelle. S'il gagne, n'abandonnez pas la quête : attendez qu'il réapparaisse (environ 5 minutes) et parlez-lui de nouveau."
de = "{npc:6090} schlägt für seine Stufe hart zu: Kämpfe mit einer Waffe, die du beherrschst, nicht mit einer neuen. Gewinnt er, brich die Quest nicht ab: Warte, bis er respawnt (etwa 5 Minuten), und sprich ihn erneut an."
es = "{npc:6090} pega fuerte para su nivel: lucha con un arma que domines, no con una nueva. Si gana, no abandones la misión: espera a que reaparezca (unos 5 minutos) y vuelve a hablar con él."
pt = "{npc:6090} bate forte para o nível dele: lute com uma arma em que você tem perícia, não com uma nova. Se ele vencer, não abandone a missão: espere ele ressurgir (cerca de 5 minutos) e fale com ele de novo."
ru = "{npc:6090} бьет сильно для своего уровня: сражайтесь оружием, которым владеете, а не новым. Если он победит, не отменяйте задание: дождитесь, пока он появится снова (около 5 минут), и поговорите с ним еще раз."
ko = "{npc:6090}은(는) 레벨에 비해 강하게 때립니다. 새 무기 말고 숙련도가 있는 무기로 싸우세요. 지더라도 퀘스트를 포기하지 말고, 다시 나타날 때까지(약 5분) 기다렸다가 다시 말을 거세요."
zh_cn = "{npc:6090}以他的等级来说打得很疼：用你有熟练度的武器战斗，别用新武器。如果输了，不要放弃任务：等他重新出现（约5分钟）后再和他对话。"
zh_tw = "{npc:6090}以他的等級來說打得很痛：用你有熟練度的武器戰鬥，別用新武器。如果輸了，不要放棄任務：等他重新出現（約5分鐘）後再和他對話。"

# Rethban Ore: a regular trade good, cheap at the auction house; in the cave it comes from the drudgers and from the tin and copper veins.
[[note]]
quest = 347
phase = "objective"
objective = 1
level = "info"
en = "{item:2798} is a regular trade good: buying 5 at the auction house saves the farm. In the cave, only {npc:580} carry it, and miners also find it in {object:2054} and {object:2055}."
fr = "{item:2798} est un objet d'artisanat ordinaire : en acheter 5 à l'hôtel des ventes évite de le farmer. Dans la grotte, seuls les {npc:580} en portent, et les mineurs en trouvent aussi dans les {object:2054} et {object:2055}."
de = "{item:2798} ist eine normale Handelsware: 5 Stück im Auktionshaus zu kaufen erspart das Farmen. In der Höhle tragen sie nur {npc:580}, und Bergbauer finden es auch in {object:2054} und {object:2055}."
es = "{item:2798} es un objeto comerciable normal: comprar 5 en la casa de subastas te ahorra farmear. En la cueva solo lo llevan los {npc:580}, y los mineros también lo sacan de {object:2054} y {object:2055}."
pt = "{item:2798} é um item comum de comércio: comprar 5 na casa de leilões poupa o farm. Na caverna, só {npc:580} o carregam, e mineradores também o tiram de {object:2054} e {object:2055}."
ru = "{item:2798} — обычный товар: купив 5 штук на аукционе, вы избавитесь от фарма. В пещере ее носят только {npc:580}, а шахтеры также добывают ее из жил {object:2054} и {object:2055}."
ko = "{item:2798}은(는) 일반 거래 품목이라 경매장에서 5개를 사면 수집할 필요가 없습니다. 동굴에서는 {npc:580}만 지니고 있으며, 채광 기술이 있으면 {object:2054}와(과) {object:2055}에서도 얻을 수 있습니다."
zh_cn = "{item:2798}是普通的交易物品：在拍卖行买5个就不用去刷。洞穴里只有{npc:580}身上有，采矿者还能从{object:2054}和{object:2055}中采到。"
zh_tw = "{item:2798}是普通的交易物品：在拍賣場買5個就不用去刷。洞穴裡只有{npc:580}身上有，採礦者還能從{object:2054}和{object:2055}中採到。"

# A Noble Brew: the Tear of Tilloa is a tiny flower in the fenced garden next to Stalvan Mistmantle's house, and he comes out after players who get close to the house.
[[note]]
quest = 335
phase = "objective"
objective = 1
level = "warning"
en = "The {object:321} is a tiny white flower in the middle of the fenced garden beside the manor north of Darkshire, easy to miss in the grass. Keep away from the house: {npc:315} comes out after players who get close."
fr = "{object:321} est une minuscule fleur blanche au milieu du jardin clôturé à côté du manoir au nord de Sombre-Comté, facile à manquer dans l'herbe. Restez loin de la maison : {npc:315} sort s'en prendre à qui s'approche."
de = "{object:321} ist eine winzige weiße Blume mitten im eingezäunten Garten neben dem Herrenhaus nördlich von Dunkelhain, im Gras leicht zu übersehen. Halte Abstand zum Haus: {npc:315} kommt heraus, wenn man zu nahe kommt."
es = "{object:321} es una diminuta flor blanca en medio del jardín vallado junto a la mansión al norte de Villa Oscura, fácil de pasar por alto entre la hierba. Aléjate de la casa: {npc:315} sale a por quien se acerca."
pt = "{object:321} é uma minúscula flor branca no meio do jardim cercado ao lado da mansão ao norte de Vila Sombria, fácil de perder na grama. Fique longe da casa: {npc:315} sai atrás de quem se aproxima."
ru = "{object:321} — крошечный белый цветок посреди огороженного сада у поместья к северу от Темнолесья, в траве его легко пропустить. Не подходите к дому: {npc:315} выходит к тем, кто приблизится."
ko = "{object:321}은(는) 어둠골 북쪽 저택 옆 울타리 정원 한가운데 있는 아주 작은 흰 꽃으로, 풀 속에서 놓치기 쉽습니다. 집에 다가가지 마세요. 가까이 가면 {npc:315}이(가) 나옵니다."
zh_cn = "{object:321}是一朵很小的白花，位于夜色镇以北庄园旁围栏花园的正中，在草丛里很容易错过。别靠近房子：靠近的玩家会引出{npc:315}。"
zh_tw = "{object:321}是一朵很小的白花，位於夜色鎮以北莊園旁圍欄花園的正中，在草叢裡很容易錯過。別靠近房子：靠近的玩家會引出{npc:315}。"

# The Missing Diplomat (Dashel Stonefist): he yields at low health instead of dying, but his two thugs often keep attacking afterwards; after a lost fight he can be talked to again.
[[note]]
quest = 1447
phase = "objective"
objective = 1
level = "warning"
en = "{npc:4961} gives up at about a quarter of his health, but his thugs ({npc:4969} ×2) often keep attacking for a while after: be ready to finish or outrun them. If you lose, talk to him again to restart the fight."
fr = "{npc:4961} abandonne vers un quart de ses points de vie, mais ses hommes de main ({npc:4969} ×2) continuent souvent d'attaquer un moment : soyez prêt à les achever ou à les semer. En cas d'échec, reparlez-lui pour relancer le combat."
de = "{npc:4961} gibt bei etwa einem Viertel seiner Gesundheit auf, aber seine Schläger ({npc:4969} ×2) greifen oft noch eine Weile an: sei bereit, sie zu erledigen oder abzuhängen. Verlierst du, sprich ihn erneut an, um den Kampf neu zu starten."
es = "{npc:4961} se rinde hacia un cuarto de su salud, pero sus matones ({npc:4969} ×2) suelen seguir atacando un rato: prepárate para acabar con ellos o huir. Si pierdes, vuelve a hablar con él para reiniciar el combate."
pt = "{npc:4961} se rende perto de um quarto da vida, mas seus capangas ({npc:4969} ×2) costumam continuar atacando por um tempo: esteja pronto para acabar com eles ou fugir. Se perder, fale com ele de novo para recomeçar a luta."
ru = "{npc:4961} сдается примерно на четверти здоровья, но его громилы ({npc:4969} ×2) часто еще какое-то время атакуют: будьте готовы добить их или убежать. Если проиграете, поговорите с ним снова, чтобы начать бой заново."
ko = "{npc:4961}은(는) 생명력이 4분의 1쯤 남으면 항복하지만, 부하들({npc:4969} ×2)은 한동안 계속 공격하는 경우가 많습니다. 처치하거나 따돌릴 준비를 하세요. 지면 다시 말을 걸어 전투를 다시 시작하세요."
zh_cn = "{npc:4961}生命值降到约四分之一时会认输，但他的打手（{npc:4969} ×2）常会继续攻击一阵：准备好解决他们或甩掉他们。如果打输了，再和他对话即可重新开始战斗。"
zh_tw = "{npc:4961}生命值降到約四分之一時會認輸，但他的打手（{npc:4969} ×2）常會繼續攻擊一陣：準備好解決他們或甩掉他們。如果打輸了，再和他對話即可重新開始戰鬥。"

# The Missing Diplomat (Slim): he slips out of the inn once the fight starts; a stun, sheep or fear as he turns hostile keeps his bodyguard away; he yields at about a third of his health.
[[note]]
quest = 1249
phase = "objective"
objective = 1
level = "warning"
en = "Follow {npc:4962} out of the inn at once. Stun, sheep or fear him as soon as he turns hostile and his bodyguard does not show up. Focus on him only: he gives up at about a third of his health."
fr = "Suivez {npc:4962} hors de l'auberge sans attendre. Étourdissez-le, métamorphosez-le ou apeurez-le dès qu'il devient hostile et son garde du corps ne vient pas. Ne frappez que lui : il abandonne vers un tiers de sa vie."
de = "Folge {npc:4962} sofort aus dem Gasthaus. Betäube, verwandle oder fürchte ihn, sobald er feindlich wird, dann taucht sein Leibwächter nicht auf. Greif nur ihn an: Er gibt bei etwa einem Drittel seiner Gesundheit auf."
es = "Sigue a {npc:4962} fuera de la posada enseguida. Atúrdelo, polimorfízalo o atemorízalo en cuanto se vuelva hostil y su guardaespaldas no aparecerá. Céntrate solo en él: se rinde hacia un tercio de su salud."
pt = "Siga {npc:4962} para fora da estalagem na hora. Atordoe, transforme ou amedronte-o assim que ele ficar hostil e o guarda-costas dele não aparece. Foque só nele: ele desiste com cerca de um terço da vida."
ru = "Сразу идите за {npc:4962} из таверны. Оглушите, превратите или напугайте его, как только он станет враждебным, и его телохранитель не появится. Бейте только его: он сдаётся примерно на трети здоровья."
ko = "곧바로 {npc:4962}을(를) 따라 여관 밖으로 나가세요. 적대적으로 바뀌는 즉시 기절, 변이, 공포를 걸면 경호원이 나타나지 않습니다. 그만 공격하세요. 생명력이 약 3분의 1이 되면 항복합니다."
zh_cn = "立刻跟着{npc:4962}走出旅店。他一变为敌对就击晕、变形或恐惧他，他的保镖就不会出现。只打他：他的生命值降到约三分之一时就会投降。"
zh_tw = "立刻跟著{npc:4962}走出旅店。他一變為敵對就擊暈、變形或恐懼他，他的保鏢就不會出現。只打他：他的生命值降到約三分之一時就會投降。"

# The Missing Diplomat (Sentry Point): entering the tower completes the search and Archmage Tervosh appears there to take it; when he does not, stepping out and back in or waiting a few minutes brings him.
[[note]]
quest = 1265
phase = "turnin"
level = "warning"
en = "Walk into the lower floor of the tower: the search completes and {npc:4967} appears there to take the quest. If he does not, step out and back in, or wait a few minutes: another player may be on the next part."
fr = "Entrez au rez-de-chaussée de la tour : la fouille se termine et {npc:4967} y apparaît pour prendre la quête. S'il ne vient pas, sortez et revenez, ou attendez quelques minutes : un autre joueur fait peut-être la suite."
de = "Geh ins Erdgeschoss des Turms: Die Suche ist abgeschlossen und {npc:4967} erscheint dort, um die Quest anzunehmen. Kommt er nicht, geh hinaus und wieder hinein oder warte ein paar Minuten: Vielleicht macht ein anderer Spieler gerade den nächsten Teil."
es = "Entra en la planta baja de la torre: la búsqueda se completa y {npc:4967} aparece allí para recibir la misión. Si no aparece, sal y vuelve a entrar, o espera unos minutos: puede que otro jugador esté con la parte siguiente."
pt = "Entre no térreo da torre: a busca é concluída e {npc:4967} aparece ali para receber a missão. Se ele não vier, saia e entre de novo, ou espere alguns minutos: outro jogador pode estar na parte seguinte."
ru = "Зайдите на нижний этаж башни: поиск завершится, и там появится {npc:4967}, чтобы принять задание. Если его нет, выйдите и зайдите снова или подождите несколько минут: возможно, другой игрок выполняет следующую часть."
ko = "탑의 아래층으로 들어가면 수색이 완료되고 {npc:4967}이(가) 그곳에 나타나 퀘스트를 받습니다. 나타나지 않으면 밖으로 나갔다가 다시 들어오거나 몇 분 기다리세요. 다른 플레이어가 다음 단계를 진행 중일 수 있습니다."
zh_cn = "走进塔的底层：搜查完成，{npc:4967}会出现在那里接收任务。如果他没出现，出去再进来，或等几分钟：可能有其他玩家正在做下一步。"
zh_tw = "走進塔的底層：搜查完成，{npc:4967}會出現在那裡接收任務。如果他沒出現，出去再進來，或等幾分鐘：可能有其他玩家正在做下一步。"

# A Meal Served Cold: a failed timed quest can be taken again without abandoning, which would delete the haunch; another timed quest blocks it.
[[note]]
quest = 212
level = "warning"
en = "If the 30-minute timer runs out while you hold {item:2476}, do not abandon the quest, or the haunch vanishes: take it again from {npc:1141} and hand it in at once. Another timed quest in your log keeps you from taking this one."
fr = "Si le délai de 30 minutes expire alors que vous avez {item:2476}, n'abandonnez pas la quête, sinon le cuissot disparaît : reprenez-la auprès de {npc:1141} et rendez-la aussitôt. Une autre quête à durée limitée dans votre journal vous empêche de prendre celle-ci."
de = "Läuft der 30-Minuten-Timer ab, während du {item:2476} hast, brich die Quest nicht ab, sonst verschwindet die Keule: Nimm sie erneut bei {npc:1141} an und gib sie sofort ab. Eine andere zeitlich begrenzte Quest im Log verhindert, dass du diese annimmst."
es = "Si el temporizador de 30 minutos se agota mientras tienes {item:2476}, no abandones la misión o el muslo desaparecerá: vuelve a aceptarla de {npc:1141} y entrégala enseguida. Otra misión con tiempo límite en tu registro te impide aceptar esta."
pt = "Se o cronômetro de 30 minutos acabar enquanto você tem {item:2476}, não abandone a missão, ou o pernil some: aceite-a de novo com {npc:1141} e entregue na hora. Outra missão com tempo limite no registro impede você de aceitar esta."
ru = "Если 30-минутный таймер истёк, а у вас есть {item:2476}, не отказывайтесь от задания, иначе окорок исчезнет: возьмите его снова у персонажа {npc:1141} и сразу сдайте. Другое задание с ограничением времени в журнале не даёт взять это."
ko = "{item:2476}을(를) 가진 채 30분 제한 시간이 끝나도 퀘스트를 포기하지 마세요. 포기하면 넓적다리가 사라집니다. {npc:1141}에게서 다시 받아 바로 완료하세요. 시간 제한 퀘스트가 이미 목록에 있으면 이 퀘스트를 받을 수 없습니다."
zh_cn = "如果30分钟计时结束时你还持有{item:2476}，不要放弃任务，否则腿肉会消失：从{npc:1141}那里重新接取任务并立即交付。任务日志中有其他限时任务时无法接取此任务。"
zh_tw = "如果30分鐘計時結束時你還持有{item:2476}，不要放棄任務，否則腿肉會消失：從{npc:1141}那裡重新接取任務並立即交付。任務日誌中有其他限時任務時無法接取此任務。"

# The Perenolde Tiara: Grel'borg walks from the basement of the large building in the Ruins of Alterac out to the street and back, and looks like the other ogre mages.
[[note]]
quest = 543
phase = "objective"
objective = 1
level = "warning"
en = "{npc:2417} walks from the basement of the large ruined building out to the street and back, and looks like the other ogre mages: target him by name. Waiting for him outside the building is easiest."
fr = "{npc:2417} va du sous-sol du grand bâtiment en ruine jusqu'à la rue, puis revient, et ressemble aux autres ogres mages : ciblez-le par son nom. Le plus simple est de l'attendre devant le bâtiment."
de = "{npc:2417} läuft vom Keller des großen zerstörten Gebäudes hinaus auf die Straße und zurück und sieht aus wie die anderen Ogermagier: Ziele ihn über seinen Namen an. Am einfachsten wartest du vor dem Gebäude auf ihn."
es = "{npc:2417} va del sótano del gran edificio en ruinas hasta la calle y vuelve, y se parece a los demás magos ogros: selecciónalo por su nombre. Lo más fácil es esperarlo fuera del edificio."
pt = "{npc:2417} anda do porão do grande prédio em ruínas até a rua e volta, e é igual aos outros magos ogros: selecione-o pelo nome. O mais fácil é esperá-lo do lado de fora do prédio."
ru = "{npc:2417} ходит из подвала большого разрушенного здания на улицу и обратно и выглядит как другие огры-маги: выбирайте его по имени. Проще всего ждать его снаружи здания."
ko = "{npc:2417}은(는) 큰 폐허 건물의 지하에서 거리까지 오갔다 돌아가며, 다른 오우거 마법사와 똑같이 생겼습니다. 이름으로 대상을 지정하세요. 건물 밖에서 기다리는 것이 가장 쉽습니다."
zh_cn = "{npc:2417}会从那座大废墟建筑的地下室走到街上再走回去，长得和其他食人魔法师一样：按名字选中他。最省事的是在建筑外面等他。"
zh_tw = "{npc:2417}會從那座大廢墟建築的地下室走到街上再走回去，長得和其他食人魔法師一樣：按名字選取他。最省事的是在建築外面等他。"

# Philmor's Favor (Forever): the stockroom entrance is the locked door upstairs in the cheese shop,
# where the shipment is used from the bags.
[[note]]
quest = 97220
level = "info"
editions = ["forever"]
en = "The stockroom entrance is the locked door upstairs in Trias' cheese shop: use the shipment from your bags in front of it, then go back down to {npc:483}."
fr = "L'entrée de la réserve est la porte verrouillée à l'étage de la fromagerie de Trias : utilisez la cargaison depuis vos sacs devant elle, puis redescendez voir {npc:483}."
de = "Der Lagereingang ist die verschlossene Tür im Obergeschoss von Trias' Käseladen: Benutze die Lieferung aus deinen Taschen davor und geh dann wieder hinunter zu {npc:483}."
es = "La entrada del almacén es la puerta cerrada del piso de arriba de la quesería de Trias: usa el cargamento desde tus bolsas delante de ella y luego baja de nuevo con {npc:483}."
pt = "A entrada do depósito é a porta trancada no andar de cima da queijaria de Trias: use o carregamento das suas bolsas diante dela e depois desça de novo até {npc:483}."
ru = "Вход в кладовую — запертая дверь наверху сырной лавки Триас: используйте груз из сумок перед ней, затем спуститесь обратно к персонажу {npc:483}."
ko = "창고 입구는 트라이어스 치즈 가게 위층의 잠긴 문입니다. 그 앞에서 가방의 화물을 사용한 뒤 다시 내려가 {npc:483}에게 가세요."
zh_cn = "储藏室入口是特莉亚斯奶酪店楼上那扇锁着的门：在门前使用背包里的货物，然后下楼回到{npc:483}那里。"
zh_tw = "儲藏室入口是特莉亞斯乳酪店樓上那扇鎖著的門：在門前使用背包裡的貨物，然後下樓回到{npc:483}那裡。"

# Gatehouse Goods: the shipment is placed upstairs inside the shop, by a locked door that never needs opening.
[[note]]
quest = 97222
phase = "objective"
objective = 1
level = "info"
editions = ["forever"]
en = "Climb the stairs inside the shop and use the shipment from your bags right by the locked door at the top. The door stays shut: no key or lockpicking needed."
fr = "Montez l'escalier dans la boutique et utilisez la cargaison depuis vos sacs juste à côté de la porte verrouillée en haut. La porte reste fermée : ni clé ni crochetage nécessaires."
de = "Steig die Treppe im Laden hinauf und benutze die Lieferung aus deinen Taschen direkt neben der verschlossenen Tür oben. Die Tür bleibt zu: kein Schlüssel und kein Schlossknacken nötig."
es = "Sube las escaleras dentro de la tienda y usa el cargamento desde tus bolsas justo al lado de la puerta cerrada de arriba. La puerta sigue cerrada: no hace falta llave ni forzar la cerradura."
pt = "Suba a escada dentro da loja e use a remessa das suas bolsas bem ao lado da porta trancada no alto. A porta continua fechada: não precisa de chave nem de arrombar."
ru = "Поднимитесь по лестнице в лавке и используйте груз из сумок прямо у запертой двери наверху. Дверь остается закрытой: ни ключ, ни взлом замка не нужны."
ko = "가게 안의 계단을 올라가 위층의 잠긴 문 바로 옆에서 가방 속 화물을 사용하세요. 문은 닫힌 채로 두면 되며, 열쇠나 자물쇠 따기는 필요 없습니다."
zh_cn = "走上店内的楼梯，在顶上那扇上锁的门旁边使用背包里的货物。门不会打开：不需要钥匙，也不用开锁。"
zh_tw = "走上店內的樓梯，在頂上那扇上鎖的門旁邊使用背包裡的貨物。門不會打開：不需要鑰匙，也不用開鎖。"
