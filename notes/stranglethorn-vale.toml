# The Vile Reef: of the two tablet slabs, the one on the outer side of the wall can be looted without pulling the elite murlocs.
[[note]]
quest = 629
phase = "objective"
objective = 1
level = "info"
en = "Two stone slabs against the ruined wall hold the {item:4094}. Loot the one on the outer, north side (about 24.8, 22.9): the other faces the glowing altar among elite murlocs."
fr = "Deux dalles de pierre contre le mur en ruine portent l'{item:4094}. Prenez celle du côté extérieur nord (environ 24,8, 22,9) : l'autre fait face à l'autel lumineux, parmi des murlocs élites."
de = "Zwei Steinplatten an der zerfallenen Mauer tragen den {item:4094}. Plündere die auf der äußeren Nordseite (etwa 24,8, 22,9): Die andere liegt zum leuchtenden Altar hin zwischen Elite-Murlocs."
es = "Dos losas de piedra contra el muro en ruinas tienen la {item:4094}. Saquea la del lado exterior norte (unos 24,8, 22,9): la otra da al altar brillante, entre múrlocs élite."
pt = "Duas lajes de pedra junto ao muro em ruínas guardam o {item:4094}. Saqueie a do lado externo norte (cerca de 24,8, 22,9): a outra fica voltada ao altar brilhante, entre murlocs de elite."
ru = "«{item:4094}» лежит на двух каменных плитах у разрушенной стены. Берите с той, что на внешней северной стороне (около 24.8, 22.9): другая обращена к светящемуся алтарю, среди элитных мурлоков."
ko = "무너진 벽에 기댄 석판 두 개에 {item:4094}이(가) 있습니다. 바깥쪽 북면(약 24.8, 22.9)의 것을 가져가세요. 다른 하나는 빛나는 제단 쪽 정예 멀록들 사이에 있습니다."
zh_cn = "倒塌墙边的两块石板上都有{item:4094}。拿外侧北面那块（约24.8, 22.9）：另一块朝向发光祭坛，周围都是精英鱼人。"
zh_tw = "倒塌牆邊的兩塊石板上都有{item:4094}。拿外側北面那塊（約24.8, 22.9）：另一塊朝向發光祭壇，周圍都是精英魚人。"

# Bloodscalp Clan Heads: Gan'zulah appears only after the witch doctors at his throne are killed, and respawns slowly.
[[note]]
quest = 584
phase = "objective"
objective = 1
level = "warning"
en = "{npc:1061} only shows up at his throne once the guards around it ({npc:660} ×2) are dead, and he respawns slowly. If he is missing, clear the courtyard and wait."
fr = "{npc:1061} n'apparaît à son trône qu'une fois ses gardes ({npc:660} ×2) tués, et il réapparaît lentement. S'il est absent, nettoyez la cour et attendez."
de = "{npc:1061} erscheint an seinem Thron erst, wenn seine Wachen ({npc:660} ×2) tot sind, und er respawnt langsam. Fehlt er, räum den Hof und warte."
es = "{npc:1061} solo aparece en su trono cuando sus guardias ({npc:660} ×2) han muerto, y reaparece despacio. Si no está, limpia el patio y espera."
pt = "{npc:1061} só aparece no trono depois que os guardas ao redor ({npc:660} ×2) morrem, e ele renasce devagar. Se não estiver lá, limpe o pátio e espere."
ru = "{npc:1061} появляется у трона, только когда убиты его стражи ({npc:660} ×2), и возрождается медленно. Если его нет, зачистите двор и ждите."
ko = "{npc:1061}은(는) 왕좌 주변의 경비병({npc:660} ×2)이 죽어야 나타나며 재생성이 느립니다. 보이지 않으면 안뜰을 정리하고 기다리세요."
zh_cn = "{npc:1061}只有在王座周围的守卫（{npc:660} ×2）死后才会出现，且重生很慢。如果他不在，清理庭院后等待。"
zh_tw = "{npc:1061}只有在王座周圍的守衛（{npc:660} ×2）死後才會出現，且重生很慢。如果他不在，清理庭院後等待。"
