de = "{object:2553} liegt im seichten Wasser unter der Brücke in {zone:8}, auf der Nordseite des mittleren Pfeilers. Sie ist schwer zu sehen: fahr mit dem Mauszeiger über das Wasser."
es = "{object:2553} está en el agua poco profunda bajo el puente de {zone:8}, en el lado norte del pilar central. Cuesta verlo: pasa el cursor por el agua."
pt = "{object:2553} fica na água rasa sob a ponte de {zone:8}, no lado norte do pilar central. É difícil de ver: passe o cursor sobre a água."
ru = "{object:2553} лежит на мелководье под мостом ({zone:8}), с северной стороны центральной опоры. Его трудно заметить: водите курсором по воде."
