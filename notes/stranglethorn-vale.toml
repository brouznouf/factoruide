# The Vile Reef: of the two tablet slabs, the one on the outer side of the wall can be looted without pulling the elite murlocs.
[[note]]
quest = 629
phase = "objective"
objective = 1
level = "info"
en = "Two stone slabs against the ruined wall hold the {item:4094}. Loot the one on the outer, north side (about 24.8, 22.9): the other faces the glowing altar among elite murlocs."
fr = "Deux dalles de pierre contre le mur en ruine portent l'{item:4094}. Prenez celle du côté extérieur nord (environ 24,8, 22,9) : l'autre fait face à l'autel lumineux, parmi des murlocs élites."
de = "Zwei Steinplatten an der zerfallenen Mauer tragen den {item:4094}. Plündere die auf der äußeren Nordseite (etwa 24,8, 22,9): Die andere liegt zum leuchtenden Altar hin zwischen Elite-Murlocs."
es = "Dos losas de piedra contra el muro en ruinas tienen la {item:4094}. Saquea la del lado exterior norte (unos 24,8, 22,9): la otra da al altar brillante, entre múrlocs élite."
pt = "Duas lajes de pedra junto ao muro em ruínas guardam o {item:4094}. Saqueie a do lado externo norte (cerca de 24,8, 22,9): a outra fica voltada ao altar brilhante, entre murlocs de elite."
ru = "«{item:4094}» лежит на двух каменных плитах у разрушенной стены. Берите с той, что на внешней северной стороне (около 24.8, 22.9): другая обращена к светящемуся алтарю, среди элитных мурлоков."
ko = "무너진 벽에 기댄 석판 두 개에 {item:4094}이(가) 있습니다. 바깥쪽 북면(약 24.8, 22.9)의 것을 가져가세요. 다른 하나는 빛나는 제단 쪽 정예 멀록들 사이에 있습니다."
zh_cn = "倒塌墙边的两块石板上都有{item:4094}。拿外侧北面那块（约24.8, 22.9）：另一块朝向发光祭坛，周围都是精英鱼人。"
zh_tw = "倒塌牆邊的兩塊石板上都有{item:4094}。拿外側北面那塊（約24.8, 22.9）：另一塊朝向發光祭壇，周圍都是精英魚人。"

# Bloodscalp Clan Heads: Gan'zulah appears only after the witch doctors at his throne are killed, and respawns slowly.
[[note]]
quest = 584
phase = "objective"
objective = 1
level = "warning"
en = "{npc:1061} only shows up at his throne once the guards around it ({npc:660} ×2) are dead, and he respawns slowly. If he is missing, clear the courtyard and wait."
fr = "{npc:1061} n'apparaît à son trône qu'une fois ses gardes ({npc:660} ×2) tués, et il réapparaît lentement. S'il est absent, nettoyez la cour et attendez."
de = "{npc:1061} erscheint an seinem Thron erst, wenn seine Wachen ({npc:660} ×2) tot sind, und er respawnt langsam. Fehlt er, räum den Hof und warte."
es = "{npc:1061} solo aparece en su trono cuando sus guardias ({npc:660} ×2) han muerto, y reaparece despacio. Si no está, limpia el patio y espera."
pt = "{npc:1061} só aparece no trono depois que os guardas ao redor ({npc:660} ×2) morrem, e ele renasce devagar. Se não estiver lá, limpe o pátio e espere."
ru = "{npc:1061} появляется у трона, только когда убиты его стражи ({npc:660} ×2), и возрождается медленно. Если его нет, зачистите двор и ждите."
ko = "{npc:1061}은(는) 왕좌 주변의 경비병({npc:660} ×2)이 죽어야 나타나며 재생성이 느립니다. 보이지 않으면 안뜰을 정리하고 기다리세요."
zh_cn = "{npc:1061}只有在王座周围的守卫（{npc:660} ×2）死后才会出现，且重生很慢。如果他不在，清理庭院后等待。"
zh_tw = "{npc:1061}只有在王座周圍的守衛（{npc:660} ×2）死後才會出現，且重生很慢。如果他不在，清理庭院後等待。"

# The Bloodsail Buccaneers: the charts and the orders each spawn at one of three spots on the beach camps; a looted one respawns elsewhere.
[[note]]
quest = 604
phase = "objective"
level = "info"
en = "{item:3920} and {item:3921} each lie at one of three spots: the tent of the small camp, the rowboat on the beach, or the crates of the big camp full of warlocks. Check the boat and the small tent first; a looted document comes back at another spot."
fr = "{item:3920} et {item:3921} se trouvent chacun à l'un de trois endroits : la tente du petit camp, la barque sur la plage ou les caisses du grand camp plein de démonistes. Vérifiez d'abord la barque et la petite tente ; un document ramassé réapparaît ailleurs."
de = "{item:3920} und {item:3921} liegen jeweils an einer von drei Stellen: im Zelt des kleinen Lagers, im Ruderboot am Strand oder auf den Kisten des großen Lagers voller Hexenmeister. Sieh zuerst im Boot und im kleinen Zelt nach; ein aufgehobenes Dokument erscheint woanders wieder."
es = "{item:3920} y {item:3921} están cada uno en uno de tres sitios: la tienda del campamento pequeño, el bote de la playa o las cajas del campamento grande lleno de brujos. Mira primero el bote y la tienda pequeña; un documento recogido reaparece en otro sitio."
pt = "{item:3920} e {item:3921} ficam cada um em um de três lugares: a tenda do acampamento pequeno, o bote na praia ou os caixotes do acampamento grande cheio de bruxos. Olhe primeiro o bote e a tenda pequena; um documento pego reaparece em outro lugar."
ru = "{item:3920} и {item:3921} лежат каждый в одном из трёх мест: в палатке малого лагеря, в лодке на пляже или на ящиках большого лагеря, полного чернокнижников. Сначала проверьте лодку и малую палатку; поднятый документ появляется в другом месте."
ko = "{item:3920}와 {item:3921}는 각각 세 곳 중 한 곳에 있습니다: 작은 야영지의 천막, 해변의 보트, 흑마법사가 가득한 큰 야영지의 상자. 먼저 보트와 작은 천막을 확인하세요. 누가 집어 간 문서는 다른 곳에 다시 나타납니다."
zh_cn = "{item:3920}和{item:3921}各在三个地点之一：小营地的帐篷、海滩上的小船，或满是术士的大营地的箱子上。先查看小船和小帐篷；被拾取的文件会在另一处重新出现。"
zh_tw = "{item:3920}和{item:3921}各在三個地點之一：小營地的帳篷、海灘上的小船，或滿是術士的大營地的箱子上。先查看小船和小帳篷；被拾取的文件會在另一處重新出現。"

# Stranglethorn Fever: Mokk comes with the third wave summoned by Unbagwa; the witch doctor must survive the first two, and a new try costs ten more fangs (Classic numbers; the waves are smaller in TBC).
[[note]]
quest = 348
phase = "objective"
objective = 1
level = "warning"
editions = ["classic", "forever"]
en = "{npc:1514} only comes with the third wave of gorillas that {npc:1449} summons: keep the witch doctor alive through the first two waves; after that, looting Mokk is all that counts. If the witch doctor dies early, ten more {item:2799} are needed."
fr = "{npc:1514} n'arrive qu'avec la troisième vague de gorilles invoquée par {npc:1449} : gardez le sorcier-docteur en vie pendant les deux premières ; ensuite, seul compte le butin de Mokk. Si le sorcier-docteur meurt trop tôt, il faut dix {item:2799} de plus."
de = "{npc:1514} kommt erst mit der dritten Gorillawelle, die {npc:1449} beschwört: halte den Hexendoktor die ersten beiden Wellen am Leben; danach zählt nur, Mokk zu plündern. Stirbt der Hexendoktor zu früh, brauchst du zehn weitere {item:2799}."
es = "{npc:1514} solo llega con la tercera oleada de gorilas que invoca {npc:1449}: mantén vivo al médico brujo durante las dos primeras; después solo importa saquear a Mokk. Si el médico brujo muere antes, necesitarás diez {item:2799} más."
pt = "{npc:1514} só chega com a terceira onda de gorilas que {npc:1449} invoca: mantenha o mandingueiro vivo nas duas primeiras; depois, só importa saquear Mokk. Se o mandingueiro morrer antes, serão precisos mais dez {item:2799}."
ru = "{npc:1514} появляется только с третьей волной горилл, которых призывает {npc:1449}: сохраните знахарю жизнь в первых двух волнах; дальше важно лишь обыскать Мокка. Если знахарь погибнет раньше, понадобится ещё десять {item:2799}."
ko = "{npc:1514}는 {npc:1449}가 부르는 고릴라의 세 번째 무리와 함께 나타납니다. 처음 두 무리 동안 주술사를 살려 두세요. 그 뒤로는 모크의 전리품만 챙기면 됩니다. 주술사가 일찍 죽으면 {item:2799} 10개가 더 필요합니다."
zh_cn = "{npc:1514}只在{npc:1449}召来的第三波猩猩中出现：前两波要保住巫医；之后只要拾取莫克就行。巫医若提前死亡，需要再交十个{item:2799}。"
zh_tw = "{npc:1514}只在{npc:1449}召來的第三波猩猩中出現：前兩波要保住巫醫；之後只要拾取莫克就行。巫醫若提前死亡，需要再交十個{item:2799}。"

