# Excelsior: the elder crocolisk shares spawn points with the ordinary saltwater crocolisks on the coast.
[[note]]
quest = 628
phase = "objective"
objective = 1
level = "info"
en = "The {npc:2635} spawns in place of an ordinary {npc:1151} along the coast north of the Horde camp. If none is up, kill the ordinary ones on the beach until it appears."
fr = "L'{npc:2635} apparaît à la place d'un {npc:1151} ordinaire sur la côte au nord du camp de la Horde. S'il n'y en a aucun, tuez les crocilisques ordinaires de la plage jusqu'à ce qu'il apparaisse."
de = "Der {npc:2635} erscheint anstelle eines gewöhnlichen {npc:1151} an der Küste nördlich des Hordenlagers. Ist keiner da, töte die gewöhnlichen am Strand, bis er auftaucht."
es = "El {npc:2635} aparece en lugar de un {npc:1151} común en la costa al norte del campamento de la Horda. Si no hay ninguno, mata a los comunes de la playa hasta que salga."
pt = "O {npc:2635} surge no lugar de um {npc:1151} comum na costa ao norte do acampamento da Horda. Se não houver nenhum, mate os comuns da praia até ele aparecer."
ru = "{npc:2635} появляется вместо обычного зверя «{npc:1151}» на побережье к северу от лагеря Орды. Если его нет, убивайте обычных кроколисков на пляже, пока он не появится."
ko = "{npc:2635}은(는) 호드 야영지 북쪽 해안에서 일반 {npc:1151} 대신 나타납니다. 보이지 않으면 해변의 일반 악어를 처치하며 나타날 때까지 기다리세요."
zh_cn = "{npc:2635}会在部落营地以北的海岸上取代普通的{npc:1151}出现。如果一只都没有，就在海滩上击杀普通鳄鱼，直到它出现。"
zh_tw = "{npc:2635}會在部落營地以北的海岸上取代普通的{npc:1151}出現。如果一隻都沒有，就在海灘上擊殺普通鱷魚，直到牠出現。"

