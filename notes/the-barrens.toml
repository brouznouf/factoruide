# Gann's Reclamation: the giver walks the road of the southern Barrens instead of standing at one spot.
[[note]]
quest = 843
phase = "accept"
level = "warning"
en = "{npc:3341} walks up and down the road near the dig site: look for him along it rather than at one spot."
fr = "{npc:3341} fait des allers-retours sur la route près du site de fouilles : cherchez-le le long de la route plutôt qu'à un endroit précis."
de = "{npc:3341} läuft auf der Straße nahe der Ausgrabungsstätte auf und ab: Such ihn entlang der Straße statt an einer festen Stelle."
es = "{npc:3341} recorre el camino de ida y vuelta cerca de la excavación: búscalo a lo largo del camino y no en un punto fijo."
pt = "{npc:3341} anda de um lado para o outro na estrada perto da escavação: procure-o ao longo da estrada, não num ponto fixo."
ru = "{npc:3341} ходит туда-сюда по дороге возле раскопок: ищите его вдоль дороги, а не в одной точке."
ko = "{npc:3341}은(는) 발굴지 근처 길을 오가며 걷습니다. 한 곳이 아니라 길을 따라 찾아보세요."
zh_cn = "{npc:3341}会在挖掘场附近的大路上来回走动：沿着大路找他，而不是守在一个地方。"
