# Revenge of Gann: the target flying machine is outside the keep, on a wooden tower in the
# excavation pit, and the explosive works from the foot of the tower.
[[note]]
quest = 849
phase = "objective"
objective = 1
level = "info"
en = "This {object:3644} is not inside the keep: it stands on top of a wooden tower in the excavation pit, at the first bend of the ramp down. Use the {item:5021} from the ground, no need to climb."
fr = "Ce {object:3644} n'est pas dans le donjon : il se trouve en haut d'une tour en bois dans la fosse d'excavation, au premier virage de la rampe qui descend. Utilisez {item:5021} depuis le sol, inutile de grimper."
de = "Diese {object:3644} ist nicht in der Festung: Sie steht oben auf einem Holzturm in der Ausgrabungsgrube, an der ersten Biegung der Rampe nach unten. Benutze {item:5021} vom Boden aus, Klettern ist unnötig."
es = "Esta {object:3644} no está dentro de la fortaleza: está en lo alto de una torre de madera en el foso de excavación, en la primera curva de la rampa de bajada. Usa {item:5021} desde el suelo, no hace falta subir."
pt = "Esta {object:3644} não fica dentro da fortaleza: está no alto de uma torre de madeira no fosso da escavação, na primeira curva da rampa de descida. Use {item:5021} do chão, não precisa subir."
ru = "Этот {object:3644} находится не в крепости, а на вершине деревянной башни в котловане раскопок, у первого поворота спускающегося пандуса. Используйте {item:5021} с земли, залезать не нужно."
ko = "이 {object:3644}은(는) 요새 안이 아니라 발굴 구덩이의 나무 탑 꼭대기, 내려가는 비탈길의 첫 모퉁이에 있습니다. 올라갈 필요 없이 땅에서 {item:5021}을(를) 사용하세요."
zh_cn = "这架{object:3644}不在要塞里：它位于挖掘坑中一座木塔的顶端，就在下坡道的第一个弯处。在地面使用{item:5021}即可，无需爬上去。"
zh_tw = "這架{object:3644}不在要塞裡：它位於挖掘坑中一座木塔的頂端，就在下坡道的第一個彎處。在地面使用{item:5021}即可，無需爬上去。"

# Nugget Slugs: the tool buckets stand around the lake shore at the foot of the small derricks and often hold several slugs; the big tower is not needed.
[[note]]
quest = 3922
phase = "objective"
objective = 1
level = "info"
en = "{object:161752} stand around the lake at the foot of the small derricks and often hold several slugs each: circling the shore is usually enough, without climbing the big central tower."
fr = "Les {object:161752} sont autour du lac, au pied des petits derricks, et contiennent souvent plusieurs limaces chacun : faire le tour de la rive suffit en général, sans monter dans la grande tour centrale."
de = "{object:161752} stehen rund um den See am Fuß der kleinen Bohrtürme und enthalten oft mehrere Schnecken: Meist reicht eine Runde am Ufer, ohne auf den großen Turm in der Mitte zu steigen."
es = "{object:161752} están alrededor del lago, al pie de las torres de perforación pequeñas, y a menudo contienen varias babosas cada uno: suele bastar con rodear la orilla, sin subir a la gran torre central."
pt = "{object:161752} ficam em volta do lago, ao pé das torres de perfuração pequenas, e muitas vezes têm várias lesmas cada: em geral basta contornar a margem, sem subir na grande torre central."
ru = "{object:161752} стоят вокруг озера у подножия малых буровых вышек, и в каждом часто несколько слизней: обычно хватает обойти берег, не поднимаясь на большую центральную башню."
ko = "{object:161752}은(는) 호수 둘레의 작은 시추탑 발치에 있으며 하나에 민달팽이가 여러 개 들어 있는 경우가 많습니다. 보통 가운데 큰 탑에 오르지 않고 호숫가를 한 바퀴 돌면 충분합니다."
zh_cn = "{object:161752}分布在湖边小钻塔的脚下，每个常常装有好几只鼻涕虫：通常绕湖岸一圈就够了，不必爬上中央的大塔。"
zh_tw = "{object:161752}分布在湖邊小鑽塔的腳下，每個常常裝有好幾隻蛞蝓：通常繞湖岸一圈就夠了，不必爬上中央的大塔。"

# Plundering the Plunderers: Pick Lock must be trained and raised on the ship's footlockers (about 25 opens the jewel); opening it twice calls the parrot again and there is only one cracker.
[[note]]
quest = 2381
phase = "objective"
objective = 1
level = "warning"
en = "Train Pick Lock first. On the ship, raise Lockpicking on the footlockers of the upper deck until {object:123462} below opens (about 25). Open it only once: the parrot it calls must get your single {item:7970}."
fr = "Apprenez d'abord Crochetage. Sur le navire, montez la compétence sur les coffres du pont supérieur jusqu'à pouvoir ouvrir {object:123462} en dessous (environ 25). Ne l'ouvrez qu'une fois : le perroquet qu'il appelle doit recevoir votre unique {item:7970}."
de = "Lerne zuerst Schlossknacken. Steigere die Fertigkeit auf dem Schiff an den Schließkisten des oberen Decks, bis sich {object:123462} darunter öffnen lässt (etwa 25). Öffne es nur einmal: Der Papagei, den es ruft, braucht dein einziges {item:7970}."
es = "Aprende primero Forzar cerradura. En el barco, sube la habilidad con los baúles de la cubierta superior hasta poder abrir {object:123462} de abajo (unos 25). Ábrelo una sola vez: el loro que aparece necesita tu único {item:7970}."
pt = "Aprenda Arrombar Fechadura antes. No navio, suba a perícia nos baús do convés superior até conseguir abrir {object:123462} embaixo (cerca de 25). Abra só uma vez: o papagaio que ele chama precisa do seu único {item:7970}."
ru = "Сначала изучите «Взлом замка». На корабле прокачайте навык на сундучках верхней палубы, пока не сможете открыть {object:123462} внизу (около 25). Открывайте его только один раз: на призванного попугая нужен ваш единственный {item:7970}."
ko = "먼저 자물쇠 따기를 배우세요. 배 위층 갑판의 사물함으로 숙련도를 올려 아래층의 {object:123462}을(를) 열 수 있게 하세요(약 25). 단 한 번만 여세요. 나타나는 앵무새에게 하나뿐인 {item:7970}을(를) 써야 합니다."
zh_cn = "先学会开锁。在船上用上层甲板的提箱练开锁技能，直到能打开下层的{object:123462}（约25点）。只打开一次：它召来的鹦鹉需要你唯一的{item:7970}。"
zh_tw = "先學會開鎖。在船上用上層甲板的提箱練開鎖技能，直到能打開下層的{object:123462}（約25點）。只打開一次：它召來的鸚鵡需要你唯一的{item:7970}。"

# Mission: Possible But Not Probable: the key only comes from pickpocketing Silixiz, the lockbox needs about 85 Lockpicking, and looting the cache gives a days-long poison that ruins stealth.
[[note]]
quest = 2478
phase = "objective"
level = "warning"
en = "{item:8072} only comes from picking {npc:7287}'s pocket: killing him does not drop it. {object:129127} at the top needs about 85 Lockpicking, and looting {item:8073} poisons you and weakens stealth for days, so take it last."
fr = "{item:8072} s'obtient seulement en faisant les poches de {npc:7287} : le tuer ne la donne pas. {object:129127}, en haut, demande environ 85 en Crochetage, et ramasser {item:8073} vous empoisonne et affaiblit le camouflage pendant des jours : prenez-la en dernier."
de = "{item:8072} gibt es nur durch Taschendiebstahl bei {npc:7287}: Tötest du ihn, fällt er nicht. {object:129127} oben braucht etwa 85 Schlossknacken, und das Plündern von {item:8073} vergiftet dich und schwächt Verstohlenheit tagelang, also nimm es zuletzt."
es = "{item:8072} solo se consigue robándole a {npc:7287}: matarlo no la suelta. {object:129127}, arriba, pide unos 85 de Forzar cerradura, y recoger {item:8073} te envenena y debilita el sigilo durante días, así que cógelo al final."
pt = "{item:8072} só sai batendo a carteira de {npc:7287}: matá-lo não a dá. {object:129127}, no alto, exige cerca de 85 em Arrombar Fechadura, e pegar {item:8073} envenena você e enfraquece a furtividade por dias, então pegue por último."
ru = "{item:8072} можно только украсть у {npc:7287}: с убитого он не выпадает. Для {object:129127} наверху нужно около 85 навыка взлома, а добыча {item:8073} отравляет вас и на несколько дней ослабляет незаметность, поэтому берите его последним."
ko = "{item:8072}은(는) {npc:7287}의 주머니를 털어야만 얻을 수 있고, 처치해도 떨어지지 않습니다. 꼭대기의 {object:129127}은(는) 자물쇠 따기 약 85가 필요하며, {item:8073}을(를) 집으면 중독되어 며칠 동안 은신이 약해지니 맨 마지막에 챙기세요."
zh_cn = "{item:8072}只能从{npc:7287}身上偷取：杀死他不会掉落。顶层的{object:129127}需要约85点开锁技能，而拾取{item:8073}会让你中毒，数天内削弱潜行，所以最后再拿。"
zh_tw = "{item:8072}只能從{npc:7287}身上偷取：殺死他不會掉落。頂層的{object:129127}需要約85點開鎖技能，而拾取{item:8073}會讓你中毒，數天內削弱潛行，所以最後再拿。"

# Isha Awak: no fixed spot; found at several points of the shallows between Mahren Skyseer's camp and Northwatch Hold, among aggressive makrura.
[[note]]
quest = 873
phase = "objective"
objective = 1
level = "warning"
en = "{npc:3476} roams the shallows along the coast from {npc:3388}'s camp south to Northwatch Hold rather than staying at one spot. Search the water's edge and clear the crabs around him before you pull."
fr = "{npc:3476} parcourt les hauts-fonds le long de la côte, du camp de {npc:3388} jusqu'au fort de Guet-du-Nord au sud, sans rester au même endroit. Fouillez le bord de l'eau et éliminez les crabes autour de lui avant de l'attirer."
de = "{npc:3476} streift durch das seichte Wasser an der Küste, vom Lager von {npc:3388} bis südlich zur Nordwacht, statt an einer Stelle zu bleiben. Suche am Ufer und erledige die Krebse um ihn herum, bevor du ihn angreifst."
es = "{npc:3476} recorre las aguas poco profundas de la costa, desde el campamento de {npc:3388} hasta el Bastión del Norte al sur, sin quedarse en un sitio. Busca en la orilla y limpia los cangrejos de alrededor antes de atraerlo."
pt = "{npc:3476} percorre as águas rasas da costa, do acampamento de {npc:3388} até a Fortaleza Vigia Norte ao sul, sem ficar num só lugar. Procure na beira da água e limpe os caranguejos ao redor antes de puxá-lo."
ru = "{npc:3476} бродит по мелководью вдоль побережья от лагеря {npc:3388} на юг до Северной крепости, а не стоит на одном месте. Ищите его у кромки воды и перебейте крабов вокруг, прежде чем нападать."
ko = "{npc:3476}은(는) 한곳에 머물지 않고 {npc:3388}의 야영지에서 남쪽 북부감시 요새까지 해안의 얕은 물을 돌아다닙니다. 물가를 살펴보고, 끌어오기 전에 주변의 게를 먼저 처치하세요."
zh_cn = "{npc:3476}不会停在一个地方，而是在{npc:3388}的营地往南到北卫要塞一带的海岸浅水中游荡。沿着水边寻找，拉怪前先清掉他周围的螃蟹。"
zh_tw = "{npc:3476}不會停在一個地方，而是在{npc:3388}的營地往南到北衛要塞一帶的海岸淺水中遊蕩。沿著水邊尋找，拉怪前先清掉牠周圍的螃蟹。"

# Apothecary Zamah: she stands inside the Pools of Vision, a cave under Spirit Rise whose entrance is easy to miss from the bridges above.
[[note]]
quest = 853
phase = "turnin"
level = "info"
en = "{npc:3419} is inside the Pools of Vision, a cave under Spirit Rise in {zone:1638}: take the lowest bridge to the rise, and the entrance is on the right between two guards."
fr = "{npc:3419} se trouve dans les Bassins des visions, une grotte sous le Pic des Esprits à {zone:1638} : prenez le pont le plus bas vers le pic, l'entrée est sur la droite entre deux gardes."
de = "{npc:3419} steht in den Teichen der Visionen, einer Höhle unter der Anhöhe der Geister in {zone:1638}: Nimm die unterste Brücke zur Anhöhe, der Eingang liegt rechts zwischen zwei Wachen."
es = "{npc:3419} está dentro de las Pozas de las Visiones, una cueva bajo el Alto de los Espíritus en {zone:1638}: toma el puente más bajo hacia el alto y la entrada está a la derecha, entre dos guardias."
pt = "{npc:3419} fica dentro das Lagoas da Visão, uma caverna sob o Platô dos Espíritos em {zone:1638}: pegue a ponte mais baixa até o platô; a entrada fica à direita, entre dois guardas."
ru = "{npc:3419} находится в Озерах Видений, пещере под Вершиной Духов в {zone:1638}: перейдите на вершину по самому нижнему мосту, вход справа между двумя стражниками."
ko = "{npc:3419}은(는) {zone:1638}의 정령의 봉우리 아래 동굴인 환영의 웅덩이 안에 있습니다. 가장 낮은 다리로 봉우리에 건너가면 오른쪽 두 경비병 사이에 입구가 있습니다."
zh_cn = "{npc:3419}在{zone:1638}灵魂高地下方的洞穴“幻象之池”里：走最低的那座桥到高地，入口在右侧两名卫兵之间。"
zh_tw = "{npc:3419}在{zone:1638}靈魂高地下方的洞穴「幻象之池」裡：走最低的那座橋到高地，入口在右側兩名衛兵之間。"

# The Affray: challengers come one at a time and Big Will waits, neutral, until attacked.
[[note]]
quest = 1719
phase = "objective"
level = "warning"
en = "After you step on the grate, the challengers come one at a time about 15 seconds apart, with a 10-minute limit. Once the last falls, step back and heal: {npc:6238} stays neutral until you attack him."
fr = "Une fois sur la grille, les adversaires arrivent un par un, à environ 15 secondes d'intervalle, avec une limite de 10 minutes. Après le dernier, reculez et soignez-vous : {npc:6238} reste neutre tant que vous ne l'attaquez pas."
de = "Sobald du auf dem Gitter stehst, kommen die Herausforderer einzeln im Abstand von etwa 15 Sekunden, mit 10 Minuten Zeitlimit. Nach dem letzten tritt zurück und heil dich: {npc:6238} bleibt neutral, bis du ihn angreifst."
es = "Al pisar la rejilla, los rivales llegan de uno en uno, cada unos 15 segundos, con un límite de 10 minutos. Tras el último, apártate y cúrate: {npc:6238} sigue neutral hasta que lo atacas."
pt = "Ao pisar na grade, os desafiantes vêm um de cada vez, a cada 15 segundos mais ou menos, com limite de 10 minutos. Depois do último, afaste-se e cure-se: {npc:6238} fica neutro até você atacá-lo."
ru = "Когда вы встанете на решётку, противники выходят по одному примерно каждые 15 секунд; лимит — 10 минут. После последнего отойдите и подлечитесь: {npc:6238} нейтрален, пока вы его не атакуете."
ko = "창살을 밟으면 도전자가 약 15초 간격으로 한 명씩 나오며 제한 시간은 10분입니다. 마지막 도전자를 쓰러뜨리면 물러나 회복하세요. {npc:6238}은(는) 공격하기 전까지 중립입니다."
zh_cn = "站上铁栅后，挑战者约每15秒出现一个，限时10分钟。最后一个倒下后后退回血：{npc:6238}在你攻击前保持中立。"
zh_tw = "站上鐵柵後，挑戰者約每15秒出現一個，限時10分鐘。最後一個倒下後後退回血：{npc:6238}在你攻擊前保持中立。"

# Counterattack!: talking to Regthar starts the battle; Krom'zar only arrives after many centaurs die, and his banner is an object anyone on the quest can use.
[[note]]
quest = 4021
phase = "objective"
objective = 1
level = "warning"
en = "Ask {npc:3389} where the Kolkar are to start the battle. Kill centaurs beside the defenders until {npc:9456} arrives with two bodyguards; once he dies, click {object:164690} over his body. Anyone on the quest can take it."
fr = "Demandez à {npc:3389} où sont les Kolkar pour lancer la bataille. Tuez des centaures aux côtés des défenseurs jusqu'à l'arrivée de {npc:9456} et de ses deux gardes du corps ; une fois mort, cliquez sur la {object:164690} au-dessus de son corps. Tout joueur sur la quête peut la prendre."
de = "Frag {npc:3389}, wo die Kolkar sind, um die Schlacht zu starten. Töte Zentauren an der Seite der Verteidiger, bis {npc:9456} mit zwei Leibwächtern kommt; ist er tot, klicke auf {object:164690} über seiner Leiche. Jeder mit der Quest kann sie nehmen."
es = "Pregunta a {npc:3389} dónde están los Kolkar para empezar la batalla. Mata centauros junto a los defensores hasta que llegue {npc:9456} con dos guardaespaldas; cuando muera, haz clic en el {object:164690} sobre su cuerpo. Cualquiera con la misión puede cogerlo."
pt = "Pergunte a {npc:3389} onde estão os Kolkar para iniciar a batalha. Mate centauros ao lado dos defensores até {npc:9456} chegar com dois guarda-costas; quando ele morrer, clique no {object:164690} sobre o corpo. Qualquer um com a missão pode pegá-lo."
ru = "Спросите у {npc:3389}, где колкары, чтобы начать битву. Убивайте кентавров вместе с защитниками, пока не появится {npc:9456} с двумя телохранителями; когда он умрёт, щёлкните по предмету «{object:164690}» над его телом. Взять его может любой с этим заданием."
ko = "{npc:3389}에게 콜카르의 위치를 물어 전투를 시작하세요. 수비병과 함께 켄타우로스를 처치하다 보면 {npc:9456}이(가) 경호원 둘과 나타납니다. 처치 후 시체 위의 {object:164690}을(를) 클릭하세요. 퀘스트가 있는 누구나 가져갈 수 있습니다."
zh_cn = "向{npc:3389}询问科卡尔人在哪里以开始战斗。和守卫一起杀半人马，直到{npc:9456}带着两名保镖出现；他死后点击他尸体上方的{object:164690}。任何接了任务的人都能拿。"
zh_tw = "向{npc:3389}詢問科卡爾人在哪裡以開始戰鬥。和守衛一起殺半人馬，直到{npc:9456}帶著兩名保鏢出現；他死後點擊他屍體上方的{object:164690}。任何接了任務的人都能拿。"

