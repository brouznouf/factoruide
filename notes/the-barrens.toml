[[note]]
quest = 882
phase = "objective"
objective = 1
level = "warning"
en = "{npc:3257} only appears when you use a {item:10338} under the leafless tree on the hill north of Ratchet. Any zhevra drops the carcass while you have the quest."
fr = "{npc:3257} n'apparaît que si vous utilisez une {item:10338} sous l'arbre sans feuilles de la colline au nord de Cabestan. N'importe quel zhévra lâche la carcasse tant que vous avez la quête."
de = "{npc:3257} erscheint nur, wenn du einen {item:10338} unter dem blattlosen Baum auf dem Hügel nördlich von Ratschet benutzt. Jedes Zhevra lässt den Kadaver fallen, solange du die Quest hast."
es = "{npc:3257} solo aparece si usas un {item:10338} bajo el árbol sin hojas de la colina al norte de Trinquete. Cualquier zhevra suelta el cadáver mientras tengas la misión."
pt = "{npc:3257} só aparece se você usar uma {item:10338} sob a árvore sem folhas na colina ao norte de Vila Catraca. Qualquer zhevra deixa cair a carcaça enquanto você tiver a missão."
ru = "{npc:3257} появляется, только если использовать {item:10338} под безлистным деревом на холме к северу от Кабестана. Тушу роняет любая зебра, пока у вас есть задание."
ko = "{npc:3257}은(는) 톱니항 북쪽 언덕의 잎 없는 나무 아래에서 {item:10338}을(를) 사용해야만 나타납니다. 퀘스트를 받은 동안에는 어떤 얼룩말이든 사체를 떨어뜨립니다."
zh_cn = "只有在棘齿城北边山丘上那棵没有叶子的树下使用{item:10338}，{npc:3257}才会出现。接了任务后，任何斑马都会掉落尸体。"
zh_tw = "只有在棘齒城北邊山丘上那棵沒有葉子的樹下使用{item:10338}，{npc:3257}才會出現。接了任務後，任何斑馬都會掉落屍體。"

