quest = 4021
phase = "objective"
objective = 1
icon = "event"

# The Principal Source: filling the sampler at the pool spawns three more acolytes.
[[note]]
quest = 6127
phase = "objective"
objective = 1
level = "warning"
en = "Filling the sampler at the pool brings an ambush ({npc:3380} ×3): clear the guards and heal up first, then fill it on the side of your way down and leave at once."
fr = "Remplir l'échantillonneur au bassin déclenche une embuscade ({npc:3380} ×3) : éliminez les gardes et soignez-vous d'abord, puis remplissez-le du côté de votre descente et partez aussitôt."
de = "Das Füllen des Probenbehälters am Teich löst einen Hinterhalt aus ({npc:3380} ×3): Besiege erst die Wachen und heile dich, fülle ihn dann auf der Seite deines Abstiegs und verschwinde sofort."
es = "Llenar el muestreador en el estanque provoca una emboscada ({npc:3380} ×3): elimina antes a los guardias y cúrate, luego llénalo del lado por el que bajarás y vete enseguida."
pt = "Encher o amostrador na lagoa provoca uma emboscada ({npc:3380} ×3): elimine os guardas e cure-se antes, depois encha-o do lado por onde vai descer e saia na hora."
ru = "Когда вы наполняете пробирку у пруда, появляется засада ({npc:3380} ×3): сначала перебейте охрану и подлечитесь, затем наполните её со стороны спуска и сразу уходите."
ko = "웅덩이에서 채집병을 채우면 매복({npc:3380} ×3)이 나타납니다. 먼저 경비병을 처치하고 생명력을 회복한 뒤, 내려갈 쪽에서 채우고 곧바로 떠나세요."
zh_cn = "在水池装满取样瓶会引来伏击（{npc:3380} ×3）：先清掉守卫并回满血，然后在下山路线一侧装满，立刻离开。"
zh_tw = "在水池裝滿取樣瓶會引來伏擊（{npc:3380} ×3）：先清掉守衛並回滿血，然後在下山路線一側裝滿，立刻離開。"

# Body and Heart: Lunaclaw is a tough fight at the quest's level, and the dust is used up by a failed attempt.
[[note]]
quest = 6002
phase = "objective"
objective = 1
level = "warning"
en = "{item:15710} on the stone summons {npc:12138}, level 12 and hard-hitting for a level 10: start at full health. If he wins, the dust is spent: abandon the quest and take it again in {zone:1638}."
fr = "{item:15710} sur la pierre invoque {npc:12138}, niveau 12 et qui frappe fort pour un niveau 10 : commencez avec toute votre vie. S'il gagne, la poudre est perdue : abandonnez la quête et reprenez-la à {zone:1638}."
de = "{item:15710} auf dem Stein beschwört {npc:12138}, Stufe 12 und für Stufe 10 sehr stark: Beginne mit voller Gesundheit. Gewinnt er, ist der Staub verbraucht: Brich die Quest ab und nimm sie in {zone:1638} neu an."
es = "{item:15710} sobre la piedra invoca a {npc:12138}, de nivel 12 y que pega fuerte para un nivel 10: empieza con la salud al máximo. Si gana, el polvo se pierde: abandona la misión y vuelve a cogerla en {zone:1638}."
pt = "{item:15710} na pedra invoca {npc:12138}, nível 12 e que bate forte para um nível 10: comece com a vida cheia. Se ele vencer, o pó se perde: abandone a missão e pegue-a de novo em {zone:1638}."
ru = "{item:15710} на камне призывает {npc:12138} — 12-й уровень, бьёт сильно для 10-го: начинайте с полным здоровьем. Если он победит, пыль пропадёт: откажитесь от задания и возьмите его заново в {zone:1638}."
ko = "돌에 {item:15710}을(를) 뿌리면 {npc:12138}이(가) 소환됩니다. 12레벨로 10레벨에게는 아프게 때리니 생명력을 가득 채우고 시작하세요. 지면 가루가 사라지니 퀘스트를 포기하고 {zone:1638}에서 다시 받으세요."
zh_cn = "在石头上使用{item:15710}会召唤{npc:12138}，12级，对10级角色来说打得很疼：满血开打。如果打输，粉末就没了：放弃任务，回{zone:1638}重新接取。"
zh_tw = "在石頭上使用{item:15710}會召喚{npc:12138}，12級，對10級角色來說打得很痛：滿血開打。如果打輸，粉末就沒了：放棄任務，回{zone:1638}重新接取。"

# Trouble in the Valley (Forever): attacking the corporal pulls the whole camp of marines, even
# from its edge; they leash back when he is dragged far enough.
[[note]]
quest = 95621
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "Attacking {npc:262119} brings every marine of the camp at once, even when pulled from its edge: bring a group, or kite him away until the others give up and walk back."
fr = "Attaquer {npc:262119} attire d'un coup tous les marins du camp, même depuis sa lisière : venez en groupe, ou entraînez-le au loin jusqu'à ce que les autres abandonnent et repartent."
de = "Wer {npc:262119} angreift, hat sofort alle Marinesoldaten des Lagers am Hals, auch vom Rand aus: Komm mit einer Gruppe oder zieh ihn weg, bis die anderen aufgeben und zurückgehen."
es = "Atacar a {npc:262119} atrae a la vez a todos los marines del campamento, incluso desde el borde: ve en grupo, o llévalo lejos hasta que los demás se rindan y vuelvan."
pt = "Atacar {npc:262119} puxa todos os fuzileiros do acampamento de uma vez, mesmo pela borda: venha em grupo ou arraste-o para longe até os outros desistirem e voltarem."
ru = "Нападение на {npc:262119} поднимает сразу всех моряков лагеря, даже с его края: идите группой или уводите его прочь, пока остальные не отстанут и не вернутся."
ko = "{npc:262119}을(를) 공격하면 진영 가장자리에서 끌어도 진영의 해병이 한꺼번에 몰려옵니다. 파티를 꾸리거나, 다른 적이 포기하고 돌아갈 때까지 그를 멀리 끌고 가세요."
zh_cn = "攻击{npc:262119}会一次引来营地里所有的水兵，即使从营地边缘拉也一样：组队前往，或把他远远拉开，直到其他人放弃返回。"
zh_tw = "攻擊{npc:262119}會一次引來營地裡所有的水兵，即使從營地邊緣拉也一樣：組隊前往，或把他遠遠拉開，直到其他人放棄返回。"

# Chol'aruk the Ravener (Horde, Forever): the boss waits at the back of a cave of level 18-20
# elites whose mouth is on the northeast side of the mountain, northeast of the Crossroads.
[[note]]
quest = 97003
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "{npc:267307} waits at the back of a cave full of level 18-20 elites, entered from the northeast side of the mountain near 58, 25 (northeast of the Crossroads). Bring a friend or two."
fr = "{npc:267307} attend au fond d'une grotte remplie d'élites de niveau 18-20, dont l'entrée est sur le flanc nord-est de la montagne vers 58, 25 (au nord-est de la Croisée). Venez à deux ou trois."
de = "{npc:267307} wartet am Ende einer Höhle voller Elites der Stufe 18-20, deren Eingang an der Nordostseite des Berges bei etwa 58, 25 liegt (nordöstlich vom Wegekreuz). Nimm ein oder zwei Mitspieler mit."
es = "{npc:267307} espera al fondo de una cueva llena de élites de nivel 18-20, con la entrada en la ladera noreste de la montaña cerca de 58, 25 (al noreste de El Cruce). Ve con uno o dos compañeros."
pt = "{npc:267307} espera no fundo de uma caverna cheia de elites de nível 18-20, com entrada na encosta nordeste da montanha perto de 58, 25 (a nordeste da Encruzilhada). Leve um ou dois amigos."
ru = "{npc:267307} ждёт в глубине пещеры, полной элитных существ 18-20 уровня; вход на северо-восточном склоне горы около 58, 25 (к северо-востоку от Перекрестка). Возьмите одного-двух спутников."
ko = "{npc:267307}은(는) 18-20레벨 정예가 가득한 동굴 안쪽에 있습니다. 입구는 산의 북동쪽 면, 약 58, 25(크로스로드 북동쪽)입니다. 한두 명과 함께 가세요."
zh_cn = "{npc:267307}在一个满是18-20级精英的洞穴深处，入口位于山的东北侧，约58, 25（十字路口东北）。带上一两个同伴。"
zh_tw = "{npc:267307}在一個滿是18-20級精英的洞穴深處，入口位於山的東北側，約58, 25（十字路口東北）。帶上一兩個同伴。"

