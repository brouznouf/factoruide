# Quest notes of The Hinterlands. See notes/README.md for the format.

# Whiskey Slim's Lost Grog: the bottles stand on the shore and blend into the ground.
[[note]]
quest = 580
phase = "objective"
objective = 1
level = "info"
en = "The blue bottles stand on the shore and are hard to see against the ground: turn the ground clutter down in the graphics settings to spot them from afar."
fr = "Les bouteilles bleues sont posées sur le rivage et se confondent avec le sol : baissez les détails du sol dans les options graphiques pour les repérer de loin."
de = "Die blauen Flaschen stehen am Ufer und sind vor dem Boden schwer zu erkennen: stell die Bodendetails in den Grafikeinstellungen herunter, um sie von Weitem zu sehen."
es = "Las botellas azules están en la orilla y cuesta verlas contra el suelo: baja los detalles del terreno en las opciones gráficas para verlas de lejos."
pt = "As garrafas azuis ficam na margem e são difíceis de ver contra o chão: reduza os detalhes do terreno nas opções gráficas para avistá-las de longe."
ru = "Синие бутылки стоят на берегу и сливаются с землёй: уменьшите детализацию поверхности в настройках графики, чтобы видеть их издалека."
ko = "파란 병은 해안에 놓여 있어 땅과 구분하기 어렵습니다. 그래픽 설정에서 지면 세부 묘사를 낮추면 멀리서도 보입니다."
zh_cn = "蓝色瓶子放在岸边，很难从地面上分辨出来：在图像设置中调低地面细节，就能远远看到它们。"
zh_tw = "藍色瓶子放在岸邊，很難從地面上分辨出來：在圖像設定中調低地面細節，就能遠遠看到它們。"

[[icon]]
quest = 580
phase = "objective"
icon = "pickup"

# Rin'ji is Trapped!: two ambushes of three elves on the way out of the lodge; Rin'ji walks into owlbeasts; he can be healed.
[[note]]
quest = 2742
phase = "objective"
objective = 1
level = "warning"
en = "Clear the lodge before freeing {npc:7780}: on the way out, two ambushes of three elves attack, and he walks straight into owlbeasts on his path. You can heal him."
fr = "Nettoyez le pavillon avant de libérer {npc:7780} : en sortant, deux embuscades de trois elfes attaquent, et il fonce droit sur les chouettards qui croisent sa route. Vous pouvez le soigner."
de = "Säubere die Jagdhütte, bevor du {npc:7780} befreist: auf dem Weg hinaus greifen zwei Hinterhalte aus je drei Elfen an, und er läuft direkt in Eulenbestien auf seinem Weg. Du kannst ihn heilen."
es = "Limpia el pabellón antes de liberar a {npc:7780}: al salir atacan dos emboscadas de tres elfos, y él se mete de lleno en los lechúcicos de su camino. Puedes curarlo."
pt = "Limpe o pavilhão antes de libertar {npc:7780}: na saída, duas emboscadas de três elfos atacam, e ele vai direto para os corujaursos no caminho. Você pode curá-lo."
ru = "Зачистите охотничий домик, прежде чем освободить {npc:7780}: на выходе нападут две засады по три эльфа, а сам он идет прямо на совухов по пути. Его можно лечить."
ko = "{npc:7780}을(를) 풀어 주기 전에 오두막을 정리하세요. 나가는 길에 엘프 셋으로 된 매복이 두 번 덮치고, 그는 길에 있는 올빼미야수에게 그대로 걸어갑니다. 그를 치유할 수 있습니다."
zh_cn = "释放{npc:7780}之前先清理小屋：出去的路上会遭遇两次伏击，每次三个精灵，而且他会直接走向路上的枭兽。你可以治疗他。"
zh_tw = "釋放{npc:7780}之前先清理小屋：出去的路上會遭遇兩次伏擊，每次三個精靈，而且他會直接走向路上的梟獸。你可以治療他。"

# Hunt the Savages: Savage Owlbeasts share spawn points with Silvermane Stalkers.
[[note]]
quest = 7829
phase = "objective"
objective = 1
level = "info"
en = "{npc:2929} shares its spawn points with {npc:2926}: when no owlbeasts are left, kill the stalkers nearby to make new ones appear."
fr = "{npc:2929} partage ses points d'apparition avec {npc:2926} : quand il n'y a plus de chouettards, tuez les traqueurs alentour pour en faire apparaître de nouveaux."
de = "{npc:2929} teilt sich die Spawnpunkte mit {npc:2926}: sind keine Eulenbestien mehr da, töte die Pirscher in der Nähe, damit neue erscheinen."
es = "{npc:2929} comparte puntos de aparición con {npc:2926}: cuando no queden lechúcicos, mata a los acechadores cercanos para que aparezcan nuevos."
pt = "{npc:2929} compartilha pontos de surgimento com {npc:2926}: quando não restarem corujaursos, mate os espreitadores por perto para que surjam novos."
ru = "{npc:2929} и {npc:2926} появляются в одних и тех же точках: когда совухов не осталось, убивайте ближайших охотников, чтобы появились новые."
ko = "{npc:2929}, {npc:2926} 둘은 출현 지점을 공유합니다. 올빼미야수가 보이지 않으면 근처의 추적자를 처치해 새로 나타나게 하세요."
zh_cn = "{npc:2929}与{npc:2926}共用刷新点：没有枭兽时，击杀附近的潜伏者，让新的刷出来。"
zh_tw = "{npc:2929}與{npc:2926}共用重生點：沒有梟獸時，擊殺附近的潛伏者，讓新的出現。"

# Lard Lost His Lunch: opening the basket spawns three kidnappers who all carry the lunch; one kill is enough, they follow into the water.
[[note]]
quest = 7840
phase = "objective"
objective = 1
level = "warning"
en = "Opening {object:179910} calls an ambush ({npc:14748} ×3). Each of them carries {item:19034}: kill and loot one, then get away; they follow you into the water."
fr = "Ouvrir {object:179910} déclenche une embuscade ({npc:14748} ×3). Chacun porte {item:19034} : tuez-en un, fouillez-le puis éloignez-vous ; ils vous suivent dans l'eau."
de = "Das Öffnen von {object:179910} löst einen Hinterhalt aus ({npc:14748} ×3). Jeder trägt {item:19034}: töte und plündere einen und zieh dich dann zurück; sie folgen dir ins Wasser."
es = "Abrir {object:179910} provoca una emboscada ({npc:14748} ×3). Cada uno lleva {item:19034}: mata y despoja a uno y luego aléjate; te siguen al agua."
pt = "Abrir {object:179910} provoca uma emboscada ({npc:14748} ×3). Cada um carrega {item:19034}: mate e saqueie um e depois se afaste; eles seguem você na água."
ru = "Открыв {object:179910}, вы вызовете засаду ({npc:14748} ×3). У каждого есть {item:19034}: убейте и обыщите одного, затем уходите; они преследуют вас и в воде."
ko = "{object:179910}을(를) 열면 매복이 나타납니다({npc:14748} ×3). 모두 {item:19034}을(를) 지니고 있으니 하나만 처치해 전리품을 챙기고 빠지세요. 물속까지 쫓아옵니다."
zh_cn = "打开{object:179910}会引来伏击（{npc:14748} ×3）。每个都带着{item:19034}：击杀并拾取其中一个，然后撤离；它们会追进水里。"
zh_tw = "打開{object:179910}會引來伏擊（{npc:14748} ×3）。每個都帶著{item:19034}：擊殺並拾取其中一個，然後撤離；他們會追進水裡。"

# Another Message to the Wildhammer: the feather is a tradeable trade good; in Feralas only the Frayfeather Hippogryph drops it.
[[note]]
quest = 7842
phase = "objective"
objective = 1
level = "info"
en = "{item:4589} is a trade good: keep any you loot before taking the quest, and check the auction house. In {zone:357}, only {npc:5300} drops it; the other hippogryphs there do not."
fr = "{item:4589} est une marchandise : gardez celles que vous ramassez avant la quête et regardez à l'hôtel des ventes. À {zone:357}, seul {npc:5300} en laisse tomber ; les autres hippogryphes de la zone non."
de = "{item:4589} ist ein Handwerksmaterial: behalte alle, die du vor der Quest erbeutest, und schau ins Auktionshaus. In {zone:357} lässt nur {npc:5300} sie fallen, die anderen Hippogryphen dort nicht."
es = "{item:4589} es un material comerciable: guarda las que consigas antes de la misión y mira en la casa de subastas. En {zone:357}, solo {npc:5300} la suelta; los demás hipogrifos de allí no."
pt = "{item:4589} é um material comercializável: guarde as que conseguir antes da missão e confira a casa de leilões. Em {zone:357}, só {npc:5300} a deixa cair; os outros hipogrifos de lá não."
ru = "{item:4589} — хозяйственный товар: сохраняйте все, что добудете до задания, и загляните на аукцион. В зоне {zone:357} его дает только {npc:5300}, остальные гиппогрифы там — нет."
ko = "{item:4589}은(는) 거래 가능한 재료입니다. 퀘스트를 받기 전에 얻은 것도 버리지 말고, 경매장도 확인하세요. {zone:357}에서는 {npc:5300}만 떨어뜨리며 그곳의 다른 히포그리프는 떨어뜨리지 않습니다."
zh_cn = "{item:4589}是商业技能材料：接任务前拾取的也要留着，并看看拍卖行。在{zone:357}，只有{npc:5300}会掉落，那里的其他角鹰兽都不会。"
zh_tw = "{item:4589}是商業技能材料：接任務前拾取的也要留著，並看看拍賣場。在{zone:357}，只有{npc:5300}會掉落，那裡的其他角鷹獸都不會。"

# The Final Message to the Wildhammer: planting the spear flags the player for PvP; a guard patrols near the well.
[[note]]
quest = 7843
phase = "objective"
objective = 1
level = "warning"
en = "Placing the spear by the well flags you for PvP. Wait for the patrolling guard to walk away, place it (it is instant) and leave at once."
fr = "Planter la lance près du puits vous active le JcJ. Attendez que le garde en patrouille s'éloigne, plantez-la (c'est instantané) et partez aussitôt."
de = "Das Platzieren des Speers am Brunnen markiert dich für PvP. Warte, bis die patrouillierende Wache weg ist, setz ihn (das geht sofort) und verschwinde gleich."
es = "Colocar la lanza junto al pozo te activa el JcJ. Espera a que el guardia que patrulla se aleje, colócala (es instantáneo) y vete enseguida."
pt = "Colocar a lança junto ao poço ativa seu JxJ. Espere o guarda que patrulha se afastar, coloque-a (é instantâneo) e saia logo."
ru = "Установка копья у колодца включает режим PvP. Дождитесь, пока патрулирующий стражник отойдет, поставьте копье (это мгновенно) и сразу уходите."
ko = "우물 옆에 창을 꽂으면 PvP가 활성화됩니다. 순찰하는 경비병이 멀어질 때를 기다렸다가 창을 꽂고(즉시 시전) 바로 떠나세요."
zh_cn = "在井边插下长矛会让你进入PvP状态。等巡逻的卫兵走开，插下长矛（瞬发）后立刻离开。"
zh_tw = "在井邊插下長矛會讓你進入PvP狀態。等巡邏的衛兵走開，插下長矛（瞬發）後立刻離開。"

# Rhapsody Shindigger: his camp is up in the hills and only reachable by a path starting to the west.
[[note]]
quest = 1451
phase = "turnin"
level = "info"
en = "{npc:5634}'s camp lies up in the hills and cannot be reached from the lodge to its east: the only way up is a path that starts further west, around 20, 48."
fr = "Le camp de {npc:5634} est perché dans les collines et inaccessible depuis le pavillon à l'est : le seul accès est un sentier qui part plus à l'ouest, vers 20, 48."
de = "Das Lager von {npc:5634} liegt oben in den Hügeln und ist von der Hütte im Osten aus nicht erreichbar: Der einzige Weg hinauf ist ein Pfad, der weiter westlich beginnt, um 20, 48."
es = "El campamento de {npc:5634} está en lo alto de las colinas y no se llega desde el pabellón al este: el único acceso es un sendero que empieza más al oeste, hacia 20, 48."
pt = "O acampamento de {npc:5634} fica no alto das colinas e não dá para chegar pelo pavilhão a leste: o único acesso é uma trilha que começa mais a oeste, por volta de 20, 48."
ru = "Лагерь {npc:5634} находится на холмах, и со стороны охотничьего домика на востоке к нему не подняться: единственная тропа начинается западнее, около 20, 48."
ko = "{npc:5634}의 야영지는 언덕 위에 있어 동쪽 산장 쪽에서는 갈 수 없습니다. 올라가는 길은 더 서쪽, 약 20, 48에서 시작하는 오솔길 하나뿐입니다."
zh_cn = "{npc:5634}的营地在山丘上，从东边的小屋那一侧上不去：唯一的路是更西边约20, 48处开始的小径。"
zh_tw = "{npc:5634}的營地在山丘上，從東邊的小屋那一側上不去：唯一的路是更西邊約20, 48處開始的小徑。"

# Rhapsody's Kalimdor Kocktail: rocs share spawn points with the hyenas at the bone piles of Tanaris.
[[note]]
quest = 1452
phase = "objective"
objective = 1
level = "info"
en = "Rocs share spawn points with the hyenas around the great bone piles south of Gadgetzan: when a pile is overrun by hyenas, keep killing them there to bring rocs back instead of roaming from pile to pile."
fr = "Les rocs partagent leurs points d'apparition avec les hyènes autour des grands tas d'ossements au sud de Gadgetzan : quand un tas est envahi d'hyènes, continuez à les tuer sur place pour faire revenir les rocs au lieu d'errer d'un tas à l'autre."
de = "Rocs teilen ihre Spawnpunkte mit den Hyänen an den großen Knochenhaufen südlich von Gadgetzan: Ist ein Haufen voller Hyänen, töte sie dort weiter, damit Rocs nachkommen, statt von Haufen zu Haufen zu ziehen."
es = "Los rocs comparten puntos de aparición con las hienas de los grandes montones de huesos al sur de Gadgetzan: si un montón está lleno de hienas, sigue matándolas allí para que vuelvan los rocs en vez de ir de montón en montón."
pt = "Os rocas dividem pontos de surgimento com as hienas dos grandes montes de ossos ao sul de Geringontzan: quando um monte estiver cheio de hienas, continue matando-as ali para os rocas voltarem, em vez de rodar de monte em monte."
ru = "Рухи делят точки появления с гиенами у больших груд костей к югу от Прибамбасска: если у груды одни гиены, продолжайте убивать их на месте, чтобы вернулись рухи, а не бегайте от груды к груде."
ko = "가젯잔 남쪽 큰 뼈 무더기 주변에서 로크는 하이에나와 생성 지점을 공유합니다. 무더기에 하이에나만 가득하면 이곳저곳 돌아다니지 말고 그 자리에서 하이에나를 계속 잡아 로크가 다시 나오게 하세요."
zh_cn = "加基森以南大骨堆周围的大鹏和土狼共用刷新点：如果某个骨堆全是土狼，就留在那里继续杀，让大鹏刷回来，不要在骨堆之间来回跑。"
zh_tw = "加基森以南大骨堆周圍的大鵬和土狼共用重生點：如果某個骨堆全是土狼，就留在那裡繼續殺，讓大鵬重生回來，不要在骨堆之間來回跑。"

# Rescue OOX-09/HL!: two scripted ambushes (owlbeasts on the road, trolls near the end), stealthed stalkers by the road; the escort fails when the player falls too far behind.
[[note]]
quest = 836
phase = "objective"
objective = 1
level = "warning"
en = "Two ambushes on the way: three owlbeasts on the road, three trolls near the end. Stealthed {npc:2926} lurk by the road. Keep up with the robot: the escort fails if you fall far behind. In a group, every member must start it."
fr = "Deux embuscades en chemin : trois chouettards sur la route, trois trolls vers la fin. Des {npc:2926} camouflés rôdent au bord de la route. Restez près du robot : l'escorte échoue si vous êtes trop loin. En groupe, chaque membre doit la lancer."
de = "Zwei Hinterhalte unterwegs: drei Eulenbestien auf der Straße, drei Trolle gegen Ende. Getarnte {npc:2926} lauern am Wegrand. Bleib am Roboter dran: Die Eskorte scheitert, wenn du zu weit zurückfällst. In einer Gruppe muss jedes Mitglied sie starten."
es = "Dos emboscadas por el camino: tres lechúcicos en la carretera y tres trols cerca del final. Hay {npc:2926} en sigilo junto al camino. No te separes del robot: la escolta falla si te quedas muy atrás. En grupo, cada miembro debe iniciarla."
pt = "Duas emboscadas no caminho: três corujursos na estrada e três trolls perto do fim. Há {npc:2926} furtivos à beira da estrada. Acompanhe o robô: a escolta falha se você ficar muito para trás. Em grupo, cada membro precisa iniciá-la."
ru = "Две засады по пути: три совуха на дороге и три тролля ближе к концу. У дороги прячутся незаметные {npc:2926}. Не отставайте от робота: если отстать слишком далеко, сопровождение провалится. В группе каждый участник должен сам его начать."
ko = "도중에 매복이 두 번 있습니다. 길 위에 올빼미야수 셋, 끝 무렵 트롤 셋. 길가에는 은신한 {npc:2926}이(가) 숨어 있습니다. 로봇에게서 너무 멀어지면 호위가 실패하니 바짝 따라가세요. 파티라면 모든 구성원이 각자 시작해야 합니다."
zh_cn = "途中有两次伏击：路上三只枭兽，快到终点时三个巨魔。路边还潜伏着潜行的{npc:2926}。紧跟机器人：落后太远护送就会失败。组队时每位成员都必须开始护送。"
zh_tw = "途中有兩次伏擊：路上三隻梟獸，快到終點時三個食人妖。路邊還潛伏著潛行的{npc:2926}。緊跟機器人：落後太遠護送就會失敗。組隊時每位成員都必須開始護送。"

# Undamaged Venom Sac: a rare drop that disappears 30 minutes after it is looted.
[[note]]
quest = 2934
phase = "objective"
objective = 1
level = "warning"
en = "{item:9322} drops rarely and disappears 30 minutes after you loot it: set your hearthstone in Tarren Mill first and go back at once."
fr = "{item:9322} tombe rarement et disparaît 30 minutes après avoir été ramassée : liez d'abord votre pierre de foyer à Moulin-de-Tarren et revenez aussitôt."
de = "{item:9322} droppt selten und verschwindet 30 Minuten nach dem Plündern: Binde deinen Ruhestein vorher in Tarrens Mühle und kehr sofort zurück."
es = "{item:9322} cae poco y desaparece 30 minutos después de saquearla: vincula antes tu piedra de hogar en Molino Tarren y vuelve enseguida."
pt = "{item:9322} cai raramente e some 30 minutos depois de saqueada: vincule antes sua pedra de regresso na Serraria Tarren e volte logo."
ru = "{item:9322} выпадает редко и исчезает через 30 минут после получения: заранее привяжите камень возвращения в Мельнице Таррен и сразу возвращайтесь."
ko = "{item:9322}은(는) 드물게 나오고 획득 30분 후 사라집니다. 미리 귀환석을 타렌 밀농장에 귀속하고 바로 돌아가세요."
zh_cn = "{item:9322}掉率很低，拾取30分钟后就会消失：先把炉石绑定在塔伦米尔，拿到后立刻返回。"
zh_tw = "{item:9322}掉落率很低，拾取30分鐘後就會消失：先把爐石綁定在塔倫米爾，拿到後立刻返回。"
