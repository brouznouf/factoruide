ru = "Синие бутылки стоят на берегу и сливаются с землёй: уменьшите детализацию поверхности в настройках графики, чтобы видеть их издалека."
ko = "파란 병은 해안에 놓여 있어 땅과 구분하기 어렵습니다. 그래픽 설정에서 지면 세부 묘사를 낮추면 멀리서도 보입니다."
zh_cn = "蓝色瓶子放在岸边，很难从地面上分辨出来：在图像设置中调低地面细节，就能远远看到它们。"
