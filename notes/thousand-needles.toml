# Quest notes of Thousand Needles. See notes/README.md for the format.

# Assassination Plot: the messenger who drops the starting note appears at the first road fork
# south of the lift and walks west.
[[note]]
quest = 4881
phase = "accept"
level = "info"
en = "{npc:10617} carries the note that starts this quest. He appears at the first road fork south of the lift (about 29, 34) and walks west: wait for him there."
fr = "{npc:10617} porte la note qui lance cette quête. Il apparaît au premier embranchement de la route au sud de l'élévateur (vers 29, 34) et marche vers l'ouest : attendez-le là."
de = "{npc:10617} trägt die Notiz, die diese Quest startet. Er erscheint an der ersten Weggabelung südlich des Aufzugs (etwa 29, 34) und läuft nach Westen: warte dort auf ihn."
es = "{npc:10617} lleva la nota que inicia esta misión. Aparece en la primera bifurcación del camino al sur del elevador (hacia 29, 34) y camina hacia el oeste: espéralo allí."
pt = "{npc:10617} carrega o bilhete que inicia esta missão. Ele surge na primeira bifurcação da estrada ao sul do elevador (cerca de 29, 34) e anda para oeste: espere-o lá."
ru = "{npc:10617} несёт записку, с которой начинается это задание. Он появляется у первой развилки дороги к югу от подъёмника (около 29, 34) и идёт на запад: ждите его там."
ko = "{npc:10617}이(가) 이 퀘스트를 시작하는 쪽지를 지니고 있습니다. 승강장 남쪽 첫 갈림길(약 29, 34)에 나타나 서쪽으로 걸어가니 그곳에서 기다리세요."
zh_cn = "{npc:10617}身上带着开启此任务的便条。他会出现在升降梯南边的第一个岔路口（约29, 34）并向西走去：在那里等他。"
zh_tw = "{npc:10617}身上帶著開啟此任務的便條。他會出現在升降梯南邊的第一個岔路口（約29, 34）並向西走去：在那裡等他。"

# Free at Last: the escort fails at a short distance, adds spawn at each plateau, and the captive
# takes about 15 minutes to come back after a failure.
[[note]]
quest = 4904
phase = "objective"
objective = 1
level = "warning"
en = "Stay right next to {npc:10646}: the escort fails at a shorter distance than most. Two Grimtotems join each time she reaches a plateau, so clear the next one while she crosses the bridge. She respawns in about 15 minutes."
fr = "Restez tout près de {npc:10646} : l'escorte échoue à une distance plus courte que d'habitude. Deux membres du Totem sinistre arrivent chaque fois qu'elle atteint un plateau : nettoyez le suivant pendant qu'elle traverse le pont. Elle réapparaît en 15 minutes environ."
de = "Bleib direkt bei {npc:10646}: die Eskorte scheitert schon bei kürzerem Abstand als üblich. An jedem Plateau kommen zwei Grimmtotem hinzu, also räume das nächste, während sie die Brücke überquert. Sie respawnt nach etwa 15 Minuten."
es = "Quédate pegado a {npc:10646}: la escolta falla a menos distancia de lo habitual. Llegan dos miembros de Tótem Siniestro cada vez que alcanza una meseta, así que despeja la siguiente mientras cruza el puente. Reaparece en unos 15 minutos."
pt = "Fique colado em {npc:10646}: a escolta falha a uma distância menor que o normal. Dois membros do Temível Totem chegam sempre que ela alcança um platô, então limpe o próximo enquanto ela atravessa a ponte. Ela ressurge em cerca de 15 minutos."
ru = "Держитесь вплотную к {npc:10646}: сопровождение срывается на меньшем расстоянии, чем обычно. На каждом плато появляются два воина племени Зловещего Тотема, поэтому зачищайте следующее, пока она идёт по мосту. Она возрождается примерно через 15 минут."
ko = "{npc:10646} 바로 곁에 붙어 있으세요. 이 호위는 보통보다 짧은 거리에서도 실패합니다. 고원에 닿을 때마다 그림토템부족 둘이 나타나니, 그녀가 다리를 건너는 동안 다음 고원을 정리하세요. 약 15분 뒤에 다시 나타납니다."
zh_cn = "紧跟在{npc:10646}身边：这次护送的失败距离比一般更短。她每到一个平台都会出现两个恐怖图腾，趁她过桥时先清理下一个平台。她约15分钟后重生。"
zh_tw = "緊跟在{npc:10646}身邊：這次護送的失敗距離比一般更短。她每到一個平台都會出現兩個恐怖圖騰，趁她過橋時先清理下一個平台。她約15分鐘後重生。"

# Homeward Bound: the escort fails as soon as the player is not close, and a rare elite circles
# over the nests.
[[note]]
quest = 4770
phase = "objective"
objective = 1
level = "warning"
en = "Keep close to {npc:10427}: the escort fails if you fall behind or run ahead. {npc:5934}, a rare elite, flies over the nests: start the escort just after it passes."
fr = "Restez près de {npc:10427} : l'escorte échoue si vous restez en arrière ou partez devant. {npc:5934}, un élite rare, survole les nids : lancez l'escorte juste après son passage."
de = "Bleib nah bei {npc:10427}: die Eskorte scheitert, wenn du zurückfällst oder vorausläufst. {npc:5934}, ein seltener Elite, fliegt über die Nester: starte die Eskorte direkt, nachdem er vorbeigezogen ist."
es = "Mantente cerca de {npc:10427}: la escolta falla si te quedas atrás o te adelantas. {npc:5934}, un élite raro, sobrevuela los nidos: empieza la escolta justo después de que pase."
pt = "Fique perto de {npc:10427}: a escolta falha se você ficar para trás ou correr na frente. {npc:5934}, um elite raro, sobrevoa os ninhos: comece a escolta logo depois que ele passar."
ru = "Держитесь рядом с {npc:10427}: сопровождение срывается, если вы отстанете или убежите вперёд. Над гнёздами летает {npc:5934}, редкий элитный противник: начинайте сопровождение сразу после того, как он пролетит."
ko = "{npc:10427} 가까이 붙어 있으세요. 뒤처지거나 앞서 달려가면 호위가 실패합니다. 희귀 정예 {npc:5934}이(가) 둥지 위를 날아다니니, 그가 지나간 직후에 호위를 시작하세요."
zh_cn = "紧跟{npc:10427}：落在后面或跑到前面都会导致护送失败。稀有精英{npc:5934}在巢穴上空盘旋：等它飞过后再开始护送。"
zh_tw = "緊跟{npc:10427}：落在後面或跑到前面都會導致護送失敗。稀有精英{npc:5934}在巢穴上空盤旋：等牠飛過後再開始護送。"

# Test of Faith: only the jump from the planks teleports the player back before landing.
[[note]]
quest = 1149
phase = "objective"
objective = 1
level = "must_read"
en = "Jump only from the wooden planks: you are teleported back before landing. Jumping from anywhere else is a deadly fall."
fr = "Sautez uniquement depuis les planches en bois : vous êtes téléporté avant de toucher le sol. Sauter de n'importe où ailleurs est une chute mortelle."
de = "Spring nur von den Holzplanken: du wirst vor der Landung zurückteleportiert. Ein Sprung von anderswo ist ein tödlicher Sturz."
es = "Salta solo desde los tablones de madera: te teletransportan antes de tocar el suelo. Saltar desde cualquier otro sitio es una caída mortal."
pt = "Pule apenas das tábuas de madeira: você é teleportado de volta antes de cair. Pular de qualquer outro lugar é uma queda fatal."
ru = "Прыгайте только с деревянных досок: вас телепортирует обратно до приземления. Прыжок из любого другого места — смертельное падение."
ko = "반드시 나무 판자에서만 뛰어내리세요. 땅에 닿기 전에 순간이동으로 돌아옵니다. 다른 곳에서 뛰어내리면 추락사합니다."
zh_cn = "只能从木板上跳下：落地前你会被传送回去。从其他任何地方跳下都会摔死。"
zh_tw = "只能從木板上跳下：落地前你會被傳送回去。從其他任何地方跳下都會摔死。"

# Test of Endurance: one crate is enough to bring the boss with the last wave; each extra crate
# adds waves of silencing harpies.
[[note]]
quest = 1150
phase = "objective"
objective = 1
level = "warning"
en = "Break only one {object:20447}: it starts about four waves of harpies that silence, and {npc:4490} comes with the last one. Breaking more only adds waves."
fr = "Ne cassez qu'une seule caisse de {object:20447} : elle déclenche environ quatre vagues de harpies qui réduisent au silence, et {npc:4490} arrive avec la dernière. En casser plus ne fait qu'ajouter des vagues."
de = "Zerbrich nur eine Kiste {object:20447}: sie löst etwa vier Wellen Harpyien aus, die zum Schweigen bringen, und {npc:4490} kommt mit der letzten. Mehr zu zerbrechen bringt nur mehr Wellen."
es = "Rompe solo una caja de {object:20447}: inicia unas cuatro oleadas de arpías que silencian, y {npc:4490} llega con la última. Romper más solo añade oleadas."
pt = "Quebre apenas uma caixa de {object:20447}: ela inicia cerca de quatro ondas de harpias que silenciam, e {npc:4490} vem com a última. Quebrar mais só adiciona ondas."
ru = "Разбейте только один ящик «{object:20447}»: это вызывает около четырёх волн гарпий, накладывающих немоту, и {npc:4490} приходит с последней. Если разбить больше, волн просто станет больше."
ko = "{object:20447}은(는) 하나만 부수세요. 침묵을 거는 하피가 약 네 차례 몰려오고, {npc:4490}은(는) 마지막 무리와 함께 나타납니다. 더 부수면 무리만 늘어납니다."
zh_cn = "只打破一个{object:20447}：它会引来约四波会沉默的鹰身人，{npc:4490}随最后一波出现。打破更多只会增加波数。"
zh_tw = "只打破一個{object:20447}：它會引來約四波會沉默的鷹身人，{npc:4490}隨最後一波出現。打破更多只會增加波數。"

# The Swarm Grows: Silithid Invaders spawn only in the cave, in place of Hive Drones; drones are social.
[[note]]
quest = 1147
phase = "objective"
objective = 3
level = "info"
en = "The {npc:4131} spawns only in the cave, taking the place of a {npc:4133}: when none are left, kill the drones inside to bring more. Drones call nearby silithids for help, so pull them away first."
fr = "L'{npc:4131} n'apparaît que dans la grotte, à la place d'un {npc:4133} : s'il n'en reste plus, tuez les bourdons à l'intérieur pour en faire venir d'autres. Les bourdons appellent les silithides proches à l'aide, attirez-les d'abord à l'écart."
de = "Der {npc:4131} erscheint nur in der Höhle, anstelle einer {npc:4133}: Sind keine mehr da, töte die Drohnen drinnen, damit neue erscheinen. Drohnen rufen nahe Silithiden zu Hilfe, also zieh sie zuerst weg."
es = "El {npc:4131} solo aparece en la cueva, en lugar de un {npc:4133}: si no queda ninguno, mata a los zánganos de dentro para que salgan más. Los zánganos piden ayuda a los silítidos cercanos, así que apártalos primero."
pt = "O {npc:4131} só surge na caverna, no lugar de um {npc:4133}: se não houver nenhum, mate os zangões lá dentro para que apareçam mais. Os zangões chamam os silitídeos próximos, então afaste-os primeiro."
ru = "{npc:4131} появляется только в пещере, на месте противника {npc:4133}: если их не осталось, убейте трутней внутри, чтобы появились новые. Трутни зовут на помощь ближайших силитидов, поэтому сначала выманивайте их в сторону."
ko = "{npc:4131}은(는) 동굴 안에서만 {npc:4133} 대신 나타납니다. 남은 것이 없으면 안의 일벌레를 처치해 새로 나타나게 하세요. 일벌레는 주변 실리시드를 불러 모으니 먼저 떨어진 곳으로 끌어내세요."
zh_cn = "{npc:4131}只会在洞穴里出现，取代{npc:4133}的位置：如果一个都没有了，就杀掉洞里的雄蜂让它们刷新。雄蜂会呼叫附近的异种虫帮忙，先把它们拉开。"
zh_tw = "{npc:4131}只會在洞穴裡出現，取代{npc:4133}的位置：如果一個都沒有了，就殺掉洞裡的雄蜂讓牠們重生。雄蜂會呼叫附近的異種蟲幫忙，先把牠們拉開。"

# Test of Lore (the book): the book lies deep in the Dor'Danil Barrow Den, reached by an easily missed side path in the first large cavern.
[[note]]
quest = 1154
phase = "objective"
objective = 1
level = "info"
en = "In the Dor'Danil Barrow Den in Ashenvale, take the easy-to-miss path down on the left as you enter the first large cavern. {object:20725} lies on a table on a raised platform in the next cavern."
fr = "Dans le Refuge de Dor'danil en Orneval, prenez le chemin facile à manquer qui descend sur la gauche en entrant dans la première grande caverne. {object:20725} est posé sur une table, sur une plateforme surélevée dans la caverne suivante."
de = "Nimm im Hügelgrab von Dor'danil im Eschental beim Betreten der ersten großen Kaverne den leicht zu übersehenden Weg links nach unten. {object:20725} liegt in der nächsten Kaverne auf einem Tisch auf einer erhöhten Plattform."
es = "En la Guarida de Dor'danil en Vallefresno, toma el camino que baja a la izquierda, fácil de pasar por alto, al entrar en la primera gran caverna. {object:20725} está sobre una mesa en una plataforma elevada de la caverna siguiente."
pt = "No Túmulo de Dor'Danil, em Vale Gris, pegue o caminho fácil de perder que desce à esquerda ao entrar na primeira grande caverna. {object:20725} está sobre uma mesa numa plataforma elevada na caverna seguinte."
ru = "В кургане Дор'данил в Ясеневом лесу, войдя в первый большой зал, спуститесь по незаметной тропе слева. {object:20725} лежит на столе на возвышении в следующем зале."
ko = "잿빛 골짜기의 도르다닐 무덤굴에서 첫 번째 큰 동굴에 들어서자마자 왼쪽 아래로 이어지는 눈에 잘 띄지 않는 길로 가세요. {object:20725}은(는) 다음 동굴의 높은 단 위 탁자에 놓여 있습니다."
zh_cn = "在灰谷的多达尼尔巢穴，进入第一个大洞窟时走左边那条不起眼的下坡小路。{object:20725}放在下一个洞窟中高台上的桌子上。"
zh_tw = "在梣谷的多達尼爾巢穴，進入第一個大洞窟時走左邊那條不起眼的下坡小路。{object:20725}放在下一個洞窟中高台上的桌子上。"

# Test of Lore (the question): the answer is Neltharion; a wrong answer teleports the player away, and completing needs a second talk.
[[note]]
quest = 6627
phase = "objective"
objective = 1
level = "warning"
en = "The question asks which Aspect became Deathwing: answer Neltharion. A wrong answer teleports you to Camp Taurajo. Then talk to {npc:4489} again and pick the quest line, not an answer, to complete it."
fr = "La question demande quel Aspect est devenu Aile-de-mort : répondez Neltharion. Une mauvaise réponse vous téléporte au camp Taurajo. Parlez ensuite de nouveau à {npc:4489} et choisissez la ligne de la quête, pas une réponse, pour la terminer."
de = "Die Frage lautet, welcher Aspekt zu Todesschwinge wurde: Antworte Neltharion. Eine falsche Antwort teleportiert dich zum Lager Taurajo. Sprich danach erneut mit {npc:4489} und wähle die Questzeile, keine Antwort, um sie abzuschließen."
es = "La pregunta es qué Aspecto se convirtió en Alamuerte: responde Neltharion. Una respuesta incorrecta te teletransporta al Campamento Taurajo. Luego habla otra vez con {npc:4489} y elige la línea de la misión, no una respuesta, para completarla."
pt = "A pergunta é qual Aspecto se tornou Asa da Morte: responda Neltharion. Uma resposta errada teleporta você para o Acampamento Taurajo. Depois fale de novo com {npc:4489} e escolha a linha da missão, não uma resposta, para concluí-la."
ru = "Вопрос: какой из Аспектов стал Смертокрылом? Отвечайте «Нелтарион». Неверный ответ телепортирует вас в лагерь Таурахо. Затем снова поговорите с {npc:4489} и выберите строку задания, а не ответ, чтобы его завершить."
ko = "질문은 어느 위상이 데스윙이 되었는가입니다. 넬타리온이라고 답하세요. 틀리면 타우라조 야영지로 순간이동됩니다. 그다음 {npc:4489}에게 다시 말을 걸어 답이 아닌 퀘스트 항목을 골라 완료하세요."
zh_cn = "问题是哪位守护巨龙变成了死亡之翼：回答耐萨里奥。答错会被传送到陶拉祖营地。之后再和{npc:4489}对话，选择任务选项而不是答案来完成任务。"
zh_tw = "問題是哪位守護巨龍變成了死亡之翼：回答奈薩里奧。答錯會被傳送到陶拉祖營地。之後再和{npc:4489}對話，選擇任務選項而不是答案來完成任務。"

# Arikara: lighting the Sacred Fire of Life with the powder is what summons the elite serpent.
[[note]]
quest = 5088
phase = "objective"
objective = 1
level = "info"
en = "Using {item:12785} at {object:175944} on Darkcloud Pinnacle summons {npc:10882}, an elite: clear the plateau and be at full health before you light it."
fr = "Utiliser {item:12785} sur {object:175944} au pic de Sombrenuage invoque {npc:10882}, un élite : nettoyez le plateau et soyez au maximum de vos points de vie avant de l'allumer."
de = "Wenn du {item:12785} am {object:175944} auf dem Dunkelwolkengipfel benutzt, wird {npc:10882} beschworen, ein Elite: Räume das Plateau und sei bei voller Gesundheit, bevor du es entzündest."
es = "Usar {item:12785} en {object:175944} en el Pináculo Nubenegra invoca a {npc:10882}, un élite: limpia la meseta y ten la salud al máximo antes de encenderlo."
pt = "Usar {item:12785} em {object:175944} no Pináculo Nuvem Negra invoca {npc:10882}, um elite: limpe o platô e esteja com a vida cheia antes de acendê-lo."
ru = "Применение {item:12785} у {object:175944} на пике Темного Облака призывает {npc:10882} – элитного противника: зачистите плато и восстановите здоровье, прежде чем разжигать огонь."
ko = "먹구름 봉우리의 {object:175944}에 {item:12785}을(를) 사용하면 정예인 {npc:10882}이(가) 소환됩니다. 불을 붙이기 전에 고원을 정리하고 생명력을 가득 채우세요."
zh_cn = "在黑云峰的{object:175944}使用{item:12785}会召唤精英{npc:10882}：点燃之前先清理平台，并把生命值回满。"
zh_tw = "在黑雲峰的{object:175944}使用{item:12785}會召喚精英{npc:10882}：點燃之前先清理平台，並把生命值回滿。"

# Keeping Pace: Rizzle leaves his hut only briefly after Zamek's explosion; the plans must be opened at once, and they hand out an ore sample that needs a free bag slot.
[[note]]
quest = 1190
phase = "objective"
level = "warning"
en = "Wait inside {npc:4720}'s hut by the plans: he runs out when {npc:4709}'s bomb goes off and soon comes back. Open the plans at once, with a free bag slot; if he returns first, ask for another explosion."
fr = "Attendez dans la cabane de {npc:4720}, près des plans : il sort en courant quand la bombe de {npc:4709} explose et revient vite. Ouvrez les plans aussitôt, avec un emplacement de sac libre ; s'il revient avant, demandez une nouvelle explosion."
de = "Warte in der Hütte von {npc:4720} bei den Plänen: Er rennt hinaus, wenn die Bombe von {npc:4709} hochgeht, und kommt bald zurück. Öffne die Pläne sofort, mit einem freien Taschenplatz; ist er vorher zurück, bitte um eine weitere Explosion."
es = "Espera dentro de la cabaña de {npc:4720}, junto a los planos: sale corriendo cuando estalla la bomba de {npc:4709} y vuelve pronto. Abre los planos enseguida, con un hueco libre en las bolsas; si vuelve antes, pide otra explosión."
pt = "Espere dentro da cabana de {npc:4720}, perto dos planos: ele sai correndo quando a bomba de {npc:4709} explode e logo volta. Abra os planos na hora, com um espaço livre na bolsa; se ele voltar antes, peça outra explosão."
ru = "Ждите в хижине {npc:4720} рядом с чертежами: когда взорвётся бомба {npc:4709}, он выбежит и скоро вернётся. Сразу откройте чертежи, имея свободное место в сумках; если он вернётся раньше, попросите о новом взрыве."
ko = "{npc:4720}의 오두막 안 설계도 옆에서 기다리세요. {npc:4709}의 폭탄이 터지면 밖으로 뛰어나갔다가 곧 돌아옵니다. 가방에 빈칸을 두고 즉시 설계도를 여세요. 그가 먼저 돌아오면 폭발을 다시 부탁하세요."
zh_cn = "在{npc:4720}小屋里的图纸旁边等着：{npc:4709}的炸弹一响他就会跑出去，很快又回来。立刻打开图纸，背包要留一个空位；如果他先回来了，就再请人引爆一次。"
zh_tw = "在{npc:4720}小屋裡的圖紙旁邊等著：{npc:4709}的炸彈一響他就會跑出去，很快又回來。立刻打開圖紙，背包要留一個空位；如果他先回來了，就再請人引爆一次。"

# The Sacred Flame: dousing the brazier consumes the phial; the hoof must be looted from that loot window or the phial is lost.
[[note]]
quest = 1197
phase = "objective"
objective = 1
level = "must_read"
en = "Dousing {object:20807} uses up {item:5868} and opens a loot window: take {item:5869} at once. Closing it or being interrupted before looting loses the phial, and you will need a new one."
fr = "Éteindre le {object:20807} consomme la {item:5868} et ouvre une fenêtre de butin : prenez aussitôt le {item:5869}. La fermer ou être interrompu avant de le ramasser fait perdre la fiole, et il vous en faudra une nouvelle."
de = "Das Löschen der {object:20807} verbraucht die {item:5868} und öffnet ein Beutefenster: Nimm sofort den {item:5869}. Schließt du es oder wirst vorher unterbrochen, ist die Phiole weg und du brauchst eine neue."
es = "Apagar el {object:20807} gasta la {item:5868} y abre una ventana de botín: coge la {item:5869} enseguida. Si la cierras o te interrumpen antes de cogerla, pierdes la ampolla y necesitarás otra."
pt = "Apagar o {object:20807} gasta o {item:5868} e abre uma janela de saque: pegue o {item:5869} na hora. Fechá-la ou ser interrompido antes de saquear faz perder o frasco, e você vai precisar de outro."
ru = "Тушение предмета «{object:20807}» расходует {item:5868} и открывает окно добычи: сразу заберите {item:5869}. Если закрыть его или прерваться до этого, фиал будет потерян и понадобится новый."
ko = "{object:20807}을(를) 끄면 {item:5868}이(가) 소모되고 전리품 창이 열리니 바로 {item:5869}을(를) 챙기세요. 줍기 전에 창을 닫거나 방해받으면 약병을 잃어 새로 구해야 합니다."
zh_cn = "熄灭{object:20807}会消耗{item:5868}并打开拾取窗口：立刻拿走{item:5869}。拾取前关闭窗口或被打断，瓶子就没了，需要再弄一个。"
zh_tw = "熄滅{object:20807}會消耗{item:5868}並打開拾取視窗：立刻拿走{item:5869}。拾取前關閉視窗或被打斷，瓶子就沒了，需要再弄一個。"

# Stop the Screeching (Forever): all three harpy kinds are in one cave that respawns fast and
# pulls in packs.
[[note]]
quest = 98070
level = "warning"
editions = ["forever"]
en = "All three harpies are in the cave entered near 27.5, 49.5; inside they respawn fast and four or five easily join a fight. Pull carefully or bring a group."
fr = "Les trois harpies se trouvent dans la grotte dont l'entrée est vers 27.5, 49.5 ; à l'intérieur, elles réapparaissent vite et quatre ou cinq rejoignent facilement un combat. Attirez-les prudemment ou venez en groupe."
de = "Alle drei Harpyien sind in der Höhle mit Eingang bei etwa 27.5, 49.5; drinnen respawnen sie schnell und vier oder fünf mischen sich leicht in einen Kampf ein. Zieh vorsichtig oder komm mit einer Gruppe."
es = "Las tres arpías están en la cueva con entrada cerca de 27.5, 49.5; dentro reaparecen rápido y cuatro o cinco se unen fácilmente a un combate. Atrae con cuidado o ve en grupo."
pt = "As três harpias ficam na caverna com entrada perto de 27.5, 49.5; lá dentro renascem rápido e quatro ou cinco entram facilmente numa luta. Puxe com cuidado ou venha em grupo."
ru = "Все три вида гарпий в пещере с входом около 27.5, 49.5; внутри они быстро возрождаются, и четыре-пять легко вмешиваются в бой. Выманивайте осторожно или идите группой."
ko = "세 하피 모두 입구가 약 27.5, 49.5인 동굴 안에 있습니다. 안에서는 빨리 재생성되고 네다섯 마리가 쉽게 전투에 끼어듭니다. 조심해서 끌거나 파티로 가세요."
zh_cn = "三种鹰身人都在入口约27.5, 49.5的洞穴里；洞内重生很快，很容易一次引来四五只。小心拉怪或组队前往。"
zh_tw = "三種鷹身人都在入口約27.5, 49.5的洞穴裡；洞內重生很快，很容易一次引來四五隻。小心拉怪或組隊前往。"
