# Seeking Refuge: the escort NPC waits at the top of the tower past fast-respawning enemies; while someone escorts him he is gone up to about ten minutes.
[[note]]
quest = 99144
phase = "accept"
level = "warning"
editions = ["forever"]
en = "{npc:275954} waits at the top of the tower, past enemies that respawn quickly. If he is not there, someone is escorting him: he comes back a few minutes later (up to about 10)."
fr = "{npc:275954} attend au sommet de la tour, après des ennemis qui réapparaissent vite. S'il n'y est pas, quelqu'un l'escorte : il revient quelques minutes plus tard (jusqu'à 10 environ)."
de = "{npc:275954} wartet oben auf dem Turm, hinter Gegnern mit schnellem Respawn. Ist er nicht da, eskortiert ihn gerade jemand: er kommt ein paar Minuten später zurück (bis etwa 10)."
es = "{npc:275954} espera en lo alto de la torre, tras enemigos que reaparecen rápido. Si no está, alguien lo está escoltando: vuelve unos minutos después (hasta unos 10)."
pt = "{npc:275954} espera no alto da torre, depois de inimigos que reaparecem rápido. Se ele não estiver lá, alguém o está escoltando: ele volta alguns minutos depois (até uns 10)."
ru = "{npc:275954} ждёт на вершине башни, за врагами, которые быстро возрождаются. Если его нет, кто-то его сопровождает: он вернётся через несколько минут (до 10)."
ko = "{npc:275954}은(는) 빠르게 재생성되는 적들을 지나 탑 꼭대기에서 기다립니다. 없다면 누군가 그를 호위하는 중이니 몇 분 뒤(최대 약 10분)에 돌아옵니다."
zh_cn = "{npc:275954}在塔顶等候，途中的敌人刷新很快。如果他不在，说明有人正在护送他：几分钟后（最多约10分钟）他会回来。"
zh_tw = "{npc:275954}在塔頂等候，途中的敵人重生很快。如果他不在，表示有人正在護送他：幾分鐘後（最多約10分鐘）他會回來。"
