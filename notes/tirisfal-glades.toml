# A Lesson in Divinity (resurrect Falgan, Forever): the resurrected deathguard dies again after a
# while for the next paladin; a lost symbol means a new one from Danitha Morr.
[[note]]
quest = 94438
phase = "turnin"
level = "warning"
editions = ["forever"]
en = "Turn the quest in to Deathguard Falgan right after resurrecting him: he soon dies again, and a new {item:6866} means walking back to Danitha Morr at Bandarion Keep."
fr = "Rendez la quête au Garde-mort Falgan juste après l'avoir ressuscité : il meurt de nouveau peu après, et un nouveau {item:6866} oblige à retourner voir Danitha Morr au donjon de Bandarion."
de = "Gib die Quest bei Todeswache Falgan gleich nach seiner Wiederbelebung ab: Er stirbt bald wieder, und ein neues {item:6866} heißt, zurück zu Danitha Morr in der Bandarionfeste zu laufen."
es = "Entrega la misión al Guardia de la Muerte Falgan justo después de resucitarlo: vuelve a morir pronto, y un nuevo {item:6866} supone volver a pie hasta Danitha Morr en el Bastión de Bandarion."
pt = "Entregue a missão ao Guarda da Morte Falgan logo depois de ressuscitá-lo: ele morre de novo em pouco tempo, e um novo {item:6866} exige voltar até Danitha Morr na Fortaleza Bandarion."
ru = "Сдайте задание стражнику смерти Фальгану сразу после воскрешения: вскоре он снова умирает, а за новым предметом {item:6866} придётся идти обратно к Даните Морр в крепость Бандарион."
ko = "죽음의 경비병 팔간을 되살린 직후 바로 퀘스트를 완료하세요. 곧 다시 죽으며, {item:6866}을(를) 새로 받으려면 반다리온 요새의 다니타 모르에게 걸어 돌아가야 합니다."
zh_cn = "复活亡灵卫兵法尔甘后立即交任务：他很快会再次死去，而重新获取{item:6866}需要走回班达瑞恩要塞找达妮莎·莫尔。"
zh_tw = "復活亡靈衛兵法爾甘後立即交任務：他很快會再次死去，而重新取得{item:6866}需要走回班達瑞恩要塞找達妮莎·莫爾。"

# A Frightened Request (Forever): the objective completes by standing next to Edward's body in the
# walled graveyard where Rath'mael is, once its mobs are cleared; nothing is clicked.
[[note]]
quest = 92401
phase = "objective"
level = "warning"
editions = ["forever"]
en = "{npc:250842} lies dead inside the walled graveyard next to {npc:250657}: clear the mobs there and stand beside his body. There is nothing to click."
fr = "{npc:250842} gît mort dans le cimetière clos, près de {npc:250657} : éliminez les monstres sur place et tenez-vous à côté de son corps. Il n'y a rien à cliquer."
de = "{npc:250842} liegt tot im ummauerten Friedhof neben {npc:250657}: Räume die Gegner dort und stell dich neben seine Leiche. Es gibt nichts anzuklicken."
es = "{npc:250842} yace muerto dentro del cementerio amurallado junto a {npc:250657}: limpia los enemigos y quédate junto a su cuerpo. No hay nada que pulsar."
pt = "{npc:250842} jaz morto dentro do cemitério murado ao lado de {npc:250657}: elimine os inimigos e fique ao lado do corpo dele. Não há nada para clicar."
ru = "{npc:250842} лежит мёртвым на огороженном кладбище рядом с {npc:250657}: перебейте там противников и встаньте рядом с его телом. Нажимать ничего не нужно."
ko = "{npc:250842}은(는) {npc:250657} 옆 담장 두른 묘지 안에 죽은 채 누워 있습니다. 그곳의 적을 처치하고 시신 옆에 서세요. 클릭할 것은 없습니다."
zh_cn = "{npc:250842}死在{npc:250657}旁边的围墙墓地里：清掉那里的怪物，站到他的尸体旁即可，无需点击任何东西。"
zh_tw = "{npc:250842}死在{npc:250657}旁邊的圍牆墓地裡：清掉那裡的怪物，站到他的屍體旁即可，無需點擊任何東西。"

