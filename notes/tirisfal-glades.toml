# Quest notes of Tirisfal Glades. See notes/README.md for the format.

# At War With The Scarlet Crusade (Melrache): the tower can be reached over the ridge from the
# west, avoiding the Scarlet camps that line the path up from the road.
[[note]]
quest = 372
phase = "objective"
level = "info"
en = "Reach the tower from its western tip (about 77,30), away from the path, to skip most of the Scarlet camps along the road."
fr = "Rejoignez la tour par sa pointe ouest (vers 77,30), à l'écart du chemin, pour éviter la plupart des camps écarlates le long de la route."
de = "Erreiche den Turm über seine Westspitze (etwa 77,30), abseits des Weges, um die meisten Lager des Scharlachroten Kreuzzugs an der Straße zu umgehen."
es = "Llega a la torre por su extremo oeste (sobre 77,30), lejos del camino, para evitar la mayoría de los campamentos Escarlata de la ruta."
pt = "Chegue à torre pela ponta oeste (perto de 77,30), longe do caminho, para evitar a maioria dos acampamentos Escarlates ao longo da estrada."
ru = "Подходите к башне с западной оконечности (около 77,30), в стороне от тропы, чтобы обойти большинство лагерей Алого ордена вдоль дороги."
ko = "길에서 벗어나 서쪽 끝(약 77,30)에서 탑으로 다가가면 길가의 붉은십자군 야영지 대부분을 피할 수 있습니다."
zh_cn = "离开小路，从西端（约77,30）接近塔楼，可以避开路边大部分血色十字军营地。"
zh_tw = "離開小路，從西端（約77,30）接近塔樓，可以避開路邊大部分血色十字軍營地。"

# The Family Crypt: three floors of hard-hitting undead with patrols and fast respawns; the
# captain waits in the lowest room.
[[note]]
quest = 408
phase = "objective"
level = "warning"
en = "The crypt's undead hit hard, respawn quickly and patrols join fights: wait for each patrol to pass, then pull one at a time. {npc:1658} is on the bottom floor."
fr = "Les morts-vivants de la crypte frappent fort, réapparaissent vite et des patrouilles se joignent aux combats : attendez que chaque patrouille passe, puis attirez-les un par un. {npc:1658} est à l'étage le plus bas."
de = "Die Untoten der Gruft schlagen hart zu, respawnen schnell und Patrouillen mischen sich in Kämpfe ein: warte, bis jede Patrouille vorbei ist, und zieh sie dann einzeln. {npc:1658} ist auf der untersten Ebene."
es = "Los no-muertos de la cripta golpean fuerte, reaparecen rápido y las patrullas se unen a los combates: espera a que pase cada patrulla y atráelos de uno en uno. {npc:1658} está en el piso más bajo."
pt = "Os mortos-vivos da cripta batem forte, renascem rápido e as patrulhas entram nas lutas: espere cada patrulha passar e puxe-os um de cada vez. {npc:1658} fica no andar mais baixo."
ru = "Нежить в склепе бьёт больно, быстро возрождается, а патрули вмешиваются в бой: дождитесь, пока пройдёт патруль, и выманивайте по одному. {npc:1658} на самом нижнем ярусе."
ko = "묘지의 언데드는 강하게 때리고 빨리 재생성되며, 순찰병이 전투에 끼어듭니다. 순찰병이 지나가길 기다렸다가 하나씩 끌어내세요. {npc:1658}은(는) 가장 아래층에 있습니다."
zh_cn = "墓穴里的亡灵攻击很高、重生很快，巡逻怪还会加入战斗：等巡逻过去后再逐个拉怪。{npc:1658}在最底层。"
zh_tw = "墓穴裡的不死生物攻擊很高、重生很快，巡邏怪還會加入戰鬥：等巡邏過去後再逐個拉怪。{npc:1658}在最底層。"

# A Plague Upon Thee (barrel): placing the barrel only does half; clicking the smoking barrel offers the follow-up that is turned in at the Bulwark.
[[note]]
quest = 5902
phase = "objective"
level = "warning"
en = "Click the crate in the middle of the mill to set the barrel on it, then click the smoking barrel itself: it offers {quest:6390}, the step that sends you back to the quest giver."
fr = "Cliquez sur la caisse au centre de la scierie pour y poser le tonneau, puis cliquez sur le tonneau fumant lui-même : il propose {quest:6390}, l'étape qui vous renvoie au donneur de quête."
de = "Klicke die Kiste in der Mitte der Sägemühle an, um das Fass daraufzustellen, und dann das rauchende Fass selbst: Es bietet {quest:6390} an, den Schritt, der dich zum Auftraggeber zurückschickt."
es = "Haz clic en la caja del centro del aserradero para dejar el barril encima y luego en el propio barril humeante: ofrece {quest:6390}, el paso que te devuelve a quien te dio la misión."
pt = "Clique no caixote no meio da serraria para pôr o barril em cima e depois no próprio barril fumegante: ele oferece {quest:6390}, a etapa que leva você de volta a quem deu a missão."
ru = "Щёлкните по ящику в центре лесопилки, чтобы поставить на него бочку, затем по самой дымящейся бочке: она предложит {quest:6390} — этап, который возвращает вас к тому, кто выдал задание."
ko = "제재소 한가운데 상자를 클릭해 통을 올려놓은 뒤, 연기가 나는 통 자체를 클릭하세요. {quest:6390}을(를) 받을 수 있으며, 이 단계로 퀘스트를 준 NPC에게 돌아갑니다."
zh_cn = "点击伐木场中央的箱子把桶放上去，然后再点击冒烟的桶本身：它会提供{quest:6390}，也就是带你回去找任务发布者的那一步。"
zh_tw = "點擊伐木場中央的箱子把桶放上去，然後再點擊冒煙的桶本身：它會提供{quest:6390}，也就是帶你回去找任務發布者的那一步。"

# Proving Allegiance: the candle comes from the crate beside the quest giver, and another one can be taken after a failed fight.
[[note]]
quest = 409
phase = "objective"
objective = 1
level = "info"
en = "Take {item:3080} from {object:1586} beside {npc:1497}, then use it at the altar on the small island to summon {npc:1946}. She hits hard: if she kills you, take another candle from the crate and try again."
fr = "Prenez une {item:3080} dans la {object:1586} à côté de {npc:1497}, puis utilisez-la sur l'autel de la petite île pour invoquer {npc:1946}. Elle frappe fort : si elle vous tue, reprenez une bougie dans la caisse et recommencez."
de = "Nimm eine {item:3080} aus der {object:1586} neben {npc:1497} und benutze sie am Altar auf der kleinen Insel, um {npc:1946} zu beschwören. Sie schlägt hart zu: Tötet sie dich, nimm eine neue Kerze aus der Kiste und versuch es noch einmal."
es = "Coge una {item:3080} del {object:1586} junto a {npc:1497} y úsala en el altar de la isla pequeña para invocar a {npc:1946}. Golpea fuerte: si te mata, coge otra vela del cajón y vuelve a intentarlo."
pt = "Pegue uma {item:3080} no {object:1586} ao lado de {npc:1497} e use-a no altar da ilhota para invocar {npc:1946}. Ela bate forte: se ela matar você, pegue outra vela no caixote e tente de novo."
ru = "Возьмите {item:3080} из предмета «{object:1586}» рядом с {npc:1497} и используйте её у алтаря на маленьком острове, чтобы призвать {npc:1946}. Она бьёт сильно: если она вас убьёт, возьмите из ящика новую свечу и попробуйте снова."
ko = "{npc:1497} 옆의 {object:1586}에서 {item:3080}을(를) 꺼내 작은 섬의 제단에서 사용하면 {npc:1946}이(가) 소환됩니다. 공격이 강하니, 죽으면 상자에서 양초를 다시 꺼내 재도전하세요."
zh_cn = "从{npc:1497}旁边的{object:1586}中拿一支{item:3080}，然后在小岛上的祭坛使用它召唤{npc:1946}。她攻击很猛：如果被她杀死，就从箱子里再拿一支蜡烛重试。"
zh_tw = "從{npc:1497}旁邊的{object:1586}中拿一支{item:3080}，然後在小島上的祭壇使用它召喚{npc:1946}。她攻擊很猛：如果被她殺死，就從箱子裡再拿一支蠟燭重試。"
