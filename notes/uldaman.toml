# Quest notes of Uldaman. See notes/README.md for the format.

# Reclaimed Treasures: the Horde chest is in a side room of the outer cave, not inside the instance; the big hall's chest is the Alliance one.
[[note]]
quest = 2342
phase = "objective"
objective = 1
level = "info"
en = "The {object:124388} is outside the instance: from the cavern with the portal, take the tunnel along the west wall to a small trogg room; the chest is behind a pillar at the back. The chest in the larger trogg hall belongs to an Alliance quest."
fr = "Le {object:124388} est hors de l'instance : depuis la caverne du portail, prenez le tunnel le long du mur ouest jusqu'à une petite salle de troggs ; le coffre est derrière un pilier au fond. Celui de la grande salle des troggs sert à une quête de l'Alliance."
de = "Die {object:124388} liegt außerhalb der Instanz: Nimm in der Höhle mit dem Portal den Tunnel an der Westwand zu einem kleinen Troggraum; die Truhe steht hinten hinter einer Säule. Die Truhe in der größeren Trogghalle gehört zu einer Allianzquest."
es = "El {object:124388} está fuera de la instancia: desde la caverna del portal, toma el túnel de la pared oeste hasta una pequeña sala de troggs; el cofre está tras un pilar al fondo. El cofre de la sala grande de troggs es de una misión de la Alianza."
pt = "O {object:124388} fica fora da instância: da caverna do portal, pegue o túnel junto à parede oeste até uma pequena sala de troggs; o baú está atrás de um pilar no fundo. O baú do salão maior de troggs é de uma missão da Aliança."
ru = "«{object:124388}» находится вне подземелья: из пещеры с порталом пройдите по туннелю у западной стены в небольшой зал троггов; сундук стоит за колонной в глубине. Сундук в большом зале троггов — для задания Альянса."
ko = "{object:124388}은(는) 던전 밖에 있습니다. 입구가 있는 동굴에서 서쪽 벽을 따라 난 굴로 들어가 작은 트로그 방으로 가세요. 상자는 안쪽 기둥 뒤에 있습니다. 더 큰 트로그 홀의 상자는 얼라이언스 퀘스트용입니다."
zh_cn = "{object:124388}在副本外：从副本入口所在的洞穴沿西墙的隧道走到一间小的穴居人房间，箱子在最里面的柱子后面。较大的穴居人大厅里的箱子是联盟任务用的。"
zh_tw = "{object:124388}在副本外：從副本入口所在的洞穴沿西牆的隧道走到一間小的穴居人房間，箱子在最裡面的柱子後面。較大的穴居人大廳裡的箱子是聯盟任務用的。"

# Solution to Doom: the tablet's chest is in the outer caves before the dungeon portal, along the dwarf side.
[[note]]
quest = 709
phase = "objective"
objective = 1
level = "info"
en = "The chest with {item:4631} is in the outer caves, not in the dungeon. In the big cave with the portal, stay on the upper path instead of dropping down, take the tunnel on the left and follow the dwarves, not the troggs."
fr = "Le coffre contenant {item:4631} est dans les grottes extérieures, pas dans le donjon. Dans la grande grotte du portail, restez sur le chemin du haut au lieu de sauter, prenez le tunnel de gauche et suivez les nains, pas les troggs."
de = "Die Truhe mit {item:4631} steht in den äußeren Höhlen, nicht im Dungeon. Bleib in der großen Höhle mit dem Portal auf dem oberen Weg statt hinunterzuspringen, nimm den linken Tunnel und folge den Zwergen, nicht den Troggs."
es = "El cofre con {item:4631} está en las cuevas exteriores, no en la mazmorra. En la gran cueva del portal, sigue por el camino de arriba en vez de bajar, toma el túnel de la izquierda y sigue a los enanos, no a los troggs."
pt = "O baú com {item:4631} fica nas cavernas externas, não na masmorra. Na caverna grande do portal, siga pelo caminho de cima em vez de descer, pegue o túnel da esquerda e siga os anões, não os troggs."
ru = "Сундук с {item:4631} находится во внешних пещерах, а не в подземелье. В большой пещере с порталом не спрыгивайте вниз, а идите по верхней тропе, сверните в левый туннель и следуйте за дворфами, а не за троггами."
ko = "{item:4631}가 든 상자는 던전 안이 아니라 바깥 동굴에 있습니다. 입구가 있는 큰 동굴에서 아래로 뛰어내리지 말고 위쪽 길을 따라가다 왼쪽 터널로 들어가, 트로그가 아닌 드워프 쪽으로 가세요."
zh_cn = "装有{item:4631}的箱子在外围洞穴，不在副本里。在有传送门的大洞穴中，不要跳下去，沿上层小路走，进入左边的隧道，跟着矮人走，而不是穴居人。"
zh_tw = "裝有{item:4631}的箱子在外圍洞穴，不在副本裡。在有傳送門的大洞穴中，不要跳下去，沿上層小路走，進入左邊的隧道，跟著矮人走，而不是穴居人。"

# The Platinum Discs: the lecture, the turn-in and the next quest all happen in the treasure room; leaving it first means clearing the dungeon again.
[[note]]
quest = 2278
phase = "objective"
objective = 1
level = "must_read"
en = "After clicking {object:131474}, talk to {npc:7172} through his whole speech, then click the discs again to finish and take the next quest. Do it all before leaving the room: once outside, you must clear the dungeon again."
fr = "Après avoir cliqué sur {object:131474}, parlez à {npc:7172} jusqu'au bout de son discours, puis cliquez de nouveau sur les disques pour terminer et prendre la quête suivante. Faites tout avant de quitter la salle : une fois sorti, il faut refaire le donjon."
de = "Nachdem du {object:131474} angeklickt hast, sprich mit {npc:7172} bis zum Ende seiner Rede und klicke dann erneut auf die Scheiben, um abzuschließen und die nächste Quest anzunehmen. Erledige alles, bevor du den Raum verlässt: Danach musst du den Dungeon erneut säubern."
es = "Tras hacer clic en {object:131474}, habla con {npc:7172} hasta el final de su discurso y vuelve a hacer clic en los discos para terminar y aceptar la siguiente misión. Hazlo todo antes de salir de la sala: una vez fuera, tendrás que limpiar la mazmorra otra vez."
pt = "Depois de clicar em {object:131474}, fale com {npc:7172} até o fim do discurso e clique de novo nos discos para concluir e pegar a próxima missão. Faça tudo antes de sair da sala: depois de sair, você terá de limpar a masmorra de novo."
ru = "Щёлкнув по {object:131474}, выслушайте {npc:7172} до конца, затем снова щёлкните по дискам, чтобы завершить задание и взять следующее. Сделайте всё, не выходя из зала: выйдя, придётся проходить подземелье заново."
ko = "{object:131474}를 클릭한 뒤 {npc:7172}의 이야기를 끝까지 듣고, 다시 원반을 클릭해 퀘스트를 완료하고 다음 퀘스트를 받으세요. 방을 나가기 전에 모두 끝내야 합니다. 나가면 던전을 다시 돌아야 합니다."
zh_cn = "点击{object:131474}后，与{npc:7172}对话直到他讲完，再次点击圆盘完成任务并接下一个任务。离开房间前全部做完：出去之后就得重新清一遍副本。"
zh_tw = "點擊{object:131474}後，與{npc:7172}對話直到他講完，再次點擊圓盤完成任務並接下一個任務。離開房間前全部做完：出去之後就得重新清一遍副本。"

# A Sign of Hope: Hammertoe Grez kneels in a side cave of the outer tunnels before the drop to the instance; he can be killed or leave after the next step, then respawns.
[[note]]
quest = 721
phase = "turnin"
level = "warning"
en = "{npc:2909} kneels by a campfire behind crates in a small side cave, just before the ledge you drop from to reach the instance door. If he is not there, wait: he comes back after about 6 minutes."
fr = "{npc:2909} est agenouillé près d'un feu de camp, derrière des caisses, dans une petite grotte latérale, juste avant la corniche d'où l'on saute vers l'entrée de l'instance. S'il n'est pas là, attendez : il revient au bout d'environ 6 minutes."
de = "{npc:2909} kniet an einem Lagerfeuer hinter Kisten in einer kleinen Seitenhöhle, kurz vor dem Felsvorsprung, von dem du zum Instanzeingang hinunterspringst. Ist er nicht da, warte: Er kommt nach etwa 6 Minuten zurück."
es = "{npc:2909} está arrodillado junto a una hoguera, tras unas cajas, en una pequeña cueva lateral, justo antes de la cornisa desde la que saltas a la entrada de la instancia. Si no está, espera: vuelve en unos 6 minutos."
pt = "{npc:2909} fica ajoelhado junto a uma fogueira, atrás de caixotes, numa pequena caverna lateral, logo antes da borda de onde você pula para a entrada da instância. Se ele não estiver lá, espere: ele volta em cerca de 6 minutos."
ru = "{npc:2909} стоит на коленях у костра за ящиками в небольшой боковой пещере, прямо перед уступом, с которого спрыгивают к входу в подземелье. Если его нет, подождите: он появляется снова примерно через 6 минут."
ko = "{npc:2909}은(는) 인스턴스 입구로 뛰어내리는 바위 턱 바로 앞, 작은 곁굴의 상자 뒤 모닥불 옆에 무릎을 꿇고 있습니다. 보이지 않으면 기다리세요. 약 6분 뒤에 다시 나타납니다."
zh_cn = "{npc:2909}跪在一个小侧洞里的篝火旁，躲在箱子后面，就在跳下去前往副本入口的岩架之前。如果他不在，请等待：大约6分钟后会重新出现。"
zh_tw = "{npc:2909}跪在一個小側洞裡的營火旁，躲在箱子後面，就在跳下去前往副本入口的岩架之前。如果他不在，請等待：大約6分鐘後會重新出現。"
