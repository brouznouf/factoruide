# All Along the Watchtowers (Alliance): the torch has a cooldown and cannot be used in combat; beside the door the elite inside has no line of sight.
[[note]]
quest = 5097
phase = "objective"
level = "warning"
en = "{item:12815} cannot be used in combat and has a 2-minute cooldown: stand against the wall right beside each tower's door, out of sight of the elite inside, and use it from there."
fr = "{item:12815} ne s'utilise pas en combat et a un temps de recharge de 2 minutes : collez-vous au mur juste à côté de la porte de chaque tour, hors de vue de l'élite à l'intérieur, et utilisez-la de là."
de = "{item:12815} ist im Kampf nicht benutzbar und hat 2 Minuten Abklingzeit: Stell dich direkt neben die Tür jedes Turms an die Wand, außer Sicht des Elite-Gegners drinnen, und benutze sie von dort."
es = "{item:12815} no se puede usar en combate y tiene 2 minutos de reutilización: pégate a la pared justo al lado de la puerta de cada torre, fuera de la vista del élite de dentro, y úsala desde ahí."
pt = "{item:12815} não pode ser usada em combate e tem 2 minutos de recarga: encoste na parede logo ao lado da porta de cada torre, fora da vista do elite lá dentro, e use-a dali."
ru = "{item:12815} нельзя использовать в бою, а перезарядка — 2 минуты: встаньте у стены сразу рядом с дверью каждой башни, вне поля зрения элитного противника внутри, и используйте его оттуда."
ko = "{item:12815}은(는) 전투 중 사용할 수 없고 재사용 대기시간이 2분입니다. 각 탑 문 바로 옆 벽에 붙어 안쪽 정예 몹의 시야 밖에서 사용하세요."
zh_cn = "{item:12815}无法在战斗中使用，冷却时间2分钟：贴着每座塔门旁边的墙站，避开塔内精英怪的视线，在那里使用。"
zh_tw = "{item:12815}無法在戰鬥中使用，冷卻時間2分鐘：貼著每座塔門旁邊的牆站，避開塔內精英怪的視線，在那裡使用。"

