# Mercy Falls on Deaf Ears: the ears drop far more often at the Shrine of Akir than elsewhere; the Stormchasers heal themselves and each other.
[[note]]
quest = 93165
phase = "objective"
objective = 1
level = "warning"
editions = ["forever"]
en = "The ears drop rarely, far more often from the Al'Aketh at the Shrine of Akir. Stormchasers heal themselves and each other: interrupt them or pull one at a time."
fr = "Les oreilles tombent rarement, bien plus souvent sur les Al'Aketh du Shrine of Akir. Les Stormchasers se soignent eux-mêmes et entre eux : interrompez-les ou attirez-les un par un."
de = "Die Ohren fallen selten, viel häufiger bei den Al'Aketh am Shrine of Akir. Die Stormchasers heilen sich selbst und gegenseitig: unterbrich sie oder zieh sie einzeln."
es = "Las orejas caen pocas veces, mucho más a menudo de los Al'Aketh del Shrine of Akir. Los Stormchasers se curan a sí mismos y entre ellos: interrúmpelos o atráelos de uno en uno."
pt = "As orelhas caem raramente, bem mais vezes dos Al'Aketh no Shrine of Akir. Os Stormchasers curam a si mesmos e uns aos outros: interrompa-os ou puxe um de cada vez."
ru = "Уши выпадают редко, гораздо чаще с Al'Aketh у Shrine of Akir. Stormchasers лечат себя и друг друга: прерывайте их или выманивайте по одному."
ko = "귀는 드물게 떨어지며, Shrine of Akir의 Al'Aketh에게서 훨씬 자주 나옵니다. Stormchaser는 자신과 서로를 치유하니 차단하거나 하나씩 끌어오세요."
zh_cn = "耳朵掉落很少，Shrine of Akir的Al'Aketh掉得多得多。Stormchaser会治疗自己和同伴：打断它们，或一次只拉一个。"
zh_tw = "耳朵掉落很少，Shrine of Akir的Al'Aketh掉得多得多。Stormchaser會治療自己和同伴：打斷牠們，或一次只拉一個。"

