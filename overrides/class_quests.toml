# Class quests give the character power when turned in. The class quests the route must do come
# from the database (`m_class_requirement`: one per class spell, one per start zone's letter to the
# class trainer, those of overrides/database): the app lists them and the player takes some out.
#
# `power`: class requirements that make the character stronger (a pet, a form), by requirement
# name, with the power gained when the quest is turned in: fights take `1 / power` of their time
# afterwards (1.25 = 25% faster). It counts as levels of power like gear (1.4 = 3.2 levels), so the
# route goes for these quests early. The quest of a requirement the character can take gives it.

[warrior]

[paladin]

[hunter]
power = { "Beast Training" = 1.3 } # pet

[rogue]

[priest]

[shaman]

[mage]

[warlock]
# Imp (Horde, human, dwarf and gnome quests: nearly doubles the damage early on), Voidwalker.
power = { "Summon Imp" = 1.4, "Summon Voidwalker" = 1.2 }

[druid]
power = { "Bear Form" = 1.1 } # bear form
