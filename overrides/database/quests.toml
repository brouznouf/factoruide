[[quest]]
# The Blackwood Corrupted: the Talisman lies in Xabraxxis' Demon Bag, and Xabraxxis only comes
# once the Filled Cleansing Bowl (with the fruit, nut and grain samples) is set by the northern
# camp's bonfire. As an object objective it comes after the bowl and the samples (the step looted
# the Talisman before two of the samples and never said to use the bowl).
id = 4763
objectives = [{ type = "object", id = 177624, amount = 1, text = "Use the Filled Cleansing Bowl at the bonfire, kill Xabraxxis and loot the Talisman of Corruption" }]

