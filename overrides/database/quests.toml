# Manual corrections applied on top of every source by `fgd build`.
# They win over every source and in-game observations.
# Files here apply to every edition; overrides/<edition>/*.toml (forever, classic, tbc) only to
# that edition's database.
#
# [[quest]]
# id = 1234
# status = "removed"            # available | removed | incomplete
# reason = "Removed in Forever, NPC gone"
# name = "Corrected name"
# level = 12
# min_level = 8
# races_mask = 64               # bit (raceID - 1); Skyborne = 2^32 / 2^33
# classes_mask = 4              # bit (classID - 1): warrior 1, paladin 2, hunter 4, rogue 8...
# zone_or_sort = 1              # zone (AreaTable ID), or a category (-304 Cooking)
# required_skill_id = 0         # skill needed to be offered it (185 Cooking; 0: none)
# starts = [{ type = "npc", id = 123 }]
# ends = [{ type = "object", id = 456 }]
# remove_starts = [{ type = "npc", id = 789 }]
# pre_all = [100, 101]           # every quest required
# pre_any = [102]                # one of them required
# exclusive = [103]             # cannot both be done (both directions)
# reward_spell = 7328           # the spell it teaches (Redemption): a class quest teaching a
#                               # spell is required in the class's guides
# time_limit = 600              # timed quest: seconds from taking it to turn it in
#                               # (0: not timed), over the sources'
# start_wait = 1100             # mean seconds waited at the giver before it offers the
#                               # quest: a giver offering it only after an event that comes
#                               # back now and then (the guide tells the wait)
# objectives = [{ type = "creature", id = 6177, amount = 1 }]   # replace the sources' (creature,
#                               # object or item; talk: a creature healed or talked to, not
#                               # killed; text: what the step says)
# objectives = [{ type = "trigger", text = "Fill the waterskin", at = { zone = 44, x = 73.7, y = 61.6 } }]
#                               # a place to reach (an item used there, a potion drunk)
#
# [[spawn]]                     # a place no source knows (added to theirs)
# type = "npc"                  # npc | object
# id = 1234
# zone = 17                     # AreaTable ID of the zone
# x = 42.0                      # percent coordinates
# y = 60.9
#
# [[height]]                    # the height of a place no server data knows (yards: the floor it
# type = "npc"                  # stands on where several lie over each other, a tower's top),
# id = 1234                     # for the place of the entity at these coordinates (`fgd
# zone = 17                     # terrain-layers-cells` prints the floors' heights)
# x = 42.0
# y = 60.9
# z = 120.0
#
# [[npc]]                       # an NPC's side, over the sources'
# id = 1234
# friendly_to = "AH"            # A | H | AH: the sides it talks to

