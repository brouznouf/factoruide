# TBC Anniversary-only corrections (format: ../quests.toml).

[[quest]]
# Darnassus: In Search of Thaelrid has no race restriction in the sources, but Dawnwatcher
# Shaedlass gives it in Darnassus, out of the Horde's reach (`fg audit`, check islands).
id = 1198
races_mask = 1101 # the Alliance (draenei included)

# The blood elf and draenei class quests teaching a spell, which no source records (the quests'
# "You will learn"; only the 1.12 ones are known): required in their class's guides (the
# undead paladin's Redemption was missing on Forever, GitHub #12).
[[quest]]
id = 9600 # Redemption (draenei paladin)
