# Class trainer spells that make fights faster, by class: the share of the character's
# fighting power each spell brings once trained at its best rank (damage, healing that cuts
# the rest between fights, buffs). A spell not learned yet loses its whole share, a rank
# behind loses part of it (rank strength from the game data: damage per cast time, healing,
# buff value). `{ weight = w, ranks = false }`: only learning it matters, not its rank.
#
# Spells not listed do not count: the guide does not go to a trainer for them, and the
# training steps only list the spells that count. Talents are not counted.

