# Transport links (boats, zeppelins, trams, portals) used by the route planner.
# Coordinates are zone percent coordinates (AreaTable zone ID, x, y) of where you board.
# `seconds` = ride (the average wait `link_wait` is added, except with `instant = true`: portals,
# orbs, lifts). Links work both ways unless `one_way = true`. `races` (keys of races.toml): only
# those races can take it (default: every race of `faction`). `after_quest`: open once that
# quest is taken; with `while_held = true`, only while it is in the log (a quest's free flight).
#
# This file: the links of every game version; <edition>/travel.toml adds those of one version
# (forever, classic, tbc).
#
# Positions marked "npc" come from the zeppelin/ship masters' spawns in the database;
# "approx" ones are estimates to replace with values recorded in game (`transit` events
# of the Factoruide addon, imported by `fg collector`).

