# Flight to Auberdine (6342): Vesprystus flies the character to Auberdine for free while the
# quest is in the log, the Auberdine flight path known or not. The ride is the client's taxi
# path 102 (Rut'theran Village -> Auberdine, 2540 yards at the flight speed).
[[link]]
name = "Vesprystus's hippogryph to Auberdine"
faction = "Alliance"
from = { zone = 141, x = 58.4, y = 94.02 }   # npc Vesprystus
to = { zone = 148, x = 36.34, y = 45.58 }    # npc Caylais Moonfeather
seconds = 85
one_way = true
instant = true
after_quest = 6342
while_held = true

# The Feathermoon ferry (Feralas), from the client's transport path 303: docks and courses, the
# ride from their length as the other boats' (the way to the island goes around: longer).
[[link]]
name = "Feathermoon Ferry to the coast"
faction = "Alliance"
from = { zone = 357, x = 31.0, y = 39.5 }  # path 303: Feathermoon Stronghold's dock
to = { zone = 357, x = 43.13, y = 42.76 }  # path 303: the coast's dock
seconds = 100
one_way = true

[[link]]
name = "Feathermoon Ferry to Feathermoon Stronghold"
faction = "Alliance"
from = { zone = 357, x = 43.13, y = 42.76 }
to = { zone = 357, x = 31.0, y = 39.5 }
seconds = 340
one_way = true

# Rut'theran Village lies at the foot of Teldrassil: only this portal leads up to the top
# (area triggers 542 up, 527 down, next to each other on the Darnassus side).
[[link]]
name = "Portal Rut'theran Village - Darnassus"
faction = "Alliance"
from = { zone = 141, x = 55.87, y = 89.34 }  # area trigger 542
to = { zone = 1657, x = 29.13, y = 41.21 }   # area trigger 527
seconds = 5
instant = true

# --- Class teleports a quest teaches ---
# Taking "Moonglade" (level 10) teaches the druid Teleport: Moonglade (the quest's source spell
# in VMaNGOS): the bear form quests are done there. It lands next to Dendrite Starblaze.
[[teleport]]
name = "Teleport: Moonglade"
spell = 18960
class = "druid"
quest = "Moonglade"
to = { zone = 493, x = 56.26, y = 32.46 }
